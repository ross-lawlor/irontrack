<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IronTrack">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>IronTrack</title>
<style>
:root{
  --bg:#000;
  --card:#1c1c1e;
  --card-2:#2c2c2e;
  --card-3:#3a3a3c;
  --fill:rgba(118,118,128,.24);
  --fill-2:rgba(118,118,128,.16);
  --sep:rgba(84,84,88,.6);
  --label:#fff;
  --label-2:rgba(235,235,245,.6);
  --label-3:rgba(235,235,245,.3);
  --blue:#0a84ff; --blue-soft:rgba(10,132,255,.18);
  --green:#30d158; --green-soft:rgba(48,209,88,.16);
  --orange:#ff9f0a; --orange-soft:rgba(255,159,10,.16);
  --red:#ff453a; --red-soft:rgba(255,69,58,.16);
  --indigo:#5e5ce6; --purple:#bf5af2; --gray:#8e8e93;
  --on-green:#002b0e;
  --r:14px;
  --tab-h:50px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --dock-h:0px;
  --ease:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:dark}
body{background:var(--bg);color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased;min-height:100vh;overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
body.sheet-open{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
input,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}
.muted{color:var(--label-2)}
.faint{color:var(--label-3)}
.small{font-size:13px}
.center{text-align:center}
svg.i{width:22px;height:22px;flex:none}

/* ---------- Views ---------- */
.view{display:none;padding:calc(var(--safe-t) + 6px) 16px calc(var(--tab-h) + var(--safe-b) + var(--dock-h) + 32px);max-width:640px;margin:0 auto}
.view.active{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:44px;gap:8px}
.topbar .grp{display:flex;gap:8px;align-items:center}
.large-title{font-size:34px;font-weight:700;letter-spacing:.3px;line-height:1.2;margin:2px 0 16px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:28px 2px 10px}
.section-h h2{font-size:22px;font-weight:700;letter-spacing:.2px}
.link{color:var(--blue);font-size:17px}
.group-h{font-size:13px;color:var(--label-2);text-transform:uppercase;letter-spacing:.4px;margin:24px 16px 7px;font-weight:500}
.caption{font-size:13px;color:var(--label-2);margin:8px 16px 0;line-height:1.4}
.lbl{display:block;font-size:13px;color:var(--label-2);text-transform:uppercase;letter-spacing:.4px;margin:20px 4px 8px}

/* ---------- Surfaces ---------- */
.card{background:var(--card);border-radius:var(--r);padding:16px}
.card + .card{margin-top:12px}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.card-h h3{font-size:17px;font-weight:600}
.list{background:var(--card);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:50px;position:relative;width:100%;text-align:left}
.list > .row:not(:last-child)::after{content:"";position:absolute;left:16px;right:0;bottom:0;height:.5px;background:var(--sep)}
.list > .row.has-ico:not(:last-child)::after{left:57px}
.row .grow{flex:1;min-width:0}
.grow{flex:1;min-width:0}
.row .title{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:13px;color:var(--label-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub.wrap{white-space:normal;line-height:1.45}
.row .trail{color:var(--label-2);font-size:15px;display:flex;align-items:center;gap:6px;flex:none;max-width:55%;text-align:right}
.row .trail span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.tap:active{background:var(--card-2)}
.row.red{color:var(--red)}
.chev{width:16px;height:16px;color:var(--label-3);flex:none}
.set-ico{width:29px;height:29px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.set-ico svg{width:18px;height:18px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 20px;border-radius:12px;font-size:17px;font-weight:600;transition:transform .12s,opacity .12s;white-space:nowrap}
.btn:active{transform:scale(.97);opacity:.85}
.btn svg{width:20px;height:20px}
.btn-block{width:100%}
.btn-primary{background:var(--blue);color:#fff}
.btn-green{background:var(--green);color:var(--on-green)}
.btn-tinted{background:var(--blue-soft);color:var(--blue)}
.btn-gray{background:var(--fill);color:var(--label)}
.btn-danger{background:var(--red-soft);color:var(--red)}
.btn-sm{height:34px;padding:0 14px;border-radius:17px;font-size:15px}
.btn-sm svg{width:16px;height:16px}
.btn-icon{width:34px;height:34px;border-radius:17px;display:inline-flex;align-items:center;justify-content:center;background:var(--fill-2);color:var(--blue);flex:none}
.btn-icon svg{width:20px;height:20px}
.btn-icon.lg{width:50px;height:50px;border-radius:25px;font-size:26px;font-weight:500}
.btn-icon[disabled],.btn[disabled],.text-btn[disabled]{opacity:.3;pointer-events:none}
.text-btn{color:var(--blue);font-size:17px;padding:8px 6px;min-height:44px}
.text-btn.bold{font-weight:600}
.text-btn.red{color:var(--red)}

/* ---------- Tab bar & dock ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:space-around;padding:0 4px var(--safe-b);height:calc(var(--tab-h) + var(--safe-b));background:rgba(22,22,24,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#8e8e93;font-size:10px;font-weight:500;letter-spacing:.1px;max-width:110px}
.tab svg{width:25px;height:25px}
.tab.active{color:var(--blue)}
.dock{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + var(--safe-b));z-index:49;padding:0 10px 8px;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:640px;margin:0 auto}
.dock > *{pointer-events:auto}
.rest-pill{display:flex;align-items:center;gap:10px;background:rgba(44,44,46,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:18px;padding:8px 8px 8px 10px;box-shadow:0 8px 30px rgba(0,0,0,.5);border:.5px solid rgba(255,255,255,.08);animation:up .3s var(--ease)}
.rest-ring{width:40px;height:40px;flex:none}
.rest-time{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.rest-label{font-size:11px;color:var(--label-2);font-weight:600;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest-pill .btn-sm{padding:0 11px}
.rest-pill.done{background:var(--green);color:var(--on-green);font-weight:700;justify-content:center;padding:14px;font-size:17px}
.rest-pill.done svg{width:22px;height:22px}
.mini-bar{display:flex;align-items:center;gap:10px;background:var(--blue);border-radius:14px;padding:12px 14px;color:#fff;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.45);animation:up .3s var(--ease);width:100%;text-align:left}
.mini-bar .pulse{width:9px;height:9px;border-radius:50%;background:#fff;animation:pulse 1.6s infinite;flex:none}
.mini-bar svg{width:18px;height:18px}
@keyframes pulse{50%{opacity:.3}}
@keyframes up{from{transform:translateY(16px);opacity:0}}

/* ---------- Hero & tiles ---------- */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:20px;background:linear-gradient(140deg,#0a84ff 0%,#5e5ce6 100%);color:#fff}
.hero::after{content:"";position:absolute;right:-50px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.09)}
.hero-k{font-size:13px;font-weight:600;opacity:.85;text-transform:uppercase;letter-spacing:.5px;position:relative}
.hero-t{font-size:26px;font-weight:700;margin:4px 0 16px;letter-spacing:.2px;position:relative}
.hero-btn{background:#fff;color:#0a84ff;position:relative;z-index:1}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{background:var(--card);border-radius:var(--r);padding:12px 14px;min-width:0}
.tile[data-a]{cursor:pointer}
.tile[data-a]:active{background:var(--card-2)}
.tile .k{font-size:13px;color:var(--label-2);font-weight:500;display:flex;align-items:center;gap:4px;white-space:nowrap}
.tile .k svg{width:14px;height:14px}
.tile .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:3px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiles.three .tile{padding:12px}
.tiles.three .tile .v{font-size:20px}
.tile .v small{font-size:14px;font-weight:600;color:var(--label-2);margin-left:3px}
.tile .d{font-size:12px;color:var(--label-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nudge{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r);padding:12px 12px 12px 14px;margin-top:12px}
.nudge .ico{width:34px;height:34px;border-radius:9px;background:var(--orange-soft);color:var(--orange);display:flex;align-items:center;justify-content:center;flex:none}
.nudge .ico svg{width:20px;height:20px}
.nudge .t{font-size:15px;font-weight:600}
.nudge .s{font-size:13px;color:var(--label-2)}
.nudge .s svg{width:15px;height:15px;vertical-align:-2px;color:var(--blue)}

/* ---------- Routines ---------- */
.routines{display:grid;gap:10px}
.routine{background:var(--card);border-radius:var(--r);padding:14px 14px 14px 16px;display:flex;flex-direction:column;gap:4px}
.routine-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.routine-name{font-size:18px;font-weight:600}
.routine-ex{font-size:14px;color:var(--label-2);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.routine-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}

/* ---------- Chips / segmented / fields ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:12px -16px 4px;padding:0 16px 2px}
.chips::-webkit-scrollbar{display:none}
.chip-wrap{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:none;height:32px;padding:0 14px;border-radius:16px;background:var(--fill-2);color:var(--label);font-size:15px;font-weight:500}
.chip.on{background:var(--blue);color:#fff}
.seg{display:flex;background:var(--fill-2);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;height:30px;border-radius:7px;font-size:13px;font-weight:600;color:var(--label);text-align:center;padding:0 10px}
.seg button.on{background:#636366;box-shadow:0 3px 8px rgba(0,0,0,.15)}
.field{width:100%;height:44px;background:var(--card-2);border:0;border-radius:10px;padding:0 12px;font-size:17px;outline:none;-webkit-appearance:none;appearance:none}
.field:focus{box-shadow:0 0 0 2px var(--blue) inset}
.sheet .field{background:var(--card-2)}
.field-lg{height:52px;font-size:20px;font-weight:600}
textarea.field{height:auto;min-height:76px;padding:10px 12px;resize:vertical;line-height:1.4}
.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--label-2);pointer-events:none}
.search-wrap .field{padding-left:36px;height:38px;background:var(--fill-2)}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none}
.switch{position:relative;width:51px;height:31px;flex:none;appearance:none;-webkit-appearance:none;background:var(--card-3);border-radius:16px;transition:background .2s;cursor:pointer;outline:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15);transition:transform .22s var(--ease)}
.switch:checked{background:var(--green)}
.switch:checked::after{transform:translateX(20px)}
.stepper{display:inline-flex;align-items:center;background:var(--fill-2);border-radius:9px;height:32px;flex:none}
.stepper button{width:38px;height:32px;font-size:20px;color:var(--label);text-align:center;line-height:1}
.stepper span{min-width:52px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;font-size:15px}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--blue);background:var(--blue-soft);padding:2px 8px;border-radius:6px;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--orange-soft);color:var(--orange)}
.badge svg{width:12px;height:12px}

/* ---------- Workout editor ---------- */
.ed-name{width:100%;background:none;border:0;outline:none;font-size:28px;font-weight:700;letter-spacing:.2px;padding:0;margin:2px 0 4px;text-overflow:ellipsis}
.ed-name::placeholder{color:var(--label-3)}
.ed-meta{display:flex;gap:16px;color:var(--label-2);font-size:15px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.ed-meta span{display:inline-flex;align-items:center;gap:5px}
.ed-meta svg{width:16px;height:16px}
.ed-meta b{color:var(--label);font-weight:600;font-variant-numeric:tabular-nums}
.ed-dt{background:var(--fill-2);border:0;border-radius:8px;padding:6px 8px;font-size:15px;color:var(--label);outline:none;-webkit-appearance:none}
.ed-empty{text-align:center;color:var(--label-2);padding:32px 16px 24px;font-size:15px}
.ed-empty svg{width:40px;height:40px;color:var(--label-3);margin-bottom:8px}
.ed-notes{margin-top:14px}
.ex-card{background:var(--card);border-radius:var(--r);padding:10px 10px 10px;margin-bottom:12px}
.sheet .ex-card{background:var(--card-2)}
.ex-head{display:flex;align-items:center;gap:8px;padding:0 2px 0 4px}
.ex-name{flex:1;text-align:left;color:var(--blue);font-size:17px;font-weight:600;min-height:34px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-sub{font-size:13px;color:var(--label-2);padding:0 4px 8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ex-sub span{display:inline-flex;align-items:center;gap:3px}
.ex-sub svg{width:13px;height:13px}
.ex-sub .pr{color:var(--orange)}
.ex-sub .dot{color:var(--label-3)}
.set-grid{display:grid;grid-template-columns:32px minmax(0,1fr) 70px 58px 42px;gap:6px;align-items:center}
.set-head{font-size:11px;font-weight:600;color:var(--label-3);text-transform:uppercase;letter-spacing:.4px;padding:0 4px 4px;text-align:center}
.set-head svg{width:14px;height:14px;margin:0 auto;display:block}
.set-row{padding:3px 4px;border-radius:9px;transition:background .2s}
.set-row.done{background:var(--green-soft)}
.set-num{height:32px;border-radius:8px;font-weight:700;font-size:15px;color:var(--label);background:var(--fill-2);text-align:center;display:flex;align-items:center;justify-content:center}
.set-num svg{width:16px;height:16px}
.set-row.pr .set-num{background:var(--orange-soft);color:var(--orange)}
.set-prev{height:32px;color:var(--label-2);font-size:14px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.set-prev[disabled]{color:var(--label-3)}
.set-in{width:100%;height:32px;border:0;border-radius:8px;background:var(--fill-2);text-align:center;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;outline:none;-webkit-appearance:none;appearance:none;padding:0 2px}
.set-in::placeholder{color:var(--label-3);font-weight:500}
.set-in:focus{background:var(--card-3);box-shadow:0 0 0 1.5px var(--blue) inset}
.set-row.done .set-in{background:transparent}
.set-check{height:32px;border-radius:8px;background:var(--fill-2);color:var(--label-3);display:flex;align-items:center;justify-content:center}
.set-check svg{width:20px;height:20px;stroke-width:2.6}
.set-row.done .set-check{background:var(--green);color:var(--on-green)}
.set-row.just .set-check{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.18)}}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.add-set{width:100%;height:36px;margin-top:6px;border-radius:9px;background:var(--fill-2);color:var(--label);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.add-set svg{width:16px;height:16px}
.editor.edit .set-grid{grid-template-columns:32px minmax(0,1fr) 78px 64px}
.editor.edit .set-check,.editor.edit .set-head span:last-child{display:none}
.editor.edit .set-row.done{background:none}
.editor.edit .set-row.done .set-in{background:var(--fill-2)}

/* ---------- History ---------- */
.month-h{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--label-2);text-transform:uppercase;letter-spacing:.4px;margin:22px 4px 8px}
.month-h:first-of-type{margin-top:4px}
.sess{background:var(--card);border-radius:var(--r);padding:14px 16px;width:100%;text-align:left;display:block}
.sess:active{background:var(--card-2)}
.sess + .sess{margin-top:10px}
.sess-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sess-name{font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess-date{font-size:13px;color:var(--label-2);white-space:nowrap}
.sess-stats{display:flex;gap:14px;font-size:13px;color:var(--label-2);margin:5px 0 9px;flex-wrap:wrap;align-items:center}
.sess-stats > span{display:inline-flex;align-items:center;gap:4px}
.sess-stats svg{width:14px;height:14px}
.sess-ex{font-size:14px;line-height:1.55}
.sess-ex div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Detail sheets ---------- */
.sheet-h1{font-size:28px;font-weight:700;margin:2px 0 6px;letter-spacing:.2px;line-height:1.2}
.meta-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.meta-row span{display:inline-flex;align-items:center;gap:4px}
.meta-row svg{width:14px;height:14px}
.sheet .tile,.sheet .card,.sheet .list{background:var(--card-2)}
.sheet .row.tap:active{background:var(--card-3)}
.sheet .list > .row:not(:last-child)::after{background:rgba(84,84,88,.5)}
.det-ex{padding:12px 14px}
.det-ex-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.link-name{color:var(--blue);font-weight:600;font-size:17px;text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.det-set{display:grid;grid-template-columns:26px 1fr auto;gap:8px;padding:6px 0;font-size:15px;border-top:.5px solid var(--sep);font-variant-numeric:tabular-nums}
.det-set:first-child{border-top:0}
.det-set .n{color:var(--label-3);font-weight:600}
.pr-line{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:15px}
.pr-line svg{width:16px;height:16px;color:var(--orange)}
.btn-col{display:grid;gap:10px;margin-top:24px}
.done-badge{width:72px;height:72px;border-radius:50%;margin:8px auto 12px;display:flex;align-items:center;justify-content:center;background:var(--green);color:var(--on-green);animation:pop .5s var(--ease)}
.done-badge.pr{background:var(--orange);color:#2b1a00}
.done-badge svg{width:36px;height:36px;stroke-width:2.4}
.pick-dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--card-3);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none;color:#fff}
.pick-dot.on{background:var(--blue);border-color:var(--blue)}
.pick-dot.add{border:0;background:var(--blue-soft);color:var(--blue)}
.pick-dot svg{width:16px;height:16px}

/* ---------- Charts ---------- */
.chart{position:relative;width:100%;height:190px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart svg{display:block}
.chart .ax{font-size:11px;fill:var(--label-3);font-variant-numeric:tabular-nums}
.chart .tip{position:absolute;top:-4px;pointer-events:none;background:var(--card-3);border-radius:8px;padding:5px 9px;font-size:12px;color:var(--label-2);white-space:nowrap;transform:translateX(-50%);opacity:0;transition:opacity .12s;box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:2}
.chart .tip b{display:block;font-size:15px;color:var(--label);font-variant-numeric:tabular-nums}
.chart .tip.show{opacity:1}
.chart-empty{height:140px;display:flex;align-items:center;justify-content:center;color:var(--label-3);font-size:15px;text-align:center;padding:0 20px}
.hbar{display:grid;grid-template-columns:80px 1fr 34px;align-items:center;gap:10px;font-size:14px;padding:5px 0}
.hbar .track{height:10px;border-radius:5px;background:var(--fill-2);overflow:hidden}
.hbar .fill{height:100%;border-radius:5px;background:var(--blue);min-width:4px}
.hbar .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--label-2)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 4px;text-align:center}
.cal-dow{font-size:11px;color:var(--label-3);font-weight:600;padding-bottom:2px}
.cal-day{width:100%;max-width:38px;aspect-ratio:1;margin:0 auto;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:15px;font-variant-numeric:tabular-nums;color:var(--label-2)}
.cal-day.has{background:var(--blue);color:#fff;font-weight:600}
.cal-day.today{box-shadow:0 0 0 1.5px var(--blue) inset;color:var(--label)}
.cal-day.has.today{box-shadow:0 0 0 2px #fff inset}

/* ---------- Plates ---------- */
.plate-input{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:8px}
.pi-wrap{display:flex;align-items:baseline;gap:6px;background:var(--card-2);border-radius:14px;padding:6px 16px}
.pi{width:120px;background:none;border:0;outline:none;text-align:right;font-size:40px;font-weight:700;font-variant-numeric:tabular-nums}
.pi-wrap span{font-size:20px;color:var(--label-2);font-weight:600}
.bar-vis{display:flex;align-items:center;justify-content:center;height:160px;margin:18px 0 6px}
.bv-shaft{width:64px;height:12px;background:linear-gradient(#aeaeb2,#636366);border-radius:2px 0 0 2px}
.bv-collar{width:10px;height:30px;background:#636366;border-radius:2px}
.bv-plate{width:15px;border-radius:4px;margin-left:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.bv-sleeve{width:36px;height:16px;background:linear-gradient(#c7c7cc,#8e8e93);border-radius:0 3px 3px 0}
.plate-text{text-align:center;font-size:17px;line-height:1.5}
.plate-text b{font-variant-numeric:tabular-nums}

/* ---------- Sheets ---------- */
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .3s}
.sheet-backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--card);border-radius:14px 14px 0 0;max-height:calc(100% - var(--safe-t) - 10px);display:flex;flex-direction:column;transform:translateY(105%);transition:transform .4s var(--ease);box-shadow:0 -10px 40px rgba(0,0,0,.4)}
.sheet.show{transform:none}
.sheet.full{height:calc(100% - var(--safe-t) - 10px)}
.sheet-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 10px 2px;min-height:54px;flex:none;position:relative;touch-action:none}
.sheet-head::before{content:"";position:absolute;top:5px;left:50%;width:36px;height:5px;border-radius:3px;background:var(--card-3);transform:translateX(-50%)}
.sheet-head .l{justify-self:start}
.sheet-head .r{justify-self:end}
.sheet-title{font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px calc(28px + var(--safe-b));flex:1;overscroll-behavior:contain}

/* ---------- Dialogs / action sheets / toast ---------- */
.alert-wrap{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);padding:24px;animation:fade .2s}
.alert{width:280px;background:rgba(44,44,46,.97);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:14px;overflow:hidden;text-align:center;animation:zoom .25s var(--ease)}
.alert.wide{width:min(340px,100%)}
.alert-body{padding:19px 16px 16px}
.alert-title{font-size:17px;font-weight:600}
.alert-msg{font-size:13px;margin-top:4px;line-height:1.4}
.alert-input{margin-top:14px;background:var(--card)!important;font-size:15px}
textarea.alert-input{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.alert-btns{display:flex;border-top:.5px solid var(--sep)}
.alert-btns.stack{flex-direction:column}
.alert-btns button{flex:1;min-height:44px;color:var(--blue);font-size:17px;text-align:center;padding:0 8px}
.alert-btns:not(.stack) button + button{border-left:.5px solid var(--sep)}
.alert-btns.stack button + button{border-top:.5px solid var(--sep)}
.alert-btns .bold{font-weight:600}
.alert-btns .red{color:var(--red)}
@keyframes zoom{from{transform:scale(1.12);opacity:0}}
.as-wrap{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.45);display:flex;flex-direction:column;justify-content:flex-end;padding:8px 8px calc(8px + var(--safe-b));animation:fade .2s}
.as-sheet{animation:up .3s var(--ease);max-width:624px;width:100%;margin:0 auto}
.as-group{background:rgba(44,44,46,.97);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:14px;overflow:hidden}
.as-group + .as-group{margin-top:8px}
.as-title{font-size:13px;color:var(--label-2);padding:14px 16px;text-align:center;border-bottom:.5px solid var(--sep)}
.as-btn{display:block;width:100%;height:56px;font-size:19px;color:var(--blue);text-align:center}
.as-btn + .as-btn{border-top:.5px solid var(--sep)}
.as-btn.red{color:var(--red)}
.as-btn.bold{font-weight:600}
.as-btn:active{background:var(--card-3)}
.toast{position:fixed;top:calc(var(--safe-t) + 10px);left:50%;transform:translate(-50%,-160%);z-index:400;background:rgba(58,58,60,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:10px 18px;border-radius:22px;font-size:15px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.45);transition:transform .35s var(--ease);max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.show{transform:translate(-50%,0)}
.kbd-bar{position:fixed;left:0;right:0;bottom:0;z-index:250;display:flex;gap:8px;padding:8px 10px;background:rgba(36,36,38,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--sep)}
.kbd-bar button{height:38px;min-width:54px;padding:0 12px;border-radius:9px;background:var(--card-3);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;gap:6px}
.kbd-bar button svg{width:18px;height:18px}
.kbd-bar .sp{flex:1}
.kbd-bar .ok{background:var(--green);color:var(--on-green)}

/* ---------- Empty ---------- */
.empty{text-align:center;padding:40px 24px;color:var(--label-2);font-size:15px;line-height:1.45}
.empty svg{width:46px;height:46px;color:var(--label-3);margin-bottom:12px}
.empty h3{color:var(--label);font-size:20px;margin-bottom:6px}
.empty .btn{margin-top:18px}
</style>
</head>
<body>
<div id="app">
  <main>
    <section class="view" id="v-workout"></section>
    <section class="view" id="v-history"></section>
    <section class="view" id="v-progress"></section>
    <section class="view" id="v-exercises"></section>
    <section class="view" id="v-settings"></section>
  </main>
  <div class="dock" id="dock"></div>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div class="kbd-bar hidden" id="kbd"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file-in" accept=".json,application/json,text/plain" hidden>

<script>
'use strict';
/* =========================================================
   IronTrack v4 — single-file workout tracker
   Data lives in localStorage under KEY. v3 data (it_exercises /
   it_history) is migrated automatically and left untouched.
   All weights are stored in kg and converted for display.
   ========================================================= */

const KEY = 'irontrack_v4';
const CATS = ['Chest','Back','Shoulders','Legs','Arms','Core','Other'];
const LB = 0.45359237;
const DEFAULT_EX = [
  ['Bench Press','Chest'],['Incline Dumbbell Press','Chest'],['Dumbbell Fly','Chest'],['Dips','Chest'],
  ['Deadlift','Back'],['Barbell Row','Back'],['Pull-Up','Back'],['Lat Pulldown','Back'],['Seated Cable Row','Back'],
  ['Overhead Press','Shoulders'],['Lateral Raise','Shoulders'],['Face Pull','Shoulders'],
  ['Squat','Legs'],['Romanian Deadlift','Legs'],['Leg Press','Legs'],['Walking Lunge','Legs'],['Leg Curl','Legs'],['Calf Raise','Legs'],
  ['Barbell Curl','Arms'],['Hammer Curl','Arms'],['Tricep Pushdown','Arms'],['Skull Crusher','Arms'],
  ['Hanging Leg Raise','Core'],['Cable Crunch','Core'],['Ab Wheel Rollout','Core']
];
const PLATE_COLORS = {
  kg:{25:'#ff453a',20:'#0a84ff',15:'#ffd60a',10:'#30d158',5:'#e5e5ea',2.5:'#48484a',1.25:'#aeaeb2',0.5:'#8e8e93'},
  lb:{45:'#0a84ff',35:'#ffd60a',25:'#30d158',10:'#e5e5ea',5:'#ff453a',2.5:'#48484a'}
};

/* ---------- Icons ---------- */
const ICONS = {
  dumbbell:'<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  chart:'<path d="M4 20h16"/><path d="M7 16v-5M12 16V6M17 16v-8"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r=".8" fill="currentColor"/><circle cx="4.5" cy="12" r=".8" fill="currentColor"/><circle cx="4.5" cy="18" r=".8" fill="currentColor"/>',
  gear:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  chevR:'<path d="M9 5l7 7-7 7"/>',
  chevL:'<path d="M15 5l-7 7 7 7"/>',
  more:'<circle cx="5" cy="12" r="1.8" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.8" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.8" fill="currentColor" stroke="none"/>',
  trophy:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',
  timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2h5"/>',
  flame:'<path d="M12 22c4 0 7-2.8 7-7 0-3.5-2.2-5.6-4-8.5-.6 2-1.6 3-2.8 3.2C12.6 7 11.5 4.3 9 2c.3 4-4 6.4-4 12.5C5 19 8 22 12 22z"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  pencil:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>',
  download:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  upload:'<path d="M12 16V5M7 10l5-5 5 5M5 20h14"/>',
  paste:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 11h6M9 15h4"/>',
  table:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M4 15h16M10 4v16"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  stack:'<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',
  plates:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/>',
  sound:'<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>',
  phone:'<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  play:'<path d="M7 5l12 7-12 7V5z"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/>',
  scale:'<path d="M12 4v16M6 20h12M5 8h14M5 8l-2.5 6a3 3 0 0 0 5 0L5 8zM19 8l-2.5 6a3 3 0 0 0 5 0L19 8z"/>',
  share:'<path d="M12 3v12M8 7l4-4 4 4"/><path d="M7 10H5v11h14V10h-2"/>',
  repeat:'<path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/>'
};
const ic = (n, cls='i') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||''}</svg>`;
const chev = () => ic('chevR','chev');

/* ---------- Small helpers ---------- */
const $ = (sel, root=document) => root.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,'0');
const toNum = v => parseFloat(String(v ?? '').trim().replace(',', '.'));
const plural = (n, w) => `${n} ${w}${n===1?'':'s'}`;
function fmtNum(n, dp=2){ if(n==null || isNaN(n)) return ''; const f = 10**dp; return String(Math.round(n*f)/f); }
const U = () => S.settings.unit;
const toDisp = kg => U()==='lb' ? kg/LB : kg;
const fromDisp = v => U()==='lb' ? v*LB : v;
const fmtW = kg => fmtNum(toDisp(kg), U()==='lb' ? 1 : 2);
const fmtW1 = kg => fmtNum(toDisp(kg), 1);
const fmtVol = kg => Math.round(toDisp(kg)).toLocaleString();
function fmtCompact(kg){ const v = toDisp(kg); return v >= 10000 ? fmtNum(v/1000, v>=100000?0:1)+'k' : Math.round(v).toLocaleString(); }
const setStr = s => (s.w>0 ? fmtW(s.w) : 'BW') + ' × ' + s.r;
const e1rm = (w, r) => (!r || !w) ? 0 : r===1 ? w : w*(1 + r/30);
function dayKey(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function startOfWeek(d){ const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - (x.getDay()+6)%7); return x; }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function fmtClock(sec){ sec = Math.max(0, Math.round(sec)); return Math.floor(sec/60) + ':' + pad(sec%60); }
function fmtDur(ms){ const s = Math.max(0, Math.floor(ms/1000)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60); return h ? `${h}:${pad(m)}:${pad(s%60)}` : `${m}:${pad(s%60)}`; }
function fmtDurShort(ms){ const m = Math.max(1, Math.round(ms/60000)); return m < 60 ? m+' min' : Math.floor(m/60)+'h '+pad(m%60)+'m'; }
function sessDur(s){ return (s.end && !s.legacy) ? new Date(s.end) - new Date(s.start) : null; }
function relDay(iso){
  const d = new Date(iso), t = new Date(); t.setHours(0,0,0,0);
  const dd = new Date(d); dd.setHours(0,0,0,0);
  const diff = Math.round((t - dd)/864e5);
  if(diff === 0) return 'Today';
  if(diff === 1) return 'Yesterday';
  if(diff > 1 && diff < 7) return diff + ' days ago';
  if(diff >= 7 && diff < 30) return diff < 14 ? '1 week ago' : Math.floor(diff/7) + ' weeks ago';
  return d.toLocaleDateString(undefined, {day:'numeric', month:'short', year: d.getFullYear()!==t.getFullYear() ? 'numeric' : undefined});
}
function relPhrase(iso){ const r = relDay(iso); return /ago$|^Today$|^Yesterday$/.test(r) ? r.toLowerCase() : 'on ' + r; }
function fmtTime(iso){ return new Date(iso).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }
function fmtLongDate(iso){ return new Date(iso).toLocaleDateString(undefined, {weekday:'long', day:'numeric', month:'long', year:'numeric'}); }
function toLocalInput(iso){ const d = new Date(iso); return new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,16); }
function defaultName(d=new Date()){ const h = d.getHours(); return (h<5?'Night':h<12?'Morning':h<17?'Afternoon':h<21?'Evening':'Night') + ' Workout'; }
function autoName(cats){ if(!cats.length) return 'Workout'; if(cats.length >= 3) return 'Full Body'; return cats.join(' & '); }

/* Per-device UI preferences (not part of workout data or backups) */
function prefGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function prefSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
const isStandalone = () => window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isHosted = location.protocol === 'https:';

/* =========================================================
   State & persistence
   ========================================================= */
let S;
let migratedCount = 0;

function defaultSettings(){
  return { unit:'kg', rest:90, autoRest:true, sound:true, vibrate:true, keepAwake:true,
    bar:{kg:20, lb:45}, plates:{kg:[25,20,15,10,5,2.5,1.25], lb:[45,35,25,10,5,2.5]}, lastBackup:null };
}
function defaultExercises(){ return DEFAULT_EX.map(([name,cat]) => ({id:uid(), name, cat})); }
function freshState(){ return { v:4, settings:defaultSettings(), exercises:[], routines:[], sessions:[], active:null }; }

function cleanSets(sets){
  return (Array.isArray(sets) ? sets : []).map(s => ({ w: Math.max(0, toNum(s.w ?? s.weight) || 0), r: Math.round(toNum(s.r ?? s.reps) || 0) })).filter(s => s.r > 0);
}
function normalize(d){
  const st = freshState();
  const s = d.settings || {};
  st.settings = { ...st.settings, ...s, bar:{...st.settings.bar, ...(s.bar||{})}, plates:{...st.settings.plates, ...(s.plates||{})} };
  if(!['kg','lb'].includes(st.settings.unit)) st.settings.unit = 'kg';
  st.exercises = (d.exercises||[]).filter(e => e && e.id != null && e.name).map(e => {
    const o = { id:String(e.id), name:String(e.name), cat: CATS.includes(e.cat) ? e.cat : 'Other' };
    if(+e.rest > 0) o.rest = +e.rest;
    return o;
  });
  st.routines = (d.routines||[]).filter(r => r && r.id).map(r => ({ id:String(r.id), name:String(r.name||'Routine'),
    items:(r.items||[]).filter(i => i && i.exId != null).map(i => ({ exId:String(i.exId), sets: Math.max(1, Math.min(12, Math.round(+i.sets) || 3)) })) }));
  st.sessions = (d.sessions||[]).filter(x => x && x.id && x.start && Array.isArray(x.entries)).map(x => ({
    id:String(x.id), name:String(x.name||'Workout'), start:x.start, end:x.end||null, legacy:!!x.legacy,
    routineId:x.routineId||null, notes:String(x.notes||''),
    entries: x.entries.filter(e => e && e.exId != null).map(e => ({ exId:String(e.exId), name:String(e.name||'Exercise'), cat:CATS.includes(e.cat)?e.cat:'Other', sets:cleanSets(e.sets) })).filter(e => e.sets.length)
  })).filter(x => x.entries.length);
  st.active = (d.active && Array.isArray(d.active.entries)) ? d.active : null;
  return st;
}

/* v3 stored one log per exercise; v4 groups a day's logs into one session. */
function fromV3(d){
  const exercises = (d.exercises||[]).filter(e => e && e.id != null).map(e => ({ id:String(e.id), name:String(e.name||'Exercise'), cat: CATS.includes(e.category) ? e.category : 'Other' }));
  const logs = (d.history||[]).filter(l => l && l.date && Array.isArray(l.sets)).slice().sort((a,b) => new Date(a.date) - new Date(b.date));
  const byDay = new Map();
  for(const l of logs){ const k = dayKey(new Date(l.date)); if(!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(l); }
  const sessions = [];
  for(const [k, dayLogs] of byDay){
    const entries = [];
    for(const l of dayLogs){
      const sets = cleanSets(l.sets);
      if(!sets.length) continue;
      const exId = String(l.exerciseId);
      const found = entries.find(e => e.exId === exId);
      if(found) found.sets.push(...sets);
      else entries.push({ exId, name:String(l.exerciseName||'Exercise'), cat: CATS.includes(l.category) ? l.category : 'Other', sets });
    }
    if(!entries.length) continue;
    sessions.push({ id:'v3-'+k, name:autoName([...new Set(entries.map(e => e.cat))]), start:dayLogs[0].date, end:dayLogs[dayLogs.length-1].date, legacy:true, routineId:null, notes:'', entries });
  }
  return { exercises, sessions };
}

function load(){
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch(e){}
  if(raw){ try { return normalize(JSON.parse(raw)); } catch(e){ console.error('Bad saved data', e); } }
  const st = freshState();
  let v3ex = null, v3hist = null;
  try { v3ex = JSON.parse(localStorage.getItem('it_exercises') || 'null'); v3hist = JSON.parse(localStorage.getItem('it_history') || 'null'); } catch(e){}
  if(Array.isArray(v3hist) && v3hist.length){
    const c = fromV3({ exercises: Array.isArray(v3ex) ? v3ex : [], history: v3hist });
    st.exercises = c.exercises.length ? c.exercises : defaultExercises();
    st.sessions = c.sessions;
    migratedCount = c.sessions.length;
  } else if(Array.isArray(v3ex) && v3ex.length){
    st.exercises = fromV3({ exercises: v3ex, history: [] }).exercises;
  } else {
    st.exercises = defaultExercises();
  }
  return st;
}

/* =========================================================
   Derived data (cached until the next save)
   ========================================================= */
let C = null;
function invalidate(){ C = null; }
function entryBest(sets){
  let w=0, wr=0, e=0, eW=0, eR=0, r=0;
  for(const x of sets){
    if(x.w > w || (x.w === w && x.r > wr)){ w = x.w; wr = x.r; }
    const v = e1rm(x.w, x.r); if(v > e){ e = v; eW = x.w; eR = x.r; }
    if(x.r > r) r = x.r;
  }
  return { w, wr, e, eW, eR, r };
}
function mergeBest(b, x){
  if(x.w > b.w || (x.w === b.w && x.wr > b.wr)){ b.w = x.w; b.wr = x.wr; }
  if(x.e > b.e){ b.e = x.e; b.eW = x.eW; b.eR = x.eR; }
  if(x.r > b.r) b.r = x.r;
}
function cache(){
  if(C) return C;
  const sorted = S.sessions.slice().sort((a,b) => new Date(a.start) - new Date(b.start));
  const byEx = {}, prs = {}, best = {};
  for(const s of sorted){
    const list = [];
    for(const e of s.entries){
      (byEx[e.exId] = byEx[e.exId] || []).push({ s, e });
      const x = entryBest(e.sets), b = best[e.exId];
      if(!b){ best[e.exId] = { ...x }; continue; }
      if(x.w > b.w) list.push({ exId:e.exId, kind:'w', w:x.w, r:x.wr });
      else if(x.w > 0 && x.e > b.e + 0.01) list.push({ exId:e.exId, kind:'e', e:x.e, w:x.eW, r:x.eR });
      else if(x.w === 0 && b.w === 0 && x.r > b.r) list.push({ exId:e.exId, kind:'r', r:x.r });
      mergeBest(b, x);
    }
    if(list.length) prs[s.id] = list;
  }
  C = { sorted, byEx, prs, best };
  return C;
}
function prText(p){
  if(p.kind === 'w') return { label:'Heaviest weight', text:`${fmtW(p.w)} ${U()} × ${p.r}` };
  if(p.kind === 'e') return { label:`Best est. 1RM (${fmtW(p.w)} × ${p.r})`, text:`${fmtW1(p.e)} ${U()}` };
  return { label:'Most reps', text:`${p.r} reps` };
}
/* History for an exercise strictly before a draft (excluding the draft itself). */
function priorEntries(exId, draft){
  const h = cache().byEx[exId] || [];
  if(!draft) return h;
  const t = new Date(draft.start);
  return h.filter(({s}) => s.id !== draft.id && new Date(s.start) < t);
}
function lastPerf(exId, draft){ const h = priorEntries(exId, draft); return h.length ? h[h.length-1].e.sets : null; }
function bestFor(exId, draft){
  let b = null;
  for(const {e} of priorEntries(exId, draft)){ const x = entryBest(e.sets); if(!b) b = { ...x }; else mergeBest(b, x); }
  return b;
}
function isPR(s, b){
  if(!b || !s.r) return false;
  return s.w > b.w + 1e-9 || (s.w > 0 && e1rm(s.w, s.r) > b.e + 0.01) || (!s.w && !b.w && s.r > b.r);
}
function getEx(id){
  const e = S.exercises.find(x => x.id === id);
  if(e) return e;
  const h = cache().byEx[id];
  if(h && h.length){ const last = h[h.length-1].e; return { id, name:last.name, cat:last.cat, deleted:true }; }
  const a = S.active && S.active.entries.find(x => x.exId === id);
  if(a) return { id, name:a.name, cat:a.cat, deleted:true };
  return { id, name:'Exercise', cat:'Other', deleted:true };
}
const restFor = exId => getEx(exId).rest || S.settings.rest;
function sessVolume(s){ let v = 0; for(const e of s.entries) for(const x of e.sets) v += (x.w||0)*(x.r||0); return v; }
function sessSets(s){ return s.entries.reduce((a,e) => a + e.sets.length, 0); }
function weekStats(offset=0){
  const ws = addDays(startOfWeek(new Date()), -7*offset), we = addDays(ws, 7);
  const list = S.sessions.filter(s => { const d = new Date(s.start); return d >= ws && d < we; });
  return { count:list.length, volume:list.reduce((a,s) => a + sessVolume(s), 0) };
}
function streaks(){
  const weeks = new Set(S.sessions.map(s => +startOfWeek(new Date(s.start))));
  let cur = 0, w = startOfWeek(new Date());
  if(!weeks.has(+w)) w = addDays(w, -7);
  while(weeks.has(+w)){ cur++; w = addDays(w, -7); }
  let best = 0, run = 0, prev = null;
  for(const t of [...weeks].sort((a,b) => a-b)){
    run = (prev != null && Math.round((t - prev)/(7*864e5)) === 1) ? run + 1 : 1;
    best = Math.max(best, run); prev = t;
  }
  return { cur, best };
}

let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400);
}
function dialog({ title, message='', buttons=[{k:'ok', label:'OK', bold:true}], stack, input, wide }){
  return new Promise(res => {
    const w = document.createElement('div'); w.className = 'alert-wrap';
    const stacked = stack ?? buttons.length > 2;
    const inp = !input ? '' : input.multiline
      ? `<textarea class="field alert-input" rows="6" placeholder="${esc(input.placeholder||'')}" autocapitalize="off" autocorrect="off" spellcheck="false">${esc(input.value||'')}</textarea>`
      : `<input class="field alert-input" value="${esc(input.value||'')}" placeholder="${esc(input.placeholder||'')}" ${input.mode?`inputmode="${input.mode}"`:''} autocomplete="off">`;
    w.innerHTML = `<div class="alert${wide||input?.multiline?' wide':''}" role="alertdialog"><div class="alert-body">${title?`<div class="alert-title">${esc(title)}</div>`:''}${message?`<div class="alert-msg">${esc(message)}</div>`:''}${inp}</div>
      <div class="alert-btns${stacked?' stack':''}">${buttons.map(b => `<button data-k="${b.k}" class="${b.bold?'bold':''} ${b.red?'red':''}">${esc(b.label)}</button>`).join('')}</div></div>`;
    document.body.appendChild(w);
    const field = w.querySelector('.alert-input');
    if(field) setTimeout(() => field.focus(), 60);
    w.addEventListener('click', e => {
      const b = e.target.closest('[data-k]'); if(!b) return;
      const val = field ? field.value : undefined;
      w.remove();
      res(input ? { k:b.dataset.k, value:val } : b.dataset.k);
    });
  });
}
async function confirmDlg(title, message, label='Delete', red=true){
  return (await dialog({ title, message, buttons:[{k:'cancel', label:'Cancel'}, {k:'ok', label, bold:!red, red}] })) === 'ok';
}
async function promptDlg(title, message, value='', placeholder='', okLabel='Save'){
  const r = await dialog({ title, message, input:{ value, placeholder }, buttons:[{k:'cancel', label:'Cancel'}, {k:'ok', label:okLabel, bold:true}] });
  return r.k === 'ok' ? r.value : null;
}
function actionSheet({ title, actions }){
  return new Promise(res => {
    const w = document.createElement('div'); w.className = 'as-wrap';
    w.innerHTML = `<div class="as-sheet"><div class="as-group">${title?`<div class="as-title">${esc(title)}</div>`:''}${actions.map(a => `<button class="as-btn ${a.red?'red':''} ${a.bold?'bold':''}" data-k="${esc(a.k)}">${esc(a.label)}</button>`).join('')}</div>
      <div class="as-group"><button class="as-btn bold" data-k="">Cancel</button></div></div>`;
    document.body.appendChild(w);
    w.addEventListener('click', e => {
      const b = e.target.closest('[data-k]');
      if(!b && e.target !== w) return;
      w.remove(); res(b && b.dataset.k ? b.dataset.k : null);
    });
  });
}
const REST_OPTIONS = [30,45,60,75,90,120,150,180,240,300];
async function chooseRest(title, allowDefault){
  const actions = REST_OPTIONS.map(s => ({ k:String(s), label:fmtClock(s) }));
  if(allowDefault) actions.push({ k:'default', label:`Use default (${fmtClock(S.settings.rest)})` });
  const k = await actionSheet({ title, actions });
  if(!k) return null;
  return k === 'default' ? 'default' : +k;
}

const sheets = [];
function sheetHead(l, title, r){ return `<div class="sheet-head"><div class="l">${l||''}</div><div class="sheet-title">${esc(title||'')}</div><div class="r">${r||''}</div></div>`; }
const btnClose = (label='Close', bold=false) => `<button class="text-btn${bold?' bold':''}" data-a="close">${label}</button>`;
function openSheet(opts){
  const back = document.createElement('div'); back.className = 'sheet-backdrop';
  const el = document.createElement('div'); el.className = 'sheet' + (opts.full ? ' full' : ''); el.setAttribute('role', 'dialog');
  const z = 100 + sheets.length*2; back.style.zIndex = z; el.style.zIndex = z + 1;
  document.body.append(back, el);
  const s = {
    el, back, opts,
    close: () => closeSheet(s),
    rerender(){
      const sb = el.querySelector('.sheet-body'); const top = sb ? sb.scrollTop : 0;
      el.innerHTML = opts.render(s);
      const nb = el.querySelector('.sheet-body'); if(nb) nb.scrollTop = top;
      if(opts.mount) opts.mount(s);
    }
  };
  const actions = Object.assign({ close: () => s.close() }, opts.actions || {});
  el.addEventListener('click', e => {
    const t = e.target.closest('[data-a]'); if(!t || !el.contains(t)) return;
    const fn = actions[t.dataset.a]; if(fn) fn(t, e, s);
  });
  if(!opts.modal){ back.addEventListener('click', () => s.close()); enableDrag(s); }
  sheets.push(s); document.body.classList.add('sheet-open');
  s.rerender();
  requestAnimationFrame(() => requestAnimationFrame(() => { back.classList.add('show'); el.classList.add('show'); }));
  return s;
}
function closeSheet(s){
  const i = sheets.indexOf(s); if(i < 0) return;
  sheets.splice(i, 1);
  if(document.activeElement && s.el.contains(document.activeElement)) document.activeElement.blur();
  s.el.style.transform = ''; s.el.classList.remove('show'); s.back.classList.remove('show');
  setTimeout(() => { s.el.remove(); s.back.remove(); }, 420);
  if(s.opts.onClose) s.opts.onClose();
  if(!sheets.length) document.body.classList.remove('sheet-open');
}
function closeAllSheets(){ [...sheets].reverse().forEach(closeSheet); }
function enableDrag(s){
  const el = s.el; let y0 = null, dy = 0;
  el.addEventListener('pointerdown', e => {
    if(!e.target.closest('.sheet-head') || e.target.closest('button,input,textarea')) return;
    y0 = e.clientY; dy = 0; el.style.transition = 'none';
    try { el.setPointerCapture(e.pointerId); } catch(_){}
  });
  el.addEventListener('pointermove', e => { if(y0 == null) return; dy = Math.max(0, e.clientY - y0); el.style.transform = `translateY(${dy}px)`; });
  const end = () => { if(y0 == null) return; y0 = null; el.style.transition = ''; if(dy > 100) s.close(); else el.style.transform = ''; };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}
function refresh(){ render(); updateDock(); sheets.forEach(s => { if(s.opts.live) s.rerender(); }); }

const tile = (k, v, d='', attrs='') => `<div class="tile" ${attrs}><div class="k">${k}</div><div class="v num">${v}</div>${d?`<div class="d">${d}</div>`:''}</div>`;

/* =========================================================
   Sound, haptics, wake lock
   ========================================================= */
let actx = null;
function unlockAudio(){
  try {
    if(!actx){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) actx = new AC(); }
    if(actx && actx.state === 'suspended') actx.resume();
  } catch(e){}
}
function beep(){
  if(!S.settings.sound || !actx) return;
  try {
    const t0 = actx.currentTime;
    [0, .2, .4].forEach((dt, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = i === 2 ? 1175 : 880;
      g.gain.setValueAtTime(.0001, t0+dt); g.gain.exponentialRampToValueAtTime(.35, t0+dt+.015); g.gain.exponentialRampToValueAtTime(.0001, t0+dt+.16);
      o.connect(g); g.connect(actx.destination); o.start(t0+dt); o.stop(t0+dt+.18);
    });
  } catch(e){}
}
function haptic(p){ if(S.settings.vibrate && navigator.vibrate){ try { navigator.vibrate(p); } catch(e){} } }
let wakeLock = null;
async function syncWakeLock(){
  const want = !!S.active && S.settings.keepAwake && document.visibilityState === 'visible';
  try {
    if(want && !wakeLock && navigator.wakeLock){ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    else if(!want && wakeLock){ await wakeLock.release(); wakeLock = null; }
  } catch(e){}
}

/* =========================================================
   Rest timer
   ========================================================= */
const rest = { end:0, total:0, label:'', doneUntil:0 };
function startRest(sec, label=''){
  if(!(sec > 0)) return;
  unlockAudio();
  Object.assign(rest, { total:sec, end:Date.now() + sec*1000, label, doneUntil:0 });
  if(S.active){ S.active.restEnd = rest.end; S.active.restTotal = sec; saveSoon(); }
  updateDock();
}
function adjustRest(d){
  if(!rest.end) return;
  rest.end += d*1000; rest.total = Math.max(1, rest.total + d);
  if(S.active){ S.active.restEnd = rest.end; S.active.restTotal = rest.total; saveSoon(); }
  if(rest.end <= Date.now()) finishRest(); else updateRestPill();
}
function stopRest(){
  rest.end = 0; rest.doneUntil = 0;
  if(S.active){ delete S.active.restEnd; delete S.active.restTotal; saveSoon(); }
  updateDock();
}
function finishRest(){
  rest.end = 0; rest.doneUntil = Date.now() + 4000;
  if(S.active){ delete S.active.restEnd; delete S.active.restTotal; saveSoon(); }
  beep(); haptic([200,100,200]); updateDock();
}
const ARC = 2*Math.PI*17;
function updateRestPill(){
  if(!rest.end) return;
  const left = Math.max(0, (rest.end - Date.now())/1000);
  const t = $('#rest-time'), a = $('#rest-arc');
  if(t) t.textContent = fmtClock(Math.ceil(left));
  if(a) a.setAttribute('stroke-dashoffset', (ARC * (1 - left/rest.total)).toFixed(2));
}

/* ---------- Dock (rest pill + mini workout bar) ---------- */
function updateDock(){
  const dock = $('#dock'); let html = '';
  if(rest.end){
    html += `<div class="rest-pill">
      <svg class="rest-ring" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" stroke="var(--card-3)" stroke-width="4" fill="none"/><circle id="rest-arc" cx="20" cy="20" r="17" stroke="var(--blue)" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="${ARC.toFixed(2)}" stroke-dashoffset="0" transform="rotate(-90 20 20)"/></svg>
      <div class="grow"><div class="rest-label">Rest${rest.label ? ' · ' + esc(rest.label) : ''}</div><div class="rest-time" id="rest-time">0:00</div></div>
      <button class="btn btn-sm btn-gray" data-a="rest-adj" data-d="-15">−15</button>
      <button class="btn btn-sm btn-gray" data-a="rest-adj" data-d="15">+15</button>
      <button class="btn btn-sm btn-tinted" data-a="rest-skip">Skip</button></div>`;
  } else if(rest.doneUntil){
    html += `<button class="rest-pill done" data-a="rest-skip">${ic('check')} Rest over — next set!</button>`;
  }
  if(S.active && ui.tab !== 'workout'){
    html += `<button class="mini-bar" data-a="tab" data-tab="workout"><span class="pulse"></span><span class="grow" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(S.active.name || 'Workout')}</span><span class="num" data-elapsed="${esc(S.active.start)}">${fmtDur(Date.now() - new Date(S.active.start))}</span>${ic('chevR')}</button>`;
  }
  dock.innerHTML = html;
  updateRestPill();
  requestAnimationFrame(() => document.documentElement.style.setProperty('--dock-h', dock.offsetHeight + 'px'));
}

let lastSec = 0;
function tick(){
  const now = Date.now();
  if(rest.end && now >= rest.end) finishRest();
  if(rest.doneUntil && now > rest.doneUntil){ rest.doneUntil = 0; updateDock(); }
  if(rest.end) updateRestPill();
  const sec = Math.floor(now/1000);
  if(sec !== lastSec){
    lastSec = sec;
    document.querySelectorAll('[data-elapsed]').forEach(el => { el.textContent = fmtDur(now - new Date(el.dataset.elapsed)); });
  }
}

    ${!S.sessions.length ? `<div class="card" style="margin-top:12px"><div style="font-weight:600;margin-bottom:4px">Coming from the old app?</div><div class="small muted" style="line-height:1.45">In your old copy, go to <b>Settings → Copy backup code</b> (or <b>History / 🛠️ → Backup Data</b> in v3), then paste it here.</div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn btn-sm btn-tinted" style="flex:1" data-a="paste-code">${ic('paste')} Paste Code</button><button class="btn btn-sm btn-gray" style="flex:1" data-a="import-file">${ic('upload')} Import File</button></div></div>` : ''}
    <div class="section-h"><h2>Routines</h2><button class="link" data-a="new-routine">New</button></div>
    ${routines ? `<div class="routines">${routines}</div>` : `<div class="card"><div style="font-weight:600;margin-bottom:4px">No routines yet</div><div class="small muted" style="line-height:1.45">Save workouts you repeat — like Push Day or Legs — and start them in one tap. Each set is pre-filled from last time.${S.sessions.length ? ' You can also open any workout in History and tap <b>Save as Routine</b>.' : ''}</div><button class="btn btn-block btn-tinted" style="margin-top:14px" data-a="new-routine">${ic('plus')} Create Routine</button></div>`}
  `;
}

function installCard(){

}

function renderActive(v){
  v.innerHTML = `
    <div class="topbar">
      <button class="btn-icon" data-a="rest-menu" aria-label="Rest timer">${ic('timer')}</button>
      <div class="grp"><button class="btn-icon" data-a="plates" aria-label="Plate calculator">${ic('plates')}</button><button class="btn btn-sm btn-green" data-a="finish">Finish</button></div>
    </div>
    <div id="active-editor"></div>
    <button class="btn btn-block btn-danger" style="margin-top:20px" data-a="discard">Discard Workout</button>`;
  mountEditor($('#active-editor'), { draft:S.active, mode:'active' });
