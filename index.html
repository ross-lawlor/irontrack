async function startWorkout({ name, routineId=null, items=[] }){
  if(S.active){
    const k = await dialog({ title:'Workout in progress', message:'Finish or discard your current workout before starting a new one.',
      buttons:[{k:'resume', label:'Resume Current', bold:true}, {k:'discard', label:'Discard & Start New', red:true}, {k:'cancel', label:'Cancel'}] });
    if(k === 'resume'){ closeAllSheets(); setTab('workout'); return; }
    if(k !== 'discard') return;
    stopRest();
  }
  unlockAudio();
  const d = { id:uid(), name: name || defaultName(), start:new Date().toISOString(), routineId, notes:'', entries:[] };
  d.entries = items.filter(i => i.exId).map(i => newEntry(i.exId, d, i.sets));
  S.active = d;
  save(); closeAllSheets();
  ui.scroll.workout = 0;
  if(ui.tab === 'workout') render(); else setTab('workout');
  window.scrollTo(0, 0);
  syncWakeLock();
}
function newEntry(exId, draft, n){
  const ex = getEx(exId), prev = lastPerf(exId, draft);
  const count = Math.min(12, n || (prev ? prev.length : 3));
  return { exId, name:ex.name, cat:ex.cat, sets:Array.from({ length:count }, () => ({ w:null, r:null, done:false })) };
}
function routineItems(sess){ return sess.entries.map(e => ({ exId:e.exId, sets:Math.min(12, e.sets.length) })); }
function startRoutine(id){ const r = S.routines.find(x => x.id === id); if(r) startWorkout({ name:r.name, routineId:r.id, items:r.items }); }
function repeatSession(id){ const s = S.sessions.find(x => x.id === id); if(s) startWorkout({ name:s.name, routineId:s.routineId, items:routineItems(s) }); }

async function finishWorkout(){
  const d = S.active; if(!d) return;
  if(document.activeElement) document.activeElement.blur();
  const pending = [];
  d.entries.forEach(en => en.sets.forEach(s => { if(!s.done && s.r > 0) pending.push(s); }));
  if(pending.length){
    const k = await dialog({ title:`${plural(pending.length,'set')} not ticked off`, message:'These sets have reps entered but weren’t marked complete.',
      buttons:[{k:'log', label:'Log Them Too', bold:true}, {k:'drop', label:'Leave Them Out'}, {k:'cancel', label:'Cancel'}] });
    if(!k || k === 'cancel') return;
    if(k === 'log') pending.forEach(s => { s.done = true; if(s.w == null) s.w = 0; });
  }
  const entries = cleanEntries(d.entries, false);
  if(!entries.length){
    const k = await dialog({ title:'No sets completed', message:'Tick off at least one set to save this workout.', buttons:[{k:'discard', label:'Discard', red:true}, {k:'back', label:'Keep Going', bold:true}] });
    if(k === 'discard') discardNow();
    return;
  }
  const sess = { id:d.id, name:(d.name||'').trim() || defaultName(new Date(d.start)), start:d.start, end:new Date().toISOString(), legacy:false, routineId:d.routineId||null, notes:(d.notes||'').trim(), entries };
  S.sessions.push(sess);
  S.active = null;
  rest.end = 0; rest.doneUntil = 0;
  save(); syncWakeLock(); render(); updateDock();
  showSummary(sess);
}
function cleanEntries(entries, ignoreDone){
  return entries.map(en => {
    const ex = getEx(en.exId);
    return { exId:en.exId, name:ex.name, cat:ex.cat, sets: en.sets.filter(s => (ignoreDone || s.done) && s.r > 0).map(s => ({ w: Math.max(0, s.w || 0), r: s.r })) };
  }).filter(e => e.sets.length);
}
function discardNow(){ S.active = null; rest.end = 0; rest.doneUntil = 0; save(); syncWakeLock(); render(); updateDock(); toast('Workout discarded'); }
async function discardWorkout(){
  if(await confirmDlg('Discard workout?', 'Everything you’ve logged in this workout will be lost.', 'Discard')) discardNow();
}

function showSummary(sess){
  const prs = cache().prs[sess.id] || [];
  const r = sess.routineId && S.routines.find(x => x.id === sess.routineId);
  const differs = r && JSON.stringify(r.items) !== JSON.stringify(routineItems(sess));
  const dur = sessDur(sess);
  const s = openSheet({ render: () => `${sheetHead('', '', btnClose('Done', true))}
    <div class="sheet-body">
      <div class="done-badge${prs.length?' pr':''}">${ic(prs.length ? 'trophy' : 'check')}</div>
      <h2 class="sheet-h1 center">Workout complete</h2>
      <div class="muted center" style="margin-bottom:18px">${esc(sess.name)}</div>
      <div class="tiles three">
        ${tile('Duration', dur ? fmtDurShort(dur) : '—')}
        ${tile('Volume', fmtCompact(sessVolume(sess)) + `<small>${U()}</small>`)}
        ${tile('Sets', sessSets(sess))}
      </div>
      ${prs.length ? `<div class="group-h">${plural(prs.length,'personal record')}</div><div class="list">${prs.map(p => { const t = prText(p); return `<div class="row">${ic('trophy')}<div class="grow"><div class="title">${esc(getEx(p.exId).name)}</div><div class="sub">${esc(t.label)}</div></div><span class="trail num" style="color:var(--orange);font-weight:600">${esc(t.text)}</span></div>`; }).join('')}</div>` : ''}
      <div class="group-h">Exercises</div>
      <div class="list">${sess.entries.map(e => { const b = entryBest(e.sets); return `<div class="row"><div class="grow"><div class="title">${esc(e.name)}</div><div class="sub">${plural(e.sets.length,'set')}</div></div><span class="trail num">${b.w ? 'Best ' + fmtW(b.w) + ' ' + U() + ' × ' + b.wr : 'Best ' + b.r + ' reps'}</span></div>`; }).join('')}</div>
      <div class="btn-col">
        ${!r ? `<button class="btn btn-block btn-tinted" data-a="as-routine">${ic('repeat')} Save as Routine</button>` : differs ? `<button class="btn btn-block btn-tinted" data-a="update-routine">${ic('repeat')} Update “${esc(r.name)}”</button>` : ''}
        <button class="btn btn-block btn-primary" data-a="close">Done</button>
      </div>
    </div>`,
    actions: {
      'as-routine': async () => { if(await saveAsRoutine(sess.id)) s.close(); },
      'update-routine': () => { r.items = routineItems(sess); save(); refresh(); toast(`“${r.name}” updated`); s.close(); }
    }
  });
}
async function saveAsRoutine(sessId){
  const sess = S.sessions.find(x => x.id === sessId); if(!sess) return false;
  const name = await promptDlg('Save as Routine', 'Give this routine a name.', sess.name, 'e.g. Push Day');
  if(name == null) return false;
  const r = { id:uid(), name:name.trim() || sess.name, items:routineItems(sess) };
  S.routines.push(r);
  const orig = S.sessions.find(x => x.id === sessId); if(orig && !orig.routineId) orig.routineId = r.id;
  save(); refresh(); toast(`Routine “${r.name}” saved`);
  return true;
}

/* =========================================================
   Workout editor (used for the live workout and for editing past ones)
   ========================================================= */
function mountEditor(root, ctx){
  ctx.root = root;
  root.classList.add('editor');
  if(ctx.mode === 'edit') root.classList.add('edit');
  root.addEventListener('click', e => edClick(ctx, e));
  root.addEventListener('input', e => edInput(ctx, e));
  root.addEventListener('keydown', e => { if(e.key === 'Enter' && e.target.classList.contains('ed-name')) e.target.blur(); });
  renderEditor(ctx);
}
function renderEditor(ctx){
  const d = ctx.draft;
  const meta = ctx.mode === 'active'
    ? `<span>${ic('clock')}<b data-elapsed="${esc(d.start)}">${fmtDur(Date.now() - new Date(d.start))}</b></span>`
    : `<span>${ic('calendar')}<input type="datetime-local" class="ed-dt" data-f="start" value="${toLocalInput(d.start)}"></span>`;
  ctx.root.innerHTML = `
    <input class="ed-name" data-f="name" value="${esc(d.name)}" placeholder="Workout name" enterkeyhint="done" autocomplete="off">
    <div class="ed-meta">${meta}<span>${ic('check')}<b class="m-sets">0</b><span class="m-sets-l">sets</span></span><span>${ic('stack')}<b class="m-vol">0</b> ${U()}</span></div>
    ${d.entries.map((en, i) => entryHTML(ctx, en, i)).join('') || `<div class="ed-empty">${ic('dumbbell')}<div>Add an exercise to get started</div></div>`}
    <button class="btn btn-block btn-tinted" data-ed="add-ex">${ic('plus')} Add Exercises</button>
    <textarea class="field ed-notes" data-f="notes" rows="2" placeholder="Workout notes (optional)">${esc(d.notes || '')}</textarea>`;
  updateMeta(ctx);
}
function phFor(ctx, en, si){
  const prev = lastPerf(en.exId, ctx.draft);
  if(prev && prev[si]) return prev[si];
  const before = si > 0 && en.sets[si-1];
  if(before && before.r > 0) return { w:before.w || 0, r:before.r };
  if(prev && prev.length) return prev[prev.length-1];
  return null;
}
function entryHTML(ctx, en, i){
  const ex = getEx(en.exId);
  const prev = lastPerf(en.exId, ctx.draft);
  const best = bestFor(en.exId, ctx.draft);
  const sub = [`<span>${esc(ex.cat)}</span>`];
  if(ctx.mode === 'active') sub.push(`<span>${ic('timer')}${fmtClock(restFor(en.exId))}</span>`);
  if(best) sub.push(`<span class="pr">${ic('trophy')}${best.w > 0 ? `${fmtW(best.w)} ${U()} × ${best.wr}` : `${best.r} reps`}</span>`);
  return `<section class="ex-card" data-ei="${i}">
    <div class="ex-head"><button class="ex-name" data-ed="ex-info">${esc(ex.name)}</button><button class="btn-icon" data-ed="ex-menu" aria-label="Exercise options">${ic('more')}</button></div>
    <div class="ex-sub">${sub.join('<span class="dot">·</span>')}</div>
    <div class="set-grid set-head"><span>Set</span><span>Previous</span><span>${U()}</span><span>Reps</span><span>${ic('check')}</span></div>
    ${en.sets.map((s, j) => setHTML(ctx, en, s, j, prev, best)).join('')}
    <button class="add-set" data-ed="add-set">${ic('plus')} Add Set</button>
  </section>`;
}
function setHTML(ctx, en, s, j, prev, best){
  const p = prev && prev[j];
  const ph = phFor(ctx, en, j);
  const pr = ctx.mode === 'active' && s.done && isPR(s, best);
  return `<div class="set-grid set-row${s.done ? ' done' : ''}${pr ? ' pr' : ''}" data-si="${j}">
    <button class="set-num" data-ed="set-menu" aria-label="Set ${j+1} options">${pr ? ic('trophy') : j+1}</button>
    <button class="set-prev" data-ed="use-prev" ${p ? '' : 'disabled'}>${p ? setStr(p) : '—'}</button>
    <input class="set-in" data-f="w" inputmode="decimal" autocomplete="off" value="${s.w != null ? fmtW(s.w) : ''}" placeholder="${ph ? (ph.w > 0 ? fmtW(ph.w) : '0') : ''}" aria-label="Weight">
    <input class="set-in" data-f="r" inputmode="numeric" pattern="[0-9]*" autocomplete="off" value="${s.r != null ? s.r : ''}" placeholder="${ph ? ph.r : ''}" aria-label="Reps">
    <button class="set-check" data-ed="check" aria-label="Complete set">${ic('check')}</button>
  </div>`;
}
function updateMeta(ctx){
  let n = 0, vol = 0;
  for(const e of ctx.draft.entries) for(const s of e.sets){
    if(ctx.mode === 'edit' ? s.r > 0 : s.done){ n++; vol += (s.w||0) * (s.r||0); }
  }
  const a = ctx.root.querySelector('.m-sets'), b = ctx.root.querySelector('.m-vol');
  if(a) a.textContent = n;
  const l = ctx.root.querySelector('.m-sets-l'); if(l) l.textContent = n === 1 ? 'set' : 'sets';
  if(b) b.textContent = fmtVol(vol);
}
function changed(ctx, structural){
  if(structural) renderEditor(ctx); else updateMeta(ctx);
  if(ctx.mode === 'active') saveSoon();
}
function refreshRowPR(ctx, en, s, row, si){
  if(ctx.mode !== 'active') return false;
  const pr = s.done && isPR(s, bestFor(en.exId, ctx.draft));
  row.classList.toggle('pr', pr);
  row.querySelector('.set-num').innerHTML = pr ? ic('trophy') : si + 1;
  return pr;
}
function edInput(ctx, e){
  const t = e.target, f = t.dataset.f; if(!f) return;
  const d = ctx.draft;
  if(f === 'name') d.name = t.value;
  else if(f === 'notes') d.notes = t.value;
  else if(f === 'start'){ const dt = new Date(t.value); if(!isNaN(dt)) d.start = dt.toISOString(); }
  else {
    const row = t.closest('.set-row'), ei = +t.closest('.ex-card').dataset.ei, si = +row.dataset.si;
    const en = d.entries[ei], s = en.sets[si], raw = t.value.trim();
    if(f === 'w'){ const n = toNum(raw); s.w = (raw === '' || isNaN(n)) ? null : Math.max(0, fromDisp(n)); }
    else { const n = parseInt(raw, 10); s.r = (raw === '' || isNaN(n)) ? null : Math.max(0, n); }
    if(s.done) refreshRowPR(ctx, en, s, row, si);
  }
  changed(ctx);
}
function edClick(ctx, e){
  const t = e.target.closest('[data-ed]'); if(!t || !ctx.root.contains(t)) return;
  const card = t.closest('.ex-card'), ei = card ? +card.dataset.ei : -1;
  const en = ctx.draft.entries[ei];
  const row = t.closest('.set-row'), si = row ? +row.dataset.si : -1;
  switch(t.dataset.ed){
    case 'add-ex':
      pickExercises({ onDone: ids => { ids.forEach(id => ctx.draft.entries.push(newEntry(id, ctx.draft))); changed(ctx, true); } });
      break;
    case 'ex-info': openExerciseDetail(en.exId); break;
    case 'ex-menu': exMenu(ctx, ei); break;
    case 'add-set': {
      const last = en.sets[en.sets.length-1];
      en.sets.push({ w: last && last.w != null ? last.w : null, r: last && last.r != null ? last.r : null, done:false });
      changed(ctx, true);
      break;
    }
    case 'set-menu': setMenu(ctx, ei, si); break;
    case 'use-prev': {
      const p = (lastPerf(en.exId, ctx.draft) || [])[si]; if(!p) break;
      const s = en.sets[si]; s.w = p.w; s.r = p.r;
      row.querySelector('[data-f=w]').value = fmtW(p.w);
      row.querySelector('[data-f=r]').value = p.r;
      if(s.done) refreshRowPR(ctx, en, s, row, si);
      changed(ctx);
      break;
    }
    case 'check': toggleSet(ctx, ei, si, row); break;
  }
}
function toggleSet(ctx, ei, si, row){
  const en = ctx.draft.entries[ei], s = en.sets[si];
  unlockAudio();
  if(s.done){
    s.done = false; row.classList.remove('done', 'pr');
    row.querySelector('.set-num').textContent = si + 1;
    changed(ctx); return;
  }
  const ph = phFor(ctx, en, si);
  if(s.w == null && ph) s.w = ph.w;
  if(s.r == null && ph) s.r = ph.r;
  if(!(s.r > 0)){
    row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake');
    toast('Enter reps for this set'); return;
  }
  if(s.w == null) s.w = 0;
  s.done = true;
  row.querySelector('[data-f=w]').value = fmtW(s.w);
  row.querySelector('[data-f=r]').value = s.r;
  row.classList.add('done', 'just'); setTimeout(() => row.classList.remove('just'), 350);
  if(refreshRowPR(ctx, en, s, row, si)){ toast(`🏆 New PR — ${getEx(en.exId).name}`); haptic([30,50,30]); }
  else haptic(15);
  if(ctx.mode === 'active' && S.settings.autoRest) startRest(restFor(en.exId), getEx(en.exId).name);
  changed(ctx);
}
async function exMenu(ctx, ei){
  const en = ctx.draft.entries[ei], ex = getEx(en.exId), n = ctx.draft.entries.length;
  const actions = [];
  if(!ex.deleted) actions.push({ k:'rest', label:`Rest Timer (${fmtClock(restFor(en.exId))})` });
  if(ei > 0) actions.push({ k:'up', label:'Move Up' });
  if(ei < n-1) actions.push({ k:'down', label:'Move Down' });
  actions.push({ k:'info', label:'History & Charts' });
  actions.push({ k:'remove', label:'Remove Exercise', red:true });
  const k = await actionSheet({ title:ex.name, actions });
  const list = ctx.draft.entries;
  if(k === 'rest'){
    const r = await chooseRest(`Rest timer for ${ex.name}`, true); if(r == null) return;
    if(r === 'default') delete ex.rest; else ex.rest = r;
    save(); changed(ctx, true);
  }
  else if(k === 'up'){ [list[ei-1], list[ei]] = [list[ei], list[ei-1]]; changed(ctx, true); }
  else if(k === 'down'){ [list[ei+1], list[ei]] = [list[ei], list[ei+1]]; changed(ctx, true); }
  else if(k === 'info') openExerciseDetail(en.exId);
  else if(k === 'remove'){
    if(en.sets.some(s => s.done || s.r > 0) && !(await confirmDlg(`Remove ${ex.name}?`, 'The sets you’ve entered for it will be removed.', 'Remove'))) return;
    list.splice(ei, 1); changed(ctx, true);
  }
}
async function setMenu(ctx, ei, si){
  const en = ctx.draft.entries[ei];
  const k = await actionSheet({ title:`Set ${si+1}`, actions:[{ k:'dup', label:'Duplicate Set' }, { k:'del', label:'Delete Set', red:true }] });
  if(k === 'dup'){ const s = en.sets[si]; en.sets.splice(si+1, 0, { w:s.w, r:s.r, done:false }); changed(ctx, true); }
  else if(k === 'del'){ en.sets.splice(si, 1); changed(ctx, true); }
}

/* ---------- Edit / log past workouts ---------- */
function openSessionEditor(sessId){
  const orig = sessId ? S.sessions.find(x => x.id === sessId) : null;
  const now = new Date(); now.setSeconds(0, 0);
  const draft = orig
    ? { id:orig.id, name:orig.name, start:orig.start, notes:orig.notes || '', routineId:orig.routineId, entries: orig.entries.map(e => ({ exId:e.exId, name:e.name, cat:e.cat, sets:e.sets.map(s => ({ w:s.w, r:s.r, done:true })) })) }
    : { id:uid(), name:'Workout', start:now.toISOString(), notes:'', routineId:null, entries:[] };
  const ctx = { draft, mode:'edit' };
  const sh = openSheet({ full:true, modal:true,
    render: () => `${sheetHead(btnClose('Cancel'), orig ? 'Edit Workout' : 'Log Past Workout', `<button class="text-btn bold" data-a="save">Save</button>`)}<div class="sheet-body"><div class="ed-host"></div>${orig ? `<button class="btn btn-block btn-danger" style="margin-top:20px" data-a="del">Delete Workout</button>` : ''}</div>`,
    mount: s => mountEditor(s.el.querySelector('.ed-host'), ctx),
    actions: {
      save: () => {
        const entries = cleanEntries(draft.entries, true);
        if(!entries.length){ toast('Add at least one set with reps'); return; }
        const name = (draft.name || '').trim() || 'Workout';
        if(orig){
          const delta = new Date(draft.start) - new Date(orig.start);
          if(orig.end) orig.end = new Date(new Date(orig.end).getTime() + delta).toISOString();
          Object.assign(orig, { name, start:draft.start, notes:(draft.notes||'').trim(), entries });
        } else {
          S.sessions.push({ id:draft.id, name, start:draft.start, end:null, legacy:false, routineId:null, notes:(draft.notes||'').trim(), entries });
        }
        save(); sh.close(); refresh(); toast('Workout saved');
      },
      del: () => deleteSession(orig.id, sh)
    }
  });
}
async function deleteSession(id, sheet){
  if(!(await confirmDlg('Delete this workout?', 'It will be permanently removed from your history and stats.'))) return;
  S.sessions = S.sessions.filter(x => x.id !== id);
  save(); closeAllSheets(); refresh(); toast('Workout deleted');
}

/* =========================================================
   Exercise picker
   ========================================================= */
function pickExercises({ title='Add Exercises', onDone }){
  const st = { q:'', cat:'All', sel:[] };
  const headHTML = () => sheetHead(btnClose('Cancel'), title, `<button class="text-btn bold" data-a="done" ${st.sel.length ? '' : 'disabled'}>Add${st.sel.length ? ` (${st.sel.length})` : ''}</button>`);
  const rowHTML = (e, h) => {
    const n = st.sel.indexOf(e.id), last = h && h.length ? h[h.length-1].s.start : null;
    return `<button class="row tap" data-a="toggle" data-id="${esc(e.id)}"><span class="pick-dot${n >= 0 ? ' on' : ''}">${n >= 0 ? n+1 : ''}</span><div class="grow"><div class="title">${esc(e.name)}</div><div class="sub">${esc(e.cat)}${last ? ' · ' + relDay(last) : ''}</div></div></button>`;
  };
  const listHTML = () => {
    const q = st.q.trim().toLowerCase(), byEx = cache().byEx;
    const items = S.exercises.filter(e => (st.cat === 'All' || e.cat === st.cat) && (!q || e.name.toLowerCase().includes(q)))
      .sort((a,b) => CATS.indexOf(a.cat) - CATS.indexOf(b.cat) || a.name.localeCompare(b.name));
    let html = '';
    if(q && !S.exercises.some(e => e.name.toLowerCase() === q))
      html += `<div class="list" style="margin-top:14px"><button class="row tap" data-a="create"><span class="pick-dot add">${ic('plus')}</span><div class="grow"><div class="title" style="color:var(--blue)">Create “${esc(st.q.trim())}”</div></div></button></div>`;
    if(!items.length) return html + (q ? '' : emptyHTML('list', 'Nothing here yet', 'Search above to create an exercise.'));
    if(st.cat === 'All' && !q){
      for(const c of CATS){ const g = items.filter(e => e.cat === c); if(g.length) html += `<div class="group-h">${c}</div><div class="list">${g.map(e => rowHTML(e, byEx[e.id])).join('')}</div>`; }
    } else html += `<div class="list" style="margin-top:14px">${items.map(e => rowHTML(e, byEx[e.id])).join('')}</div>`;
    return html;
  };
  const upd = s => { s.el.querySelector('.pick-list').innerHTML = listHTML(); s.el.querySelector('.ph').innerHTML = headHTML(); };
  openSheet({ full:true,
    render: () => `<div class="ph">${headHTML()}</div><div class="sheet-body">
      <div class="search-wrap">${ic('search')}<input class="field" type="search" placeholder="Search or create" autocomplete="off" autocorrect="off"></div>
      <div class="chips">${['All', ...CATS].map(c => `<button class="chip${c === st.cat ? ' on' : ''}" data-a="cat" data-v="${c}">${c}</button>`).join('')}</div>
      <div class="pick-list">${listHTML()}</div></div>`,
    mount: s => { const i = s.el.querySelector('input[type=search]'); i.value = st.q; i.oninput = () => { st.q = i.value; upd(s); }; },
    actions: {
      done: (t, e, s) => { s.close(); onDone(st.sel.slice()); },
      cat: (t, e, s) => { st.cat = t.dataset.v; s.el.querySelectorAll('.chips .chip').forEach(c => c.classList.toggle('on', c.dataset.v === st.cat)); upd(s); },
      toggle: (t, e, s) => { const id = t.dataset.id, i = st.sel.indexOf(id); if(i >= 0) st.sel.splice(i, 1); else st.sel.push(id); upd(s); },
      create: (t, e, s) => openExerciseForm(null, { name:st.q.trim(), cat: st.cat !== 'All' ? st.cat : 'Other',
        onSave: ex => { st.sel.push(ex.id); st.q = ''; s.el.querySelector('input[type=search]').value = ''; upd(s); } })
    }
  });
}

/* =========================================================
   Exercise form & detail
   ========================================================= */
function openExerciseForm(ex, { name='', cat='Other', onSave }={}){
  const isNew = !ex;
  const f = { name: ex ? ex.name : name, cat: ex ? ex.cat : cat, rest: ex ? ex.rest || null : null };
  openSheet({
    render: () => `${sheetHead(btnClose('Cancel'), isNew ? 'New Exercise' : 'Edit Exercise', `<button class="text-btn bold" data-a="save">Save</button>`)}
      <div class="sheet-body">
        <label class="lbl" for="xf-name">Name</label>
        <input class="field" id="xf-name" value="${esc(f.name)}" placeholder="e.g. Incline Dumbbell Press" autocomplete="off">
        <label class="lbl">Muscle group</label>
        <div class="chip-wrap">${CATS.map(c => `<button class="chip${c === f.cat ? ' on' : ''}" data-a="cat" data-v="${c}">${c}</button>`).join('')}</div>
        <label class="lbl">Rest timer</label>
        <div class="list"><button class="row tap" data-a="rest"><span class="grow">Rest between sets</span><span class="trail">${f.rest ? fmtClock(f.rest) : `Default (${fmtClock(S.settings.rest)})`}${chev()}</span></button></div>
        ${!isNew ? `<button class="btn btn-block btn-danger" style="margin-top:28px" data-a="del">${ic('trash')} Delete Exercise</button>` : ''}
      </div>`,
    mount: s => { const i = s.el.querySelector('#xf-name'); i.oninput = () => { f.name = i.value; }; if(isNew && !f.name) setTimeout(() => i.focus(), 380); },
    actions: {
      cat: (t, e, s) => { f.cat = t.dataset.v; s.el.querySelectorAll('.chip-wrap .chip').forEach(c => c.classList.toggle('on', c.dataset.v === f.cat)); },
      rest: async (t, e, s) => { const r = await chooseRest('Rest between sets', true); if(r == null) return; f.rest = r === 'default' ? null : r; s.rerender(); },
      save: (t, e, s) => {
        const n = f.name.trim();
        if(!n){ toast('Give the exercise a name'); return; }
        if(S.exercises.some(x => x !== ex && x.name.toLowerCase() === n.toLowerCase())){ toast('You already have an exercise with that name'); return; }
        let obj;
        if(isNew){ obj = { id:uid(), name:n, cat:f.cat }; if(f.rest) obj.rest = f.rest; S.exercises.push(obj); }
        else {
          obj = ex; obj.name = n; obj.cat = f.cat;
          if(f.rest) obj.rest = f.rest; else delete obj.rest;
          S.sessions.forEach(ss => ss.entries.forEach(en => { if(en.exId === ex.id){ en.name = n; en.cat = f.cat; } }));
          if(S.active) S.active.entries.forEach(en => { if(en.exId === ex.id){ en.name = n; en.cat = f.cat; } });
        }
        save(); s.close(); refresh();
        toast(isNew ? `Added ${n}` : 'Exercise updated');
        if(onSave) onSave(obj);
      },
      del: async (t, e, s) => {
        if(!(await confirmDlg(`Delete ${ex.name}?`, 'It’s removed from your library and routines. Past workouts keep their history.'))) return;
        S.exercises = S.exercises.filter(x => x.id !== ex.id);
        S.routines.forEach(r => { r.items = r.items.filter(i => i.exId !== ex.id); });
        save(); s.close(); refresh(); toast('Exercise deleted');
      }
    }
  });
}

function exSeries(id){
  return (cache().byEx[id] || []).map(({ s, e }) => {
    const b = entryBest(e.sets);
    return { x:+new Date(s.start), id:s.id, e1:b.e, top:b.w, topR:b.wr, vol:e.sets.reduce((a,x) => a + x.w*x.r, 0), reps:b.r, treps:e.sets.reduce((a,x) => a + x.r, 0), sets:e.sets, start:s.start };
  });
}
function openExerciseDetail(id){
  const metricsFor = bw => bw ? [['reps','Most reps'], ['treps','Total reps']] : [['e1','Est. 1RM'], ['top','Heaviest'], ['vol','Volume']];
  openSheet({ live:true, full:true,
    render: () => {
      const ex = getEx(id), ser = exSeries(id), b = cache().best[id];
      const bw = ser.length > 0 && ser.every(p => p.top === 0);
      const metrics = metricsFor(bw);
      if(!metrics.some(m => m[0] === ui.exMetric)) ui.exMetric = metrics[0][0];
      const last = ser[ser.length-1];
      let body;
      if(!ser.length) body = emptyHTML('chart', 'No history yet', 'Log this exercise in a workout and your progress will show up here.');
      else {
        const bestVol = ser.reduce((m, p) => p.vol > m.vol ? p : m, ser[0]);
        body = `<div class="tiles">
            ${bw ? tile('Most reps', b.r, 'in one set') : tile('Heaviest', fmtW(b.w) + `<small>${U()}</small>`, `× ${plural(b.wr,'rep')}`)}
            ${bw ? tile('Total reps', ser.reduce((a,p) => a + p.treps, 0).toLocaleString(), 'all time') : tile('Est. 1RM', fmtW1(b.e) + `<small>${U()}</small>`, `from ${fmtW(b.eW)} × ${b.eR}`)}
            ${tile('Workouts', ser.length, 'last ' + relPhrase(last.start))}
            ${bw ? tile('Sets', ser.reduce((a,p) => a + p.sets.length, 0), 'all time') : tile('Best volume', fmtCompact(bestVol.vol) + `<small>${U()}</small>`, relDay(bestVol.start))}
          </div>
          <div class="card" style="margin-top:12px">
            <div class="seg" style="margin-bottom:14px">${metrics.map(([k, l]) => `<button data-a="metric" data-v="${k}" class="${ui.exMetric === k ? 'on' : ''}">${l}</button>`).join('')}</div>
            <div class="chart" id="ex-chart"></div>
            <div class="small faint" style="margin-top:6px">Each point is one workout. Tap or drag to inspect.</div>
          </div>
          <div class="group-h">Recent workouts</div>
          <div class="list">${ser.slice(-15).reverse().map(p => `<button class="row tap" data-a="sess" data-id="${esc(p.id)}"><div class="grow"><div class="title" style="font-size:15px;font-weight:600">${new Date(p.start).toLocaleDateString(undefined, { weekday:'short', day:'numeric', month:'short', year:'numeric' })}</div><div class="sub wrap num">${p.sets.map(setStr).join(' · ')}</div></div>${chev()}</button>`).join('')}</div>`;
      }
      return `${sheetHead(btnClose(), '', ex.deleted ? '' : `<button class="text-btn" data-a="edit">Edit</button>`)}
        <div class="sheet-body">
          <h2 class="sheet-h1">${esc(ex.name)}</h2>
          <div class="meta-row"><span class="tag">${esc(ex.cat)}</span>${ex.deleted ? '<span class="small muted">Removed from library</span>' : `<span class="small muted">${ic('timer')} Rest ${fmtClock(restFor(id))}</span>`}</div>
          ${body}
        </div>`;
    },
    mount: s => {
      const el = s.el.querySelector('#ex-chart'); if(!el) return;
      const ser = exSeries(id), m = ui.exMetric;
      const isW = m === 'e1' || m === 'top' || m === 'vol';
      lineChart(el, ser.map(p => ({ x:p.x, y: isW ? toDisp(p[m]) : p[m], sub: m === 'top' ? `× ${p.topR} reps` : '' })), {
        fmt: v => isW ? (m === 'vol' ? Math.round(v).toLocaleString() : fmtNum(v, 1)) + ' ' + U() : Math.round(v) + ' reps'
      });
    },
    actions: {
      metric: (t, e, s) => { ui.exMetric = t.dataset.v; s.rerender(); },
      edit: () => openExerciseForm(getEx(id)),
      sess: t => openSession(t.dataset.id)
    }
  });
}

/* =========================================================

      const prs = cache().prs[id] || [], dur = sessDur(sess);
      const time = sess.legacy ? '' : ` · ${fmtTime(sess.start)}${sess.end ? '–' + fmtTime(sess.end) : ''}`;

        <div class="sheet-body">

          ${sess.entries.map(e => `<div class="card det-ex">

            ${e.sets.map((x, i) => `<div class="det-set"><span class="n">${i+1}</span><span>${setStr(x)}${x.w > 0 ? ' ' + U() : ''}</span><span class="faint small">${x.w > 0 ? 'e1RM ' + fmtW1(e1rm(x.w, x.r)) : ''}</span></div>`).join('')}
          </div>`).join('')}

/* =========================================================
   Routines
   ========================================================= */
function openRoutineEditor(rid){
  const r = rid ? S.routines.find(x => x.id === rid) : null;
  const d = { name: r ? r.name : '', items: r ? r.items.map(i => ({ ...i })) : [] };
  openSheet({ full:true, modal:true,
    render: () => `${sheetHead(btnClose('Cancel'), r ? 'Edit Routine' : 'New Routine', `<button class="text-btn bold" data-a="save">Save</button>`)}
      <div class="sheet-body">
        <input class="field field-lg" id="rt-name" value="${esc(d.name)}" placeholder="Name, e.g. Push Day" autocomplete="off">
        <div class="group-h">Exercises</div>
        ${d.items.length ? `<div class="list">${d.items.map((it, i) => { const ex = getEx(it.exId); return `<div class="row"><div class="grow"><div class="title">${esc(ex.name)}</div><div class="sub">${esc(ex.cat)}</div></div>
            <div class="stepper"><button data-a="sets" data-i="${i}" data-d="-1" aria-label="Fewer sets">−</button><span>${plural(it.sets,'set')}</span><button data-a="sets" data-i="${i}" data-d="1" aria-label="More sets">+</button></div>
            <button class="btn-icon" data-a="item-menu" data-i="${i}" aria-label="Options">${ic('more')}</button></div>`; }).join('')}</div>`
          : `<div class="caption" style="margin-top:0">No exercises yet — add a few below.</div>`}
        <button class="btn btn-block btn-tinted" style="margin-top:14px" data-a="add">${ic('plus')} Add Exercises</button>
        ${r ? `<button class="btn btn-block btn-danger" style="margin-top:28px" data-a="del">${ic('trash')} Delete Routine</button>` : ''}
      </div>`,
    mount: s => { const i = s.el.querySelector('#rt-name'); i.oninput = () => { d.name = i.value; }; if(!r && !d.name && !d.items.length) setTimeout(() => i.focus(), 380); },
    actions: {
      sets: (t, e, s) => { const it = d.items[+t.dataset.i]; it.sets = Math.max(1, Math.min(12, it.sets + +t.dataset.d)); s.rerender(); },
      'item-menu': async (t, e, s) => {
        const i = +t.dataset.i, acts = [];
        if(i > 0) acts.push({ k:'up', label:'Move Up' });
        if(i < d.items.length-1) acts.push({ k:'down', label:'Move Down' });
        acts.push({ k:'rm', label:'Remove', red:true });
        const k = await actionSheet({ title:getEx(d.items[i].exId).name, actions:acts });
        if(k === 'up') [d.items[i-1], d.items[i]] = [d.items[i], d.items[i-1]];
        else if(k === 'down') [d.items[i+1], d.items[i]] = [d.items[i], d.items[i+1]];
        else if(k === 'rm') d.items.splice(i, 1);
        else return;
        s.rerender();
      },
      add: (t, e, s) => pickExercises({ onDone: ids => { ids.forEach(id => d.items.push({ exId:id, sets: Math.min(12, (lastPerf(id) || []).length || 3) })); s.rerender(); } }),
      save: (t, e, s) => {
        const name = d.name.trim();
        if(!name){ toast('Give the routine a name'); return; }
        if(!d.items.length){ toast('Add at least one exercise'); return; }
        if(r){ r.name = name; r.items = d.items; } else S.routines.push({ id:uid(), name, items:d.items });
        save(); s.close(); refresh(); toast(r ? 'Routine updated' : `Routine “${name}” created`);
      },
      del: async (t, e, s) => {
        if(!(await confirmDlg(`Delete “${r.name}”?`, 'Workouts you’ve already logged from it are kept.'))) return;
        S.routines = S.routines.filter(x => x.id !== r.id);
        save(); s.close(); refresh(); toast('Routine deleted');
      }
    }
  });
}
async function routineMenu(id){
  const r = S.routines.find(x => x.id === id); if(!r) return;
  const k = await actionSheet({ title:r.name, actions:[{ k:'start', label:'Start Workout', bold:true }, { k:'edit', label:'Edit Routine' }, { k:'dup', label:'Duplicate' }, { k:'del', label:'Delete Routine', red:true }] });
  if(k === 'start') startRoutine(id);
  else if(k === 'edit') openRoutineEditor(id);
  else if(k === 'dup'){ S.routines.splice(S.routines.indexOf(r)+1, 0, { id:uid(), name:r.name + ' (copy)', items:r.items.map(i => ({ ...i })) }); save(); refresh(); }
  else if(k === 'del'){
    if(!(await confirmDlg(`Delete “${r.name}”?`, 'Workouts you’ve already logged from it are kept.'))) return;
    S.routines = S.routines.filter(x => x.id !== id); save(); refresh(); toast('Routine deleted');
  }
}

/* =========================================================
   History tab
   ========================================================= */
function sessCard(s, prs){
  const d = new Date(s.start), dur = sessDur(s);
  const ex = s.entries.slice(0, 4).map(e => { const b = entryBest(e.sets); return `<div><span class="faint num">${e.sets.length} ×</span> ${esc(e.name)} <span class="faint">· ${b.w ? fmtW(b.w) + ' ' + U() + ' × ' + b.wr : b.r + ' reps'}</span></div>`; }).join('');
  return `<button class="sess" data-a="sess" data-id="${esc(s.id)}">
    <div class="sess-top"><span class="sess-name">${esc(s.name)}</span><span class="sess-date">${d.toLocaleDateString(undefined, { weekday:'short', day:'numeric', month:'short' })}</span></div>
    <div class="sess-stats">${dur ? `<span>${ic('clock')}${fmtDurShort(dur)}</span>` : ''}<span>${ic('stack')}${fmtVol(sessVolume(s))} ${U()}</span><span>${ic('check')}${plural(sessSets(s),'set')}</span>${prs ? `<span class="badge">${ic('trophy')}${plural(prs.length,'PR')}</span>` : ''}</div>
    <div class="sess-ex">${ex}${s.entries.length > 4 ? `<div class="faint">+${s.entries.length - 4} more</div>` : ''}</div>
  </button>`;
}
function renderHistory(){
  const v = $('#v-history');
  const list = S.sessions.slice().sort((a,b) => new Date(b.start) - new Date(a.start));
  let html = `<div class="topbar"><span></span><button class="btn-icon" data-a="log-past" aria-label="Log a past workout">${ic('plus')}</button></div><h1 class="large-title">History</h1>`;
  if(!list.length){ v.innerHTML = html + emptyHTML('clock', 'No workouts yet', 'Finished workouts show up here. Use + to log one you did earlier.'); return; }
  const monthKey = d => d.toLocaleDateString(undefined, { month:'long', year:'numeric' });
  const counts = {}; list.forEach(s => { const k = monthKey(new Date(s.start)); counts[k] = (counts[k] || 0) + 1; });
  const prs = cache().prs; let cur = '';
  for(const s of list.slice(0, ui.histLimit)){
    const m = monthKey(new Date(s.start));
    if(m !== cur){ cur = m; html += `<div class="month-h"><span>${m}</span><span>${plural(counts[m],'workout')}</span></div>`; }
    html += sessCard(s, prs[s.id]);
  }
  if(list.length > ui.histLimit) html += `<button class="btn btn-block btn-gray" style="margin-top:16px" data-a="hist-more">Show older workouts</button>`;
  v.innerHTML = html;
}

/* =========================================================
   Progress tab
   ========================================================= */
function daySessions(){ const m = {}; S.sessions.forEach(s => { const k = dayKey(new Date(s.start)); (m[k] = m[k] || []).push(s); }); return m; }
function calendarHTML(){
  const m = ui.calMonth, y = m.getFullYear(), mo = m.getMonth(), now = new Date();
  const lead = (new Date(y, mo, 1).getDay() + 6) % 7, days = new Date(y, mo+1, 0).getDate();
  const map = daySessions(), today = dayKey(now);
  let cells = '', count = 0;
  for(let i = 0; i < lead; i++) cells += '<span></span>';
  for(let d = 1; d <= days; d++){
    const k = dayKey(new Date(y, mo, d)), has = map[k], cls = k === today ? ' today' : '';
    if(has){ count += has.length; cells += `<button class="cal-day has${cls}" data-a="cal-day" data-k="${k}" aria-label="${has.length} workout on ${k}">${d}</button>`; }
    else cells += `<span class="cal-day${cls}">${d}</span>`;
  }
  const isCur = y === now.getFullYear() && mo === now.getMonth();
  return `<div class="card">
    <div class="cal-head"><button class="btn-icon" data-a="cal" data-d="-1" aria-label="Previous month">${ic('chevL')}</button>
      <div class="center"><div style="font-weight:600">${m.toLocaleDateString(undefined, { month:'long', year:'numeric' })}</div><div class="small muted">${plural(count,'workout')}</div></div>
      <button class="btn-icon" data-a="cal" data-d="1" ${isCur ? 'disabled' : ''} aria-label="Next month">${ic('chevR')}</button></div>
    <div class="cal-grid">${['M','T','W','T','F','S','S'].map(x => `<span class="cal-dow">${x}</span>`).join('')}${cells}</div></div>`;
}
function renderProgress(){
  const v = $('#v-progress');
  if(!ui.calMonth){ const n = new Date(); ui.calMonth = new Date(n.getFullYear(), n.getMonth(), 1); }
  const head = `<div class="topbar"></div><h1 class="large-title">Progress</h1>`;
  if(!S.sessions.length){ v.innerHTML = head + emptyHTML('chart', 'No stats yet', 'Finish your first workout and your trends, records and streaks will appear here.', `<button class="btn btn-primary" data-a="tab" data-tab="workout">Start a Workout</button>`); return; }
  const now = new Date(), st = streaks(), wk = weekStats(), lw = weekStats(1);
  const monthCount = S.sessions.filter(s => { const d = new Date(s.start); return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); }).length;
  const change = lw.volume ? Math.round((wk.volume - lw.volume) / lw.volume * 100) : null;
  const recent = S.sessions.filter(s => now - new Date(s.start) < 30*864e5);
  const durs = recent.map(sessDur).filter(Boolean);
  const avgDur = durs.length ? durs.reduce((a,b) => a+b, 0) / durs.length : null;

  // Sets per muscle group, last 30 days
  const groups = {}; recent.forEach(s => s.entries.forEach(e => { groups[e.cat] = (groups[e.cat] || 0) + e.sets.length; }));
  const gList = Object.entries(groups).sort((a,b) => b[1] - a[1]), gMax = gList.length ? gList[0][1] : 1;

  // Top lifts by frequency
  const C_ = cache();
  const top = Object.keys(C_.byEx).map(id => ({ id, n:C_.byEx[id].length, b:C_.best[id] })).sort((a,b) => b.n - a.n).slice(0, 8);

  v.innerHTML = `${head}
    <div class="tiles">
      ${tile('Workouts', S.sessions.length, `${monthCount} this month`)}
      ${tile(`${ic('flame')}Week streak`, st.cur + '<small>wk</small>', `best ${st.best} wk`)}
      ${tile('Volume this week', fmtCompact(wk.volume) + `<small>${U()}</small>`, change == null ? `${plural(wk.count,'workout')}` : `${change >= 0 ? '▲' : '▼'} ${Math.abs(change)}% vs last week`)}
      ${tile('Avg. duration', avgDur ? fmtDurShort(avgDur) : '—', 'last 30 days')}
    </div>
    <div class="section-h"><h2>Calendar</h2></div>
    <div id="cal-wrap">${calendarHTML()}</div>
    <div class="section-h"><h2>Weekly volume</h2><span class="small muted">last 12 weeks · ${U()}</span></div>
    <div class="card"><div class="chart" id="wk-chart"></div></div>
    <div class="section-h"><h2>Muscle groups</h2><span class="small muted">sets · last 30 days</span></div>
    <div class="card">${gList.length ? gList.map(([c, n]) => `<div class="hbar"><span>${esc(c)}</span><div class="track"><div class="fill" style="width:${(n/gMax*100).toFixed(1)}%"></div></div><span class="val">${n}</span></div>`).join('') : '<div class="small muted">No sets logged in the last 30 days.</div>'}</div>
    <div class="section-h"><h2>Top lifts</h2><button class="link" data-a="tab" data-tab="exercises">All</button></div>
    <div class="list">${top.map(t => { const ex = getEx(t.id); return `<button class="row tap" data-a="ex" data-id="${esc(t.id)}"><div class="grow"><div class="title">${esc(ex.name)}</div><div class="sub">${t.b.w ? `Best ${fmtW(t.b.w)} ${U()} × ${t.b.wr} · e1RM ${fmtW1(t.b.e)}` : `Best ${t.b.r} reps`}</div></div><span class="trail num">${plural(t.n,'workout')}${chev()}</span></button>`; }).join('')}</div>`;

  const ws = startOfWeek(now), weeks = [];
  for(let i = 11; i >= 0; i--){
    const a = addDays(ws, -7*i), b = addDays(a, 7);
    const vol = S.sessions.filter(s => { const d = new Date(s.start); return d >= a && d < b; }).reduce((x, s) => x + sessVolume(s), 0);
    weeks.push({ label: i === 0 ? 'This wk' : a.toLocaleDateString(undefined, { day:'numeric', month:'short' }), tip: i === 0 ? 'This week' : 'Week of ' + a.toLocaleDateString(undefined, { day:'numeric', month:'short' }), value: toDisp(vol) });
  }
  barChart($('#wk-chart'), weeks, { fmt: v => Math.round(v).toLocaleString() + ' ' + U() });
}

/* ---------- Charts (inline SVG, single hue, hover/tap tooltips) ---------- */
function niceScale(min, max, n=4){
  if(min === max){ min = Math.max(0, min - 1); max = max + 1; }
  const step0 = (max - min) / (n - 1), mag = 10 ** Math.floor(Math.log10(step0)), norm = step0 / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, ticks = [];
  for(let v = lo; v <= hi + step*1e-6; v += step) ticks.push(Math.round(v * 1e6) / 1e6);
  return [lo, hi, ticks];
}
const fmtAxis = v => v >= 1000 ? fmtNum(v/1000, v >= 100000 ? 0 : 1) + 'k' : fmtNum(v, 1);
const shortDate = x => new Date(x).toLocaleDateString(undefined, { day:'numeric', month:'short' });
function lineChart(el, pts, { fmt }){
  if(!pts.length){ el.innerHTML = '<div class="chart-empty">No data yet</div>'; return; }
  const W = el.clientWidth || 320, H = el.clientHeight || 190;
  const L = 6, R = 46, T = 30, B = 22;
  let x0 = Math.min(...pts.map(p => p.x)), x1 = Math.max(...pts.map(p => p.x));
  if(x1 === x0){ x0 -= 864e5; x1 += 864e5; }
  const [y0, y1, ticks] = niceScale(Math.min(...pts.map(p => p.y)), Math.max(...pts.map(p => p.y)));
  const X = x => L + (x - x0) / (x1 - x0) * (W - L - R);
  const Y = y => T + (1 - (y - y0) / ((y1 - y0) || 1)) * (H - T - B);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + X(p.x).toFixed(1) + ',' + Y(p.y).toFixed(1)).join('');
  const area = pts.length > 1 ? `${line}L${X(pts[pts.length-1].x).toFixed(1)},${H-B}L${X(pts[0].x).toFixed(1)},${H-B}Z` : '';
  const last = pts[pts.length-1];
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend chart">
    <defs><linearGradient id="lg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0a84ff" stop-opacity=".28"/><stop offset="1" stop-color="#0a84ff" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(t => `<line x1="${L}" x2="${W-R+6}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="rgba(255,255,255,.08)"/><text class="ax" x="${W-R+10}" y="${(Y(t)+4).toFixed(1)}">${fmtAxis(t)}</text>`).join('')}
    <text class="ax" x="${L}" y="${H-5}">${shortDate(pts[0].x)}</text>
    ${pts.length > 1 ? `<text class="ax" x="${W-R}" y="${H-5}" text-anchor="end">${shortDate(last.x)}</text>` : ''}
    ${area ? `<path d="${area}" fill="url(#lg)"/>` : ''}
    <path d="${line}" fill="none" stroke="#0a84ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.length <= 40 ? pts.map(p => `<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.5" fill="#0a84ff" stroke="var(--card-2)" stroke-width="2"/>`).join('') : ''}
    <circle cx="${X(last.x).toFixed(1)}" cy="${Y(last.y).toFixed(1)}" r="5" fill="#0a84ff" stroke="var(--card-2)" stroke-width="2"/>
    <g class="hover" style="display:none"><line y1="${T-6}" y2="${H-B}" stroke="rgba(255,255,255,.35)" stroke-dasharray="3 3"/><circle r="6" fill="#0a84ff" stroke="#fff" stroke-width="2"/></g>
  </svg><div class="tip"></div>`;
  const g = el.querySelector('.hover'), tip = el.querySelector('.tip');
  const show = cx => {
    let best = pts[0], bd = Infinity;
    for(const p of pts){ const d = Math.abs(X(p.x) - cx); if(d < bd){ bd = d; best = p; } }
    const px = X(best.x), py = Y(best.y);
    g.style.display = ''; g.querySelector('line').setAttribute('x1', px); g.querySelector('line').setAttribute('x2', px);
    g.querySelector('circle').setAttribute('cx', px); g.querySelector('circle').setAttribute('cy', py);
    tip.innerHTML = `<b>${esc(fmt(best.y))}</b>${shortDate(best.x)}${best.sub ? ' · ' + esc(best.sub) : ''}`;
    tip.style.left = Math.min(W - 60, Math.max(60, px)) + 'px'; tip.classList.add('show');
  };
  const hide = () => { g.style.display = 'none'; tip.classList.remove('show'); };
  el.onpointermove = el.onpointerdown = e => show(e.clientX - el.getBoundingClientRect().left);
  el.onpointerleave = hide;
}
function barChart(el, bars, { fmt }){
  const W = el.clientWidth || 320, H = el.clientHeight || 190;
  const L = 2, R = 44, T = 30, B = 22;
  const [, y1, ticks] = niceScale(0, Math.max(1, ...bars.map(b => b.value)));
  const n = bars.length, bw = (W - L - R) / n, w = Math.max(4, bw - 6);
  const Y = v => T + (1 - v / y1) * (H - T - B);
  const base = H - B;
  const barPath = (x, y) => { const h = base - y, r = Math.min(4, h, w/2); return `M${x},${base}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${base}Z`; };
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly volume bar chart">
    ${ticks.map(t => `<line x1="${L}" x2="${W-R+6}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="rgba(255,255,255,${t === 0 ? .2 : .08})"/><text class="ax" x="${W-R+10}" y="${(Y(t)+4).toFixed(1)}">${fmtAxis(t)}</text>`).join('')}
    ${bars.map((b, i) => { const x = L + i*bw + (bw - w)/2; return (b.value > 0 ? `<path d="${barPath(x, Y(b.value))}" fill="#0a84ff" fill-opacity="${i === n-1 ? 1 : .55}" data-i="${i}"/>` : '') + ((i % 3 === 2 || i === n-1) && (i === n-1 || i < n-2) ? `<text class="ax" x="${(x + w/2).toFixed(1)}" y="${H-5}" text-anchor="middle">${esc(b.label)}</text>` : ''); }).join('')}
  </svg><div class="tip"></div>`;
  const tip = el.querySelector('.tip'), paths = el.querySelectorAll('path[data-i]');
  const show = cx => {
    const i = Math.max(0, Math.min(n-1, Math.floor((cx - L) / bw))), b = bars[i];
    paths.forEach(p => p.setAttribute('fill-opacity', +p.dataset.i === i ? 1 : .35));
    tip.innerHTML = `<b>${esc(fmt(b.value))}</b>${esc(b.tip)}`;
    tip.style.left = Math.min(W - 60, Math.max(60, L + i*bw + bw/2)) + 'px'; tip.classList.add('show');
  };
  const hide = () => { tip.classList.remove('show'); paths.forEach(p => p.setAttribute('fill-opacity', +p.dataset.i === n-1 ? 1 : .55)); };
  el.onpointermove = el.onpointerdown = e => show(e.clientX - el.getBoundingClientRect().left);
  el.onpointerleave = hide;
}

/* ---------- Plate calculator ---------- */
function plateHTML(target){
  const u = U(), bar = S.settings.bar[u], plates = [...S.settings.plates[u]].sort((a,b) => b - a);
  if(isNaN(target)) return '';
  if(target < bar) return `<div class="plate-text muted" style="margin-top:30px">That’s less than the bar (${fmtNum(bar)} ${u}).</div>`;
  let side = (target - bar) / 2 + 1e-9; const used = [];
  for(const p of plates){ while(side >= p){ used.push(p); side -= p; } }
  const actual = bar + 2 * used.reduce((a,b) => a + b, 0), max = plates[0] || 1;
  const col = p => (PLATE_COLORS[u] || {})[p] || '#8e8e93';
  return `<div class="bar-vis"><div class="bv-shaft"></div><div class="bv-collar"></div>${used.map(p => `<div class="bv-plate" style="height:${Math.round(44 + 96 * p / max)}px;background:${col(p)}"></div>`).join('')}<div class="bv-sleeve"></div></div>
    <div class="plate-text">${used.length ? `Each side: <b>${used.map(p => fmtNum(p)).join(' + ')}</b>` : 'Just the bar'}<div class="small muted">Bar ${fmtNum(bar)} ${u}${Math.abs(actual - target) > 1e-6 ? ` · closest you can load is <b style="color:var(--orange)">${fmtNum(actual)} ${u}</b>` : ''}</div></div>`;
}
function openPlates(kg){
  const u = U(), step = u === 'kg' ? 2.5 : 5;
  const st = { v: kg != null && kg > 0 ? +fmtW(kg) : (u === 'kg' ? 60 : 135) };

/* =========================================================
   Backup, import, CSV
   ========================================================= */
function backupJSON(){ return JSON.stringify({ app:'IronTrack', version:4, exportedAt:new Date().toISOString(), data:{ settings:S.settings, exercises:S.exercises, routines:S.routines, sessions:S.sessions } }); }
function markBackup(){ S.settings.lastBackup = new Date().toISOString(); save(); if(ui.tab === 'settings' || ui.tab === 'workout') render(); }
async function saveFile(name, text, type){
  const blob = new Blob([text], { type });
  if(matchMedia('(pointer:coarse)').matches){
    try {
      const file = new File([blob], name, { type });
      if(navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], title:name }); return true; }
    } catch(e){ if(e && e.name === 'AbortError') return false; }
  }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  return true;
}
async function exportFile(){ if(await saveFile(`irontrack-backup-${dayKey(new Date())}.json`, backupJSON(), 'application/json')){ markBackup(); toast('Backup saved'); } }
async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; } catch(e){}
  const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;opacity:0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false; try { ok = document.execCommand('copy'); } catch(e){}
  ta.remove(); return ok;
}
async function copyCode(){
  if(await copyText(backupJSON())){ markBackup(); toast('Backup code copied — paste it into Notes'); }
  else dialog({ title:'Copy this code', message:'Your browser blocked automatic copying. Select all of the text below and copy it.', input:{ multiline:true, value:backupJSON() }, buttons:[{ k:'ok', label:'Done', bold:true }] });
}
function parseBackup(text){
  let o;
  try { o = JSON.parse(String(text).trim()); } catch(e){ throw new Error('That doesn’t look like IronTrack backup data.'); }
  if(o && o.data && Array.isArray(o.data.sessions)) o = o.data;
  if(o && Array.isArray(o.sessions)){ const n = normalize(o); return { exercises:n.exercises, sessions:n.sessions, routines:n.routines, settings:o.settings ? n.settings : null }; }
  if(o && Array.isArray(o.history) && Array.isArray(o.exercises)){ const c = fromV3(o); return { exercises:c.exercises, sessions:c.sessions, routines:[], settings:null }; }
  throw new Error('No workouts were found in that data.');
}
async function importText(text){
  let p;
  try { p = parseBackup(text); } catch(e){ dialog({ title:'Couldn’t import', message:e.message }); return; }
  const k = await dialog({ title:'Import backup', message:`Found ${plural(p.sessions.length,'workout')}, ${plural(p.exercises.length,'exercise')} and ${plural(p.routines.length,'routine')}.`,
    buttons:[{ k:'merge', label:'Merge With My Data', bold:true }, { k:'replace', label:'Replace All My Data', red:true }, { k:'cancel', label:'Cancel' }] });
  if(k === 'replace'){
    if(!(await confirmDlg('Replace everything?', 'Your current workouts, exercises and routines will be overwritten by the backup.', 'Replace'))) return;
    S.exercises = p.exercises.length ? p.exercises : S.exercises; S.sessions = p.sessions; S.routines = p.routines;
    if(p.settings) S.settings = { ...p.settings, lastBackup:S.settings.lastBackup };
  } else if(k === 'merge'){
    const remap = {};
    for(const e of p.exercises){
      if(S.exercises.some(x => x.id === e.id)) continue;
      const same = S.exercises.find(x => x.name.toLowerCase() === e.name.toLowerCase());
      if(same) remap[e.id] = same.id; else S.exercises.push(e);
    }
    const fix = id => remap[id] || id;
    const ids = new Set(S.sessions.map(s => s.id));
    let added = 0;
    for(const s of p.sessions){ if(ids.has(s.id)) continue; s.entries.forEach(e => { e.exId = fix(e.exId); }); S.sessions.push(s); added++; }
    const rids = new Set(S.routines.map(r => r.id));
    for(const r of p.routines){ if(rids.has(r.id)) continue; r.items.forEach(i => { i.exId = fix(i.exId); }); S.routines.push(r); }
    save(); refresh(); toast(`Merged — ${plural(added,'new workout')} added`); return;
  } else return;
  save(); refresh(); toast('Backup restored');
}
async function pasteCode(){
  const r = await dialog({ title:'Paste backup code', message:'Paste a code copied from IronTrack — this works with codes from the old v3 app too.', input:{ multiline:true, placeholder:'Paste here…' }, buttons:[{ k:'cancel', label:'Cancel' }, { k:'ok', label:'Import', bold:true }] });
  if(r.k === 'ok' && r.value.trim()) importText(r.value);
}
function exportCSV(){
  const u = U(), rows = [['Date','Time','Workout','Exercise','Muscle group','Set',`Weight (${u})`,'Reps',`Est. 1RM (${u})`,'Duration (min)','Notes']];
  for(const s of cache().sorted){
    const d = new Date(s.start), dur = sessDur(s);
    s.entries.forEach(e => e.sets.forEach((x, i) => rows.push([dayKey(d), s.legacy ? '' : fmtTime(s.start), s.name, e.name, e.cat, i+1, fmtW(x.w), x.r, x.w ? fmtW1(e1rm(x.w, x.r)) : '', dur ? Math.round(dur/60000) : '', s.notes || ''])));
  }
  const cell = v => { const t = String(v ?? ''); return /[",\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  saveFile(`irontrack-${dayKey(new Date())}.csv`, '﻿' + rows.map(r => r.map(cell).join(',')).join('\r\n'), 'text/csv').then(ok => { if(ok) toast('CSV exported'); });
}
async function eraseAll(){
  if(!(await confirmDlg('Erase all data?', 'Every workout, exercise and routine will be deleted from this device. This can’t be undone — export a backup first if you might want it.', 'Erase Everything'))) return;
  const settings = S.settings;
  S = freshState(); S.settings = settings; S.exercises = defaultExercises();
  rest.end = 0; rest.doneUntil = 0;
  save(); syncWakeLock(); refresh(); toast('All data erased');
}

/* =========================================================
   Keyboard accessory bar (± steppers, plates, tick) for set inputs
   ========================================================= */
const kbd = $('#kbd');
let kbdTarget = null;
function posKbd(){
  if(kbd.classList.contains('hidden')) return;
  const vv = window.visualViewport;
  const off = vv ? window.innerHeight - vv.height - vv.offsetTop : 0;
  kbd.style.transform = `translateY(${-Math.max(0, off)}px)`;
}
function showKbd(t){
  kbdTarget = t;
  const isW = t.dataset.f === 'w', step = isW ? (U() === 'lb' ? 5 : 2.5) : 1;
  kbd.innerHTML = `<button data-k="-">−${fmtNum(step)}</button><button data-k="+">+${fmtNum(step)}</button>${isW ? `<button data-k="plates" aria-label="Plate calculator">${ic('plates')}</button>` : ''}<span class="sp"></span>${t.closest('.editor.edit') ? '' : `<button class="ok" data-k="tick">${ic('check')} Done set</button>`}`;
  kbd.classList.remove('hidden'); posKbd();
  setTimeout(() => {
    const vv = window.visualViewport, limit = (vv ? vv.height + vv.offsetTop : window.innerHeight) - kbd.offsetHeight - 8;
    const r = t.getBoundingClientRect();
    if(r.bottom > limit) t.scrollIntoView({ block:'center', behavior:'smooth' });
  }, 320);
}
function hideKbd(){ kbd.classList.add('hidden'); kbdTarget = null; }
document.addEventListener('focusin', e => { if(e.target.classList && e.target.classList.contains('set-in')) showKbd(e.target); else hideKbd(); });
document.addEventListener('focusout', () => setTimeout(() => { const a = document.activeElement; if(!a || !a.classList || !a.classList.contains('set-in')) hideKbd(); }, 60));
['pointerdown', 'mousedown'].forEach(ev => kbd.addEventListener(ev, e => e.preventDefault()));
kbd.addEventListener('click', e => {
  const b = e.target.closest('[data-k]'), t = kbdTarget; if(!b || !t) return;
  const k = b.dataset.k, isW = t.dataset.f === 'w';
  if(k === '+' || k === '-'){
    const step = isW ? (U() === 'lb' ? 5 : 2.5) : 1;
    let cur = toNum(t.value); if(isNaN(cur)) cur = toNum(t.placeholder); if(isNaN(cur)) cur = 0;
    let nv = Math.max(0, cur + (k === '+' ? step : -step));
    nv = isW ? Math.round(nv * 100) / 100 : Math.round(nv);
    t.value = String(nv); t.dispatchEvent(new Event('input', { bubbles:true }));
  } else if(k === 'plates'){
    const v = toNum(t.value) || toNum(t.placeholder); t.blur(); openPlates(isNaN(v) ? null : fromDisp(v));
  } else if(k === 'tick'){
    const btn = t.closest('.set-row')?.querySelector('[data-ed=check]'); t.blur(); if(btn) btn.click();
  }
});
if(window.visualViewport){ visualViewport.addEventListener('resize', posKbd); visualViewport.addEventListener('scroll', posKbd); }

/* =========================================================
   Global actions (main views, dock, tab bar)
   ========================================================= */
const ACT = {
  tab: t => setTab(t.dataset.tab),
  'start-empty': () => startWorkout({}),
  'start-routine': t => startRoutine(t.dataset.id),
  'routine-menu': t => routineMenu(t.dataset.id),
  'new-routine': () => openRoutineEditor(null),
  plates: () => openPlates(null),
  finish: () => finishWorkout(),
  discard: () => discardWorkout(),
  'rest-menu': async () => {
    const actions = REST_OPTIONS.map(s => ({ k:String(s), label:fmtClock(s) }));
    if(rest.end) actions.unshift({ k:'stop', label:'Stop Timer', red:true });
    const k = await actionSheet({ title:'Start a rest timer', actions });
    if(k === 'stop') stopRest(); else if(k) startRest(+k);
  },
  'rest-adj': t => adjustRest(+t.dataset.d),
  'rest-skip': () => stopRest(),
  sess: t => openSession(t.dataset.id),
  'log-past': () => openSessionEditor(null),
  'hist-more': () => { ui.histLimit += 40; render(); },
  cal: t => { const m = ui.calMonth; ui.calMonth = new Date(m.getFullYear(), m.getMonth() + (+t.dataset.d), 1); $('#cal-wrap').innerHTML = calendarHTML(); },
  'cal-day': async t => {
    const list = daySessions()[t.dataset.k] || [];
    if(list.length === 1) return openSession(list[0].id);
    const k = await actionSheet({ title:new Date(list[0].start).toLocaleDateString(undefined, { weekday:'long', day:'numeric', month:'long' }), actions:list.map(s => ({ k:s.id, label:s.name })) });
    if(k) openSession(k);
  },
  ex: t => openExerciseDetail(t.dataset.id),
  'new-ex': () => openExerciseForm(null, { cat: ui.exCat !== 'All' ? ui.exCat : 'Other' }),
  'ex-cat': t => { ui.exCat = t.dataset.v; document.querySelectorAll('#v-exercises .chip').forEach(c => c.classList.toggle('on', c.dataset.v === ui.exCat)); $('#ex-list').innerHTML = exListHTML(); },
  unit: t => { S.settings.unit = t.dataset.v; save(); render(); },
  'rest-step': t => { S.settings.rest = Math.max(15, Math.min(600, S.settings.rest + (+t.dataset.d))); save(); render(); },
  'bar-step': t => { const u = U(), step = u === 'kg' ? 2.5 : 5; S.settings.bar[u] = Math.max(0, S.settings.bar[u] + (+t.dataset.d) * step); save(); render(); },
  'plates-edit': async () => {
    const u = U();
    const v = await promptDlg(`Plates (${u})`, 'List the plate sizes you have, separated by commas.', S.settings.plates[u].map(p => fmtNum(p)).join(', '), 'e.g. 25, 20, 15, 10, 5, 2.5');
    if(v == null) return;
    const list = [...new Set(v.split(/[,;\s]+/).map(toNum).filter(n => n > 0))].sort((a,b) => b - a);
    if(!list.length){ toast('Enter at least one plate size'); return; }
    S.settings.plates[u] = list; save(); render();
  },
  'export-file': () => exportFile(),
  'copy-code': () => copyCode(),
  'import-file': () => $('#file-in').click(),
  'paste-code': () => pasteCode(),
  'export-csv': () => exportCSV(),
  erase: () => eraseAll(),
  'nudge-x': () => { ui.hideNudge = true; render(); },
  'install-x': () => { prefSet('it_hide_install', '1'); render(); }
};
$('#app').addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if(!t) return;
  const fn = ACT[t.dataset.a]; if(fn) fn(t, e);
});
$('#file-in').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if(f) importText(await f.text());
});

/* =========================================================
   Boot
   ========================================================= */
S = load();
if(migratedCount) save();
if(S.active && S.active.restEnd > Date.now()){ rest.end = S.active.restEnd; rest.total = S.active.restTotal || S.settings.rest; }
$('#tabbar').innerHTML = TABS.map(([id, icon, label]) => `<button class="tab" data-a="tab" data-tab="${id}">${ic(icon)}<span>${label}</span></button>`).join('');
setTab('workout');
setInterval(tick, 250);
syncWakeLock();
document.addEventListener('pointerdown', () => { if(!actx || actx.state === 'suspended') unlockAudio(); }, { passive:true });
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') flushSave(); syncWakeLock(); });
window.addEventListener('pagehide', flushSave);
let resizeT;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if(ui.tab === 'progress') render(); sheets.forEach(s => { if(s.opts.live) s.rerender(); }); }, 200); });
if(migratedCount) setTimeout(() => toast(`Imported ${plural(migratedCount,'workout')} from IronTrack v3`), 600);
if('serviceWorker' in navigator && (isHosted || location.hostname === 'localhost')){
  navigator.serviceWorker.register('sw.js').catch(() => {});
  const checkUpdate = () => navigator.serviceWorker.ready.then(reg => { if(reg.active) reg.active.postMessage('check'); }).catch(() => {});
  checkUpdate();
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') checkUpdate(); });
  let updatePrompted = false;
  navigator.serviceWorker.addEventListener('message', async e => {
    if(e.data !== 'update-ready' || updatePrompted) return;
    updatePrompted = true;
    const k = await dialog({ title:'Update ready', message:'A new version of IronTrack has downloaded. Your data isn’t affected.', buttons:[{ k:'later', label:'Later' }, { k:'reload', label:'Reload', bold:true }] });
    if(k === 'reload'){ flushSave(); location.reload(); }
  });
  navigator.serviceWorker.startMessages();
}
</script>
