.recap-img{-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}   /* press and hold to save it */
.recap-row{width:100%;text-align:left;margin-top:0;margin-bottom:16px}
.recap-row .ico{background:var(--accent-soft);color:var(--volt);border-color:var(--line-volt)}
.recap-row:active{transform:scale(.985)}
.wn-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 22px}
.wn-v{font:700 10px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--volt);padding:7px 10px;border:1px solid var(--line-volt);border-radius:999px}

.wn-intro{font-size:15px;line-height:1.5;color:var(--label-2);margin:0 0 18px}
.wn-intro b{color:var(--label)}
.wn-list{display:flex;flex-direction:column;gap:10px}
.wn-item{display:flex;gap:13px;align-items:flex-start;padding:13px 14px;border-radius:16px;background:var(--g-card),var(--card);border:1px solid var(--line)}
.wn-ico{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--volt);border:1px solid var(--line-volt)}
.wn-ico svg{width:19px;height:19px}
.wn-it{font:800 13.5px/1.2 var(--f-disp);font-stretch:112%;text-transform:uppercase;letter-spacing:.03em}
.wn-id{font-size:13.5px;line-height:1.45;color:var(--label-2);margin-top:4px}
.wn-id b{color:var(--label)}
</style>

let S;

function defaultSettings(){

}
function exFromDefault([name, cat, rest, iv]){
  const o = { id:uid(), name, cat };

/* Adds any starter routines not already present (by name) to `exercises`/`routines`,

function addStarterRoutines(exercises, routines){
  let added = 0;
  for(const t of STARTER_ROUTINES){
    if(routines.some(r => r.name.toLowerCase() === t.name.toLowerCase())) continue;
    const items = t.items.map(([name, sets]) => {
      let ex = exercises.find(e => normName(e.name) === normName(name));
      if(!ex){
        ex = exFromDefault(DEFAULT_EX.find(x => x[0] === name) || [name, 'Other']);
        exercises.push(ex);

function normBody(b){

    entries: (Array.isArray(b.entries) ? b.entries : []).filter(e => e && /^\d{4}-\d{2}-\d{2}$/.test(e.date)).map(e => {

function cleanSets(sets){
  return (Array.isArray(sets) ? sets : []).map(s => {
    const o = { w: Math.max(0, toNum(s.w ?? s.weight) || 0), r: Math.max(0, Math.round(toNum(s.r ?? s.reps) || 0)) };
    const t = Math.round(toNum(s.t) || 0); if(t > 0) o.t = t;

function normalize(d){
  const st = freshState();

  st.settings.name = typeof st.settings.name === 'string' ? st.settings.name.slice(0, 30) : '';   // display name for the greeting (5.0)
  if(!['kg','lb'].includes(st.settings.unit)) st.settings.unit = 'kg';
  if(!['cm','in'].includes(st.settings.lenUnit)) st.settings.lenUnit = 'cm';
  if(!REMIND_LABEL[st.settings.bodyRemind]) st.settings.bodyRemind = 'monthly';
  if(!['km','mi'].includes(st.settings.distUnit)) st.settings.distUnit = null;
  st.exercises = (d.exercises||[]).filter(e => e && e.id != null && e.name).map(e => {
    const o = { id:String(e.id), name:String(e.name), cat: CATS.includes(e.cat) ? e.cat : 'Other' };
    if(+e.rest > 0) o.rest = +e.rest;
    if(e.mode === 'timed') o.mode = 'timed';
    if(e.iv){ const clamp = (v, lo, hi, d) => { v = Math.round(+v); return isNaN(v) ? d : Math.max(lo, Math.min(hi, v)); };

    items:(r.items||[]).filter(i => i && (i.exId != null || (i.cardio && CT[i.cardio]))).map(i => i.cardio
      ? { cardio:i.cardio, indoor:!!(i.indoor && CT[i.cardio].indoor), tgt:normTgt(i.tgt) }
      : { exId:String(i.exId), sets: Math.max(1, Math.min(12, Math.round(+i.sets) || 3)) }) }));
  st.sessions = (d.sessions||[]).filter(x => x && x.id && x.start && Array.isArray(x.entries)).map(x => ({
    id:String(x.id), name:String(x.name||'Workout'), start:x.start, end:x.end||null, legacy:!!x.legacy,
    routineId:x.routineId||null, notes:String(x.notes||''),

/* v3 stored one log per exercise; v4 groups a day's logs into one session. */
function fromV3(d){
  const exercises = (d.exercises||[]).filter(e => e && e.id != null).map(e => ({ id:String(e.id), name:String(e.name||'Exercise'), cat: CATS.includes(e.category) ? e.category : 'Other' }));
  const logs = (d.history||[]).filter(l => l && l.date && Array.isArray(l.sets)).slice().sort((a,b) => new Date(a.date) - new Date(b.date));
  const byDay = new Map();
  for(const l of logs){ const k = dayKey(new Date(l.date)); if(!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(l); }
  const sessions = [];
  for(const [k, dayLogs] of byDay){
    const entries = [];
    for(const l of dayLogs){
      const sets = cleanSets(l.sets);
      if(!sets.length) continue;
      const exId = String(l.exerciseId);
      const found = entries.find(e => e.exId === exId);
      if(found) found.sets.push(...sets);
      else entries.push({ exId, name:String(l.exerciseName||'Exercise'), cat: CATS.includes(l.category) ? l.category : 'Other', sets });
    }
    if(!entries.length) continue;
    sessions.push({ id:'v3-'+k, name:autoName([...new Set(entries.map(e => e.cat))]), start:dayLogs[0].date, end:dayLogs[dayLogs.length-1].date, legacy:true, routineId:null, notes:'', entries });
  }
  return { exercises, sessions };
}

function load(){
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch(e){}
  if(raw){ try { return normalize(JSON.parse(raw)); } catch(e){ console.error('Bad saved data', e); } }
  const st = freshState();
  let v3ex = null, v3hist = null;
  try { v3ex = JSON.parse(localStorage.getItem('it_exercises') || 'null'); v3hist = JSON.parse(localStorage.getItem('it_history') || 'null'); } catch(e){}
  if(Array.isArray(v3hist) && v3hist.length){
    const c = fromV3({ exercises: Array.isArray(v3ex) ? v3ex : [], history: v3hist });
    st.exercises = c.exercises.length ? c.exercises : defaultExercises();
    st.sessions = c.sessions;
    migratedCount = c.sessions.length;
  } else if(Array.isArray(v3ex) && v3ex.length){
    st.exercises = fromV3({ exercises: v3ex, history: [] }).exercises;
  } else {
    st.exercises = defaultExercises();
    addStarterRoutines(st.exercises, st.routines);
  }
  return st;
}

let C = null;
function invalidate(){ C = null; }
/* Reps-based bests (w/e/r) ignore timed sets; timed sets track best reps per
   work duration (tr), the single best timed set (tb) and longest rep-less hold. */
function entryBest(sets){
  let w=0, wr=0, e=0, eW=0, eR=0, r=0, hold=0, tb=null; const tr = {};
  for(const x of sets){
    if(x.t){
      if(x.r > 0){ if(!(tr[x.t] >= x.r)) tr[x.t] = x.r; if(!tb || x.r > tb.r) tb = { t:x.t, r:x.r }; }
      else if(x.t > hold) hold = x.t;
      continue;
    }
    if(x.w > w || (x.w === w && x.r > wr)){ w = x.w; wr = x.r; }
    const v = e1rm(x.w, x.r); if(v > e){ e = v; eW = x.w; eR = x.r; }
    if(x.r > r) r = x.r;
  }
  return { w, wr, e, eW, eR, r, hold, tb, tr };
}
function copyBest(x){ return { ...x, tr:{ ...x.tr } }; }
function mergeBest(b, x){
  if(x.w > b.w || (x.w === b.w && x.wr > b.wr)){ b.w = x.w; b.wr = x.wr; }
  if(x.e > b.e){ b.e = x.e; b.eW = x.eW; b.eR = x.eR; }
  if(x.r > b.r) b.r = x.r;
  if(x.hold > b.hold) b.hold = x.hold;
  if(x.tb && (!b.tb || x.tb.r > b.tb.r)) b.tb = x.tb;
  for(const t in x.tr) if(!(b.tr[t] >= x.tr[t])) b.tr[t] = x.tr[t];
}
function bestLabel(b, preferTimed){
  if(!b) return '';
  const timed = b.tb ? `${b.tb.r} reps in ${b.tb.t}s` : b.hold ? `${b.hold}s hold` : '';
  if(preferTimed && timed) return timed;
  if(b.w > 0) return `${fmtW(b.w)} ${U()} × ${b.wr}`;
  if(b.r > 0) return `${b.r} reps`;
  return timed;
}
function cache(){
  if(C) return C;
  const sorted = S.sessions.slice().sort((a,b) => new Date(a.start) - new Date(b.start));
  const byEx = {}, prs = {}, best = {};
  for(const s of sorted){
    const list = [];
    for(const e of s.entries){
      (byEx[e.exId] = byEx[e.exId] || []).push({ s, e });
      const x = entryBest(e.sets), b = best[e.exId];
      if(!b){ best[e.exId] = copyBest(x); continue; }
      const trPR = Object.keys(x.tr).find(t => b.tr[t] != null && x.tr[t] > b.tr[t]);
      if(x.w > b.w) list.push({ exId:e.exId, kind:'w', w:x.w, r:x.wr });
      else if(x.w > 0 && x.e > b.e + 0.01) list.push({ exId:e.exId, kind:'e', e:x.e, w:x.eW, r:x.eR });
      else if(x.w === 0 && b.w === 0 && x.r > b.r && b.r > 0) list.push({ exId:e.exId, kind:'r', r:x.r });
      else if(trPR) list.push({ exId:e.exId, kind:'tr', t:+trPR, r:x.tr[trPR] });
      else if(b.hold > 0 && x.hold > b.hold) list.push({ exId:e.exId, kind:'hold', t:x.hold });
      mergeBest(b, x);
    }
    if(list.length) prs[s.id] = list;
  }
  C = { sorted, byEx, prs, best };
  return C;
}
function prText(p){
  if(p.kind === 'w') return { label:'Heaviest weight', text:`${fmtW(p.w)} ${U()} × ${p.r}` };
  if(p.kind === 'e') return { label:`Best est. 1RM (${fmtW(p.w)} × ${p.r})`, text:`${fmtW1(p.e)} ${U()}` };
  if(p.kind === 'tr') return { label:`Most reps in ${p.t}s`, text:`${p.r} reps` };
  if(p.kind === 'hold') return { label:'Longest hold', text:`${p.t}s` };
  return { label:'Most reps', text:`${p.r} reps` };
}
/* History for an exercise strictly before a draft (excluding the draft itself). */
function priorEntries(exId, draft){
  const h = cache().byEx[exId] || [];
  if(!draft) return h;
  const t = new Date(draft.start);
  return h.filter(({s}) => s.id !== draft.id && new Date(s.start) < t);
}
function lastPerf(exId, draft){ const h = priorEntries(exId, draft); return h.length ? h[h.length-1].e.sets : null; }
function bestFor(exId, draft){
  let b = null;
  for(const {e} of priorEntries(exId, draft)){ const x = entryBest(e.sets); if(!b) b = copyBest(x); else mergeBest(b, x); }
  return b;

function isPR(s, b){

  if(s.t) return s.r > 0 ? (b.tr[s.t] != null && s.r > b.tr[s.t]) : (b.hold > 0 && s.t > b.hold);
  if(!s.r) return false;
  return s.w > b.w + 1e-9 || (s.w > 0 && e1rm(s.w, s.r) > b.e + 0.01) || (!s.w && !b.w && s.r > b.r);

function getEx(id){

  const h = cache().byEx[id];
  if(h && h.length){ const last = h[h.length-1].e; return { id, name:last.name, cat:last.cat, deleted:true }; }
  const a = S.active && S.active.entries.find(x => x.exId === id);
  if(a) return { id, name:a.name, cat:a.cat, deleted:true };
  return { id, name:'Exercise', cat:'Other', deleted:true };
}
const restFor = exId => getEx(exId).rest || S.settings.rest;
function sessSets(s){ return s.entries.reduce((a,e) => a + e.sets.length, 0); }
function weekStats(offset=0){
  const ws = addDays(startOfWeek(new Date()), -7*offset), we = addDays(ws, 7);
  const inWk = x => { const d = new Date(x.start); return d >= ws && d < we; };
  const list = S.sessions.filter(inWk), bySess = cardioCache().bySess;
  const cl = S.cardio.filter(inWk), cardioSec = cl.reduce((a,c) => a + (c.dur || 0), 0);

  const liftSec = list.reduce((a,s) => a + Math.max(0, (sessDur(s) || 0)/1000 - (bySess[s.id] || []).reduce((x, c) => x + (c.dur || 0), 0)), 0);

  const weeks = new Set([...S.sessions, ...S.cardio].map(s => +startOfWeek(new Date(s.start))));

  if(!weeks.has(+w)) w = addDays(w, -7);
  while(weeks.has(+w)){ cur++; w = addDays(w, -7); }

  for(const t of [...weeks].sort((a,b) => a-b)){
    run = (prev != null && Math.round((t - prev)/(7*864e5)) === 1) ? run + 1 : 1;

function openSheet(opts){
  const back = document.createElement('div'); back.className = 'sheet-backdrop';
  const el = document.createElement('div'); el.className = 'sheet' + (opts.full ? ' full' : ''); el.setAttribute('role', 'dialog');
  const z = 100 + sheets.length*2; back.style.zIndex = z; el.style.zIndex = z + 1;

  const s = {
    el, back, opts,
    close: () => closeSheet(s),
    rerender(){

      el.innerHTML = opts.render(s);

function closeSheet(s){

let actx = null;
function unlockAudio(){
  try {
    if(!actx){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) actx = new AC(); }
    if(actx && actx.state === 'suspended') actx.resume();
  } catch(e){}
}
/* Plays [delaySec, frequencyHz, lengthSec] tones. */
function tones(list){
  if(!S.settings.sound || !actx) return;
  try {
    const t0 = actx.currentTime;
    list.forEach(([dt, f, len]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t0+dt); g.gain.exponentialRampToValueAtTime(.35, t0+dt+.015); g.gain.exponentialRampToValueAtTime(.0001, t0+dt+len);
      o.connect(g); g.connect(actx.destination); o.start(t0+dt); o.stop(t0+dt+len+.02);
    });
  } catch(e){}
}
function beep(){ tones([[0, 880, .15], [.2, 880, .15], [.4, 1175, .15]]); }
function haptic(p){ if(S.settings.vibrate && navigator.vibrate){ try { navigator.vibrate(p); } catch(e){} } }
let wakeLock = null;
async function syncWakeLock(){
  const want = (!!S.active || IV.on) && S.settings.keepAwake && document.visibilityState === 'visible';
  try {
    if(want && !wakeLock && navigator.wakeLock){ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    else if(!want && wakeLock){ await wakeLock.release(); wakeLock = null; }
  } catch(e){}
}

const rest = { end:0, total:0, label:'', doneUntil:0 };
function startRest(sec, label=''){
  if(!(sec > 0)) return;
  unlockAudio();
  Object.assign(rest, { total:sec, end:Date.now() + sec*1000, label, doneUntil:0 });
  if(S.active){ S.active.restEnd = rest.end; S.active.restTotal = sec; saveSoon(); }
  updateDock();
}
function adjustRest(d){
  if(!rest.end) return;
  rest.end += d*1000; rest.total = Math.max(1, rest.total + d);
  if(S.active){ S.active.restEnd = rest.end; S.active.restTotal = rest.total; saveSoon(); }
  if(rest.end <= Date.now()) finishRest(); else updateRestPill();
}
function stopRest(){
  rest.end = 0; rest.doneUntil = 0;
  if(S.active){ delete S.active.restEnd; delete S.active.restTotal; saveSoon(); }
  updateDock();
}
function finishRest(){
  rest.end = 0; rest.doneUntil = Date.now() + 4000;

const ARC = 2*Math.PI*17;
function updateRestPill(){

  const t = $('#rest-time'), a = $('#rest-arc');
  if(t) t.textContent = fmtClock(Math.ceil(left));
  if(a) a.setAttribute('stroke-dashoffset', (ARC * (1 - left/rest.total)).toFixed(2));
}

let lastSec = 0;
function tick(){
  const now = Date.now();
  if(rest.end && now >= rest.end) finishRest();
  if(rest.doneUntil && now > rest.doneUntil){ rest.doneUntil = 0; updateDock(); }
  if(rest.end) updateRestPill();
  if(IV.on) ivTick();
  if(S && S.active) cdTick(now);
  const sec = Math.floor(now/1000);
  if(sec !== lastSec){
    lastSec = sec;

  const ex = getEx(exId), prev = lastPerf(exId, draft);
  if(isTimedEx(ex)){
    const iv = exIv(ex), count = Math.min(20, n || iv.sets);
    return { exId, name:ex.name, cat:ex.cat, mode:'timed', iv:{ work:iv.work, rest:iv.rest }, sets:Array.from({ length:count }, () => ({ w:null, r:null, t:null, done:false })) };
  }
  const count = Math.min(12, n || (prev ? prev.length : 3));
  return { exId, name:ex.name, cat:ex.cat, sets:Array.from({ length:count }, () => ({ w:null, r:null, done:false })) };
}
function routineItems(sess){ return sessItems(sess).map(({ a, e }) => a ? { cardio:a.type, indoor:!!a.indoor, tgt:tgtFrom(a) } : { exId:e.exId, sets:Math.min(12, e.sets.length) }); }
/* Same exercises and machines in the same order (cardio targets may differ from one workout to the next). */
const routineShape = items => JSON.stringify(items.map(i => i.cardio ? 'c:' + i.cardio + ':' + !!i.indoor : i.exId + ':' + i.sets));
function startRoutine(id){ const r = S.routines.find(x => x.id === id); if(r) startWorkout({ name:r.name, routineId:r.id, items:r.items }); }
function repeatSession(id){ const s = S.sessions.find(x => x.id === id); if(s) startWorkout({ name:s.name, routineId:s.routineId, items:routineItems(s) }); }

async function finishWorkout(){
  const d = S.active; if(!d) return;
  if(document.activeElement) document.activeElement.blur();
  const pending = [];
  d.entries.forEach(en => en.sets.forEach(s => { if(!s.done && s.r > 0) pending.push([en, s]); }));
  const cPending = d.entries.filter(en => isCd(en) && !en.done && (cdHasValues(en) || en.cd));
  if(pending.length || cPending.length){
    const what = [pending.length ? plural(pending.length,'set') : '', ...cPending.map(en => cdLabel(en.type, en.indoor))].filter(Boolean);
    const k = await dialog({ title:`${what.length > 1 ? what.slice(0, -1).join(', ') + ' and ' + what[what.length-1] : what[0]} not ticked off`,
      message: pending.length && !cPending.length ? 'These sets have reps entered but weren’t marked complete.' : 'These have numbers entered but weren’t marked complete.',
      buttons:[{k:'log', label:'Log Them Too', bold:true}, {k:'drop', label:'Leave Them Out'}, {k:'cancel', label:'Cancel'}] });
    if(!k || k === 'cancel') return;
    if(k === 'log'){
      pending.forEach(([en, s]) => { s.done = true; if(s.w == null) s.w = 0; if(en.mode === 'timed' && !s.t) s.t = en.iv.work; });
      const ctx = { draft:d, mode:'active' };
      cPending.forEach(en => { if(en.cd){ const sec = Math.round(cdElapsed(en.cd, Date.now()) / 1000); delete en.cd; if(sec > 0){ const st = cdState(en); cfSet(st, null, 'time', sec); cfDerive(st, null, 'time'); cdWrite(en, st); } } cdComplete(ctx, en, true); });
    }
  }
  const start = preStart(d);
  const entries = cleanEntries(d.entries.filter(en => !isCd(en)), false), cardio = cdCollect(d, false);
  if(!entries.length && !cardio.length){
    const k = await dialog({ title:'Nothing completed', message:'Tick off at least one set or cardio block to save this workout.', buttons:[{k:'discard', label:'Discard', red:true}, {k:'back', label:'Keep Going', bold:true}] });
    if(k === 'discard') discardNow();
    return;
  }
  const sess = { id:d.id, name:(d.name||'').trim() || defaultName(new Date(d.start)), start, end:new Date().toISOString(), legacy:false, routineId:d.routineId||null, notes:(d.notes||'').trim(), entries };
  S.sessions.push(sess);
  S.cardio.push(...cardio);
  S.active = null;
  rest.end = 0; rest.doneUntil = 0;
  save(); syncWakeLock(); render(); updateDock();
  showSummary(sess, new Date(d.start) - new Date(start));
}
/* When the workout really started (5.1). Cardio typed in by hand at the top of a workout that also has
   lifting is a warm-up done before pressing Start (you ran, then opened the app), so the start moves
   back by its time: 10 min on the treadmill + 25 min on the clock = a 35 min workout. Cardio timed with
   the app's timer or stopwatch is already on the clock and adds nothing. Other hand-typed cardio only
   moves the start if it was logged sooner after Start than it lasted. Gives the warm-ups their real
   start times too. */
function preStart(d){
  const t0 = +new Date(d.start), warm = [];
  const lifts = d.entries.some(en => !isCd(en) && cleanEntries([en], false).length);
  let top = lifts, early = t0, sec = 0;
  for(const en of d.entries){
    if(!isCd(en)){ if(cleanEntries([en], false).length) top = false; continue; }
    if(!en.done) continue;
    const a = cdActivity(en, '');
    if(!cdValid(en, a) || !(a.dur > 0)) continue;
    if(en.t0){ top = false; continue; }
    if(top){ warm.push([en, a.dur]); sec += a.dur; }
    else if(en.at) early = Math.min(early, +new Date(en.at) - a.dur * 1000);
  }
  let t = t0 - sec * 1000;
  warm.forEach(([en, dur]) => { en.start = new Date(t).toISOString(); t += dur * 1000; });
  return new Date(Math.min(t0 - sec * 1000, early)).toISOString();
}
function cleanEntries(entries, ignoreDone){
  return entries.map(en => {
    const ex = getEx(en.exId);
    return { exId:en.exId, name:ex.name, cat:ex.cat, sets: en.sets.filter(s => (ignoreDone || s.done) && (s.r > 0 || s.t > 0)).map(s => {
      const o = { w: Math.max(0, s.w || 0), r: s.r || 0 };
      const t = s.t > 0 ? s.t : (en.mode === 'timed' && en.iv ? en.iv.work : 0);
      if(t > 0) o.t = t;
      return o;
    }) };
  }).filter(e => e.sets.length);
}
function discardNow(){ S.active = null; rest.end = 0; rest.doneUntil = 0; save(); syncWakeLock(); render(); updateDock(); toast('Workout discarded'); }
async function discardWorkout(){
  if(await confirmDlg('Discard workout?', 'Everything you’ve logged in this workout will be lost.', 'Discard')) discardNow();
}

async function saveAsRoutine(sessId){
  const sess = S.sessions.find(x => x.id === sessId); if(!sess) return false;
  const name = await promptDlg('Save as Routine', 'Give this routine a name.', sess.name, 'e.g. Push Day');

  S.routines.push(r);

}

function phFor(ctx, en, si){
  const prev = lastPerf(en.exId, ctx.draft);
  if(prev && prev[si]) return prev[si];

  if(before && before.r > 0) return { w:before.w || 0, r:before.r };
  if(prev && prev.length) return prev[prev.length-1];
  return null;
}

function timedEntryHTML(ctx, en, i, ex, prev, best){

      : `<button class="add-set" data-ed="add-set">${ic('plus')} Add Set</button>`}

function timedSetHTML(ctx, en, s, j, prev, best){

function updateMeta(ctx){
  let n = 0;
  for(const e of ctx.draft.entries) for(const s of e.sets){ if(ctx.mode === 'edit' ? (s.r > 0 || s.t > 0) : s.done) n++; }
  const a = ctx.root.querySelector('.m-sets');
  if(a) a.textContent = n;
  const l = ctx.root.querySelector('.m-sets-l'); if(l) l.textContent = n === 1 ? 'set' : 'sets';
}
function changed(ctx, structural){
  if(structural) renderEditor(ctx); else updateMeta(ctx);
  if(ctx.mode === 'active') saveSoon();
}
function refreshRowPR(ctx, en, s, row, si){
  if(ctx.mode !== 'active') return false;
  const pr = s.done && isPR(s, bestFor(en.exId, ctx.draft));
  row.classList.toggle('pr', pr);
  row.querySelector('.set-num').innerHTML = pr ? ic('trophy') : si + 1;
  return pr;
}
function edInput(ctx, e){
  if(e.target.dataset.cf){ const card = e.target.closest('.ex-card.cd'); if(card) cdInput(ctx, card, e.target); return; }
  const t = e.target, f = t.dataset.f; if(!f) return;
  const d = ctx.draft;
  if(f === 'name') d.name = t.value;
  else if(f === 'notes') d.notes = t.value;
  else if(f === 'start'){ const dt = new Date(t.value); if(!isNaN(dt)) d.start = dt.toISOString(); }
  else if(f === 'dur'){ const n = parseInt(t.value, 10); d.durMin = n > 0 ? Math.min(600, n) : null; }
  else {
    const row = t.closest('.set-row'), ei = +t.closest('.ex-card').dataset.ei, si = +row.dataset.si;
    const en = d.entries[ei], s = en.sets[si], raw = t.value.trim();
    if(f === 'w'){ const n = toNum(raw); s.w = (raw === '' || isNaN(n)) ? null : Math.max(0, fromDisp(n)); }
    else if(f === 't'){ const n = parseInt(raw, 10); s.t = (raw === '' || isNaN(n) || n <= 0) ? null : Math.min(3600, n); }
    else { const n = parseInt(raw, 10); s.r = (raw === '' || isNaN(n)) ? null : Math.max(0, n); }
    if(s.done) refreshRowPR(ctx, en, s, row, si);
  }
  changed(ctx);
}
function edClick(ctx, e){
  const t = e.target.closest('[data-ed]'); if(!t || !ctx.root.contains(t)) return;
  const card = t.closest('.ex-card'), ei = card ? +card.dataset.ei : -1;
  const en = ctx.draft.entries[ei];
  const row = t.closest('.set-row'), si = row ? +row.dataset.si : -1;
  if(t.dataset.ed.startsWith('cd-')){ cdClick(ctx, t.dataset.ed, ei); return; }
  switch(t.dataset.ed){
    case 'add-ex':
      pickExercises({ cardio:true, onDone: ids => { ids.forEach(id => { const en = id.startsWith('cardio:') ? cdFromPick(id.slice(7)) : newEntry(id, ctx.draft); if(en) ctx.draft.entries.push(en); }); changed(ctx, true); } });
      break;
    case 'ex-info': openExerciseDetail(en.exId); break;
    case 'ex-menu': exMenu(ctx, ei); break;
    case 'add-set': {
      const last = en.sets[en.sets.length-1];
      if(en.mode === 'timed') en.sets.push({ w: last ? last.w : null, r:null, t: (last && last.t) || en.iv.work, done:false });
      else en.sets.push({ w: last && last.w != null ? last.w : null, r: last && last.r != null ? last.r : null, done:false });
      changed(ctx, true);
      break;
    }
    case 'iv-cfg': {
      const k = t.dataset.k, d = +t.dataset.d;
      if(k === 'sets'){
        if(d > 0){ const last = en.sets[en.sets.length-1]; if(en.sets.length >= 20) break; en.sets.push({ w: last ? last.w : null, r:null, t:null, done:false }); }
        else {
          const i = en.sets.map(x => x.done).lastIndexOf(false);
          if(i < 0){ toast('All sets are already done'); break; }
          if(en.sets.length <= 1) break;
          en.sets.splice(i, 1);
        }
      }
      else if(k === 'work') en.iv.work = Math.max(5, Math.min(600, en.iv.work + d*5));
      else en.iv.rest = Math.max(0, Math.min(600, en.iv.rest + d*5));
      changed(ctx, true);
      break;
    }
    case 'iv-start': startIntervals(ctx, en); break;
    case 'set-menu': setMenu(ctx, ei, si); break;
    case 'use-prev': {
      const p = (lastPerf(en.exId, ctx.draft) || [])[si]; if(!p) break;
      const s = en.sets[si]; s.w = p.w; s.r = p.r;
      row.querySelector('[data-f=w]').value = fmtW(p.w);
      row.querySelector('[data-f=r]').value = p.r;
      if(s.done) refreshRowPR(ctx, en, s, row, si);
      changed(ctx);
      break;
    }
    case 'check': toggleSet(ctx, ei, si, row); break;
  }
}
function toggleSet(ctx, ei, si, row){
  const en = ctx.draft.entries[ei], s = en.sets[si];
  unlockAudio();
  if(s.done){
    s.done = false; row.classList.remove('done', 'pr');
    row.querySelector('.set-num').textContent = si + 1;
    changed(ctx, en.mode === 'timed'); return;
  }
  const ph = phFor(ctx, en, si);
  if(en.mode === 'timed'){
    if(!s.t) s.t = en.iv.work;
    if(s.w == null) s.w = ph ? ph.w || 0 : 0;
    s.done = true;
    const pr = isPR(s, bestFor(en.exId, ctx.draft));
    if(pr){ toast(`🏆 New PR — ${getEx(en.exId).name}`); haptic([30,50,30]); } else haptic(15);
    if(ctx.mode === 'active' && S.settings.autoRest && en.iv.rest > 0) startRest(en.iv.rest, getEx(en.exId).name);
    changed(ctx, true); return;

  if(s.r == null && ph) s.r = ph.r;

  }
  if(s.w == null) s.w = 0;

  row.querySelector('[data-f=w]').value = fmtW(s.w);
  row.querySelector('[data-f=r]').value = s.r;
  row.classList.add('done', 'just'); setTimeout(() => row.classList.remove('just'), 350);
  if(refreshRowPR(ctx, en, s, row, si)){ toast(`🏆 New PR — ${getEx(en.exId).name}`); haptic([30,50,30]); }
  else haptic(15);
  if(ctx.mode === 'active' && S.settings.autoRest) startRest(restFor(en.exId), getEx(en.exId).name);

}
async function exMenu(ctx, ei){

async function setMenu(ctx, ei, si){

/* =========================================================
   Guided interval timer for timed sets: get ready → work → rest → …
   Uses end timestamps, so it stays accurate if the phone sleeps briefly.
   ========================================================= */
const IV = { on:false };
const IV_C = 2*Math.PI*46;
function startIntervals(ctx, en){
  const queue = en.sets.map((s, i) => i).filter(i => !en.sets[i].done);
  if(!queue.length){ toast('All sets are already done'); return; }
  if(document.activeElement) document.activeElement.blur();
  unlockAudio(); stopRest();
  Object.assign(IV, { on:true, ctx, en, queue, qi:0, phase:'prep', dur:3, end:Date.now() + 3000, paused:false, left:0, beeped:'', repsFor:null, prDone:{} });
  let el = $('#iv');
  if(!el){ el = document.createElement('div'); el.id = 'iv'; el.setAttribute('role', 'dialog'); document.body.appendChild(el); el.addEventListener('click', ivClick); el.addEventListener('input', ivInput); }
  renderIV(); syncWakeLock();
}
const ivWork = si => IV.en.sets[si].t || IV.en.iv.work;
const ivRemaining = () => IV.paused ? IV.left : Math.max(0, IV.end - Date.now());
function ivPhase(p, dur){
  Object.assign(IV, { phase:p, dur, end:Date.now() + dur*1000, paused:false });
  if(p === 'work'){ tones([[0, 988, .12], [.15, 988, .3]]); haptic(80); }
  else if(p === 'rest'){ tones([[0, 587, .35]]); haptic([40, 40, 40]); }
  renderIV();
}
function ivAdvance(skipped){
  const en = IV.en;
  if(IV.phase === 'prep') return ivPhase('work', ivWork(IV.queue[IV.qi]));
  if(IV.phase === 'rest') return ivPhase('work', ivWork(IV.queue[IV.qi]));
  if(IV.phase !== 'work') return;
  const si = IV.queue[IV.qi], s = en.sets[si];
  s.t = skipped ? Math.max(1, Math.round(IV.dur - ivRemaining()/1000)) : IV.dur;
  if(s.w == null){ const ph = phFor(IV.ctx, en, si); s.w = ph ? ph.w || 0 : 0; }
  s.done = true; IV.repsFor = si; saveSoon();
  if(IV.qi >= IV.queue.length - 1){ IV.phase = 'done'; beep(); haptic([200, 100, 200]); renderIV(); return; }
  IV.qi++;
  if(en.iv.rest > 0) ivPhase('rest', en.iv.rest); else ivPhase('work', ivWork(IV.queue[IV.qi]));
}
function ivTick(){
  if(IV.paused || IV.phase === 'done') return;
  const ms = IV.end - Date.now();
  if(ms <= 0){ ivAdvance(false); return; }
  const secs = Math.ceil(ms/1000), key = IV.phase + IV.qi + ':' + secs;
  if(secs <= 3 && IV.beeped !== key){ IV.beeped = key; tones([[0, 660, .09]]); }
  updateIV();
}
function updateIV(){
  const el = $('#iv'); if(!el) return;
  const ms = ivRemaining(), secs = Math.ceil(ms/1000);
  const t = el.querySelector('.iv-time'); if(t) t.textContent = secs >= 60 ? fmtClock(secs) : secs;
  const a = el.querySelector('.iv-arc'); if(a) a.setAttribute('stroke-dashoffset', (IV_C * (1 - ms / (IV.dur*1000))).toFixed(1));
}
function ivRepRow(si, ask){
  const s = IV.en.sets[si], prev = lastPerf(IV.en.exId, IV.ctx.draft), p = prev && prev[si];
  return `<div class="iv-rep" data-si="${si}"><div class="l">${ask ? `Reps in set ${si+1}?` : `Set ${si+1}`}<small>${s.t}s${p && p.r ? ` · last time ${p.r}` : ''}${ask ? ' · optional' : ''}</small></div>
    <button data-iv="rep" data-d="-1" aria-label="Fewer reps">−</button><input inputmode="numeric" pattern="[0-9]*" value="${s.r || ''}" placeholder="–" aria-label="Reps in set ${si+1}"><button data-iv="rep" data-d="1" aria-label="More reps">+</button></div>`;
}
function renderIV(){
  const el = $('#iv'); if(!el) return;
  const en = IV.en, ex = getEx(en.exId), total = en.sets.length;
  if(IV.phase === 'done'){
    const run = IV.queue.map(si => en.sets[si]).filter(s => s.done);
    el.className = 'iv done';
    el.innerHTML = `<div class="iv-top"><span></span><div class="iv-title">${esc(ex.name)}</div><span></span></div>
      <div class="iv-finish"><div class="done-badge">${ic('check')}</div><h2>Nice work!</h2><div class="muted">${plural(run.length, 'set')} · ${fmtClock(run.reduce((a, s) => a + s.t, 0))} of work</div></div>
      <div class="iv-sets"><div class="small muted" style="margin:0 4px 2px">Reps per set — optional</div>${IV.queue.filter(si => en.sets[si].done).map(si => ivRepRow(si)).join('')}</div>
      <div class="iv-ctrl"><button class="pri" data-iv="close">Done</button></div>`;
    return;
  }
  const si = IV.queue[IV.qi], last = IV.qi >= IV.queue.length - 1;
  const label = { prep:'GET READY', work:'WORK', rest:'REST' }[IV.phase];
  const next = IV.phase === 'prep' ? `First up: ${fmtSecs(ivWork(si))} of work`
    : IV.phase === 'work' ? (last ? 'Last set — empty the tank!' : en.iv.rest > 0 ? `Next: ${fmtSecs(en.iv.rest)} rest` : 'Next: straight into the next set')
    : `Next: set ${si+1} · ${fmtSecs(ivWork(si))}`;
  el.className = 'iv ' + IV.phase + (IV.paused ? ' paused' : '');
  el.innerHTML = `
    <div class="iv-top"><button class="iv-x" data-iv="stop">End</button><div class="iv-title">${esc(ex.name)}</div><div class="iv-count">Set ${si+1}/${total}</div></div>
    <div class="iv-main"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="5"/><circle class="iv-arc" cx="50" cy="50" r="46" fill="none" stroke="var(--ivc)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${IV_C.toFixed(1)}" stroke-dashoffset="0"/></svg>
      <div class="iv-center"><div class="iv-phase">${IV.paused ? 'PAUSED' : label}</div><div class="iv-time num" aria-live="off"></div><div class="iv-next">${esc(next)}</div></div></div>
    <div class="iv-dots">${en.sets.map((s, i) => `<i class="${s.done ? 'on' : ''}${i === si ? ' cur' : ''}"></i>`).join('')}</div>
    ${IV.phase === 'rest' && IV.repsFor != null ? `<div class="iv-sets">${ivRepRow(IV.repsFor, true)}</div>` : ''}
    <div class="iv-ctrl"><button data-iv="pause" class="${IV.paused ? 'pri' : ''}">${ic(IV.paused ? 'play' : 'pause')} ${IV.paused ? 'Resume' : 'Pause'}</button><button data-iv="skip">${ic('skip')} Skip</button></div>`;
  updateIV();
}
function ivSetReps(si, n){
  const s = IV.en.sets[si]; s.r = n > 0 ? n : null; saveSoon();
  if(s.r && !IV.prDone[si] && isPR(s, bestFor(IV.en.exId, IV.ctx.draft))){ IV.prDone[si] = true; toast(`🏆 New PR — ${s.r} reps in ${s.t}s`); haptic([30, 50, 30]); }
}
function ivClick(e){
  const b = e.target.closest('[data-iv]'); if(!b) return;
  const k = b.dataset.iv;
  if(k === 'pause'){
    if(IV.paused){ IV.end = Date.now() + IV.left; IV.paused = false; } else { IV.left = ivRemaining(); IV.paused = true; }
    renderIV();
  }
  else if(k === 'skip') ivAdvance(true);
  else if(k === 'stop' || k === 'close') ivClose();
  else if(k === 'rep'){
    const row = b.closest('.iv-rep'), si = +row.dataset.si, s = IV.en.sets[si], d = +b.dataset.d;
    const prev = lastPerf(IV.en.exId, IV.ctx.draft), base = prev && prev[si] && prev[si].r;
    ivSetReps(si, s.r ? Math.max(0, s.r + d) : (base || (d > 0 ? 1 : 0)));
    row.querySelector('input').value = s.r || '';
  }
}
function ivInput(e){
  const row = e.target.closest('.iv-rep'); if(!row) return;
  const n = parseInt(e.target.value, 10); ivSetReps(+row.dataset.si, isNaN(n) ? 0 : n);
}
function ivClose(){
  IV.on = false;
  const el = $('#iv'); if(el) el.remove();
  saveSoon(); syncWakeLock();
  if(ui.tab === 'workout' && S.active) render();
}

/* =========================================================
   Cardio inside a workout — e.g. a Stair Master warm-up or a rower finisher.
   A block sits in the workout like an exercise. Fill in the numbers and tick it
   off, or start the optional timer. Finished blocks are saved as cardio
   activities linked to the workout (a.sess), so they count in Progress → Cardio.
   ========================================================= */
const CD_FIELDS = ['dist','h','m','s','pm','ps','spd','level','floors','incline','spm','damper'];
function newCardioEntry(type, indoor, tgt){
  return { kind:'cardio', key:uid(), type, indoor:!!(indoor && CT[type].indoor), tgt:normTgt(tgt), sets:[], done:false,
    f:Object.fromEntries(CD_FIELDS.map(k => [k, ''])), auto:[], order:[] };
}
const isCd = en => en && en.kind === 'cardio';
function cdFromPick(k){ const p = CD_PICKS.find(x => x.k === k); return p ? newCardioEntry(p.type, p.indoor, null) : null; }
/* The block's inputs as a cardio-form state, so the distance/time/pace maths is shared with Log Cardio. */
function cdState(en){ return { ...en.f, type:en.type, noH:true, auto:new Set(en.auto), order:en.order.slice() }; }
function cdWrite(en, st){ CD_FIELDS.forEach(k => { en.f[k] = st[k] == null ? '' : String(st[k]); }); en.auto = [...st.auto]; en.order = st.order.slice(); }
function cdFromActivity(a){
  const en = newCardioEntry(a.type, a.indoor, null), st = cdState(en);
  if(a.dist) cfSet(st, null, 'dist', a.dist);
  if(a.dur) cfSet(st, null, 'time', a.dur);
  if(a.dist && a.dur){ const r = cfCompute(st, 'pace'); if(r){ cfSet(st, null, 'pace', r); st.auto.add('pace'); } }
  for(const k in CX) if(a[k]) st[k] = String(a[k]);
  cdWrite(en, st);
  Object.assign(en, { done:true, aid:a.id, start:a.start, keep:{} });
  ['effort','hr','cal','elev','notes'].forEach(k => { if(a[k] != null) en.keep[k] = a[k]; });
  return en;
}
/* Most recent session on the same machine before this workout. */
function lastCardio(type, indoor, draft){
  const t = draft ? new Date(draft.start) : new Date(8.64e15);
  const l = cardioCache().sorted.filter(a => a.type === type && !!a.indoor === !!indoor && (!draft || a.sess !== draft.id) && new Date(a.start) < t);
  return l[l.length - 1] || null;
}
const cdRef = (en, draft) => en.tgt || lastCardio(en.type, en.indoor, draft);
/* Placeholder strings from the routine's target or last time. */
function cdPh(en, ref){
  const st = { type:en.type, noH:true }; CD_FIELDS.forEach(k => { st[k] = ''; });
  if(!ref) return st;
  if(ref.dist && !CT[en.type].stairs) cfSet(st, null, 'dist', ref.dist);
  if(ref.dur) cfSet(st, null, 'time', ref.dur);
  if(ref.dist && ref.dur && !CT[en.type].stairs) cfSet(st, null, 'pace', CT[en.type].speed ? ref.dist / (ref.dur / 3600) : ref.dur / ref.dist);
  ['level','incline','damper'].forEach(k => { if(ref[k]) st[k] = String(ref[k]); });
  return st;
}
/* Fills empty fields from the placeholders (like ticking a set uses Previous), then works out the missing one of distance/time/pace. */
function cdFill(en, ph){
  const st = cdState(en), groups = { dist:['dist'], time:['m','s'], pace:['pm','ps','spd'] };
  const has = () => { const v = cfRead(st); return { dist:v.km > 0, time:v.dur > 0, pace:v.rate > 0 }; };
  const need = CT[en.type].stairs ? 1 : 2;
  // Treadmills and bikes are set by pace or speed, so a shorter session means less distance; ergs are usually set by distance.
  for(const g of CT[en.type].erg ? ['time','dist','pace'] : ['time','pace','dist']){
    const h = has(); if(Object.values(h).filter(Boolean).length >= need) break;
    if(h[g] || !groups[g].some(f => ph[f])) continue;
    groups[g].forEach(f => { st[f] = ph[f]; }); st.auto.add(g);
  }
  if(!CT[en.type].stairs){
    const h = has(), miss = ['pace','dist','time'].find(g => !h[g]);
    if(miss && Object.values(h).filter(Boolean).length === 2){ const v = cfCompute(st, miss); if(v != null && isFinite(v) && v > 0){ cfSet(st, null, miss, v); st.auto.add(miss); } }
  }
  ['level','incline','damper'].forEach(k => { if(!String(st[k]).trim() && ph[k]) st[k] = ph[k]; });
  cdWrite(en, st);
}
/* The block as a cardio activity (not yet saved). */
function cdActivity(en, start){
  const st = cdState(en), v = cfRead(st), t = CT[en.type];
  let km = v.km, dur = v.dur;
  if(!dur && km && v.rate) dur = t.speed ? km / v.rate * 3600 : km * v.rate;
  if(!km && dur && v.rate) km = t.speed ? v.rate * dur / 3600 : dur / v.rate;
  const a = { ...(en.keep || {}), id:en.aid || uid(), type:en.type, start };
  if(km > 0 && !t.stairs) a.dist = Math.round(km * 1000) / 1000;
  if(dur > 0) a.dur = Math.round(dur);
  for(const k in CX){ const n = toNum(en.f[k]); if(n > 0) a[k] = n; }
  if(en.indoor) a.indoor = true;
  return a;
}
const cdValid = (en, a) => CT[en.type].stairs ? a.dur > 0 : (a.dur > 0 || a.dist > 0);
const cdHasValues = en => CD_FIELDS.some(k => String(en.f[k]).trim());
/* Seconds for the timer: what's entered, else the target or last time. */
function cdPlanned(en, draft){
  const tmp = JSON.parse(JSON.stringify(en)); cdFill(tmp, cdPh(en, cdRef(en, draft)));
  return cdActivity(tmp, '').dur || 0;
}
function cdNote(en){
  if(!(en.indoor && (en.type === 'run' || en.type === 'walk'))) return '';
  const a = cdActivity(en, ''); return a.dist > 0 && a.dur > 0 ? `≈ ${fmtSpeed(speedOf(a))} ${SU()} on the treadmill` : '';
}
/* Records this block would set, compared with every saved activity. */
function cdNewRecords(a){
  const b = cardioCache().best[a.type] || {};
  return cardioRecKinds(a).filter(([k, v, dir]) => b[k] && b[k].id !== a.id && (dir > 0 ? v > b[k].v + 1e-9 : v < b[k].v - 1e-9));
}

          <button class="btn-icon cd-btn" data-ed="cd-pause" aria-label="${c.run ? 'Pause' : 'Resume'}">${ic(c.run ? 'pause' : 'play')}</button>

  }
  return `<section class="ex-card cd${en.done && active ? ' done' : ''}" data-ei="${i}">
    <div class="ex-head"><div class="ex-name cd-name">${cico(en.type)}<span>${esc(cdLabel(en.type, en.indoor))}</span></div><button class="btn-icon" data-ed="cd-menu" aria-label="Cardio options">${ic('more')}</button></div>
    <div class="ex-sub">${sub}</div>
    <div class="cd-grid">${fields.join('')}</div>
    ${extra.length ? `<div class="cd-grid">${extra.join('')}</div>` : ''}
    <div class="cd-note small muted">${cdNote(en)}</div>
    ${foot}
  </section>`;
}
function cdInput(ctx, card, input){
  const en = ctx.draft.entries[+card.dataset.ei], k = input.dataset.cf;
  en.f[k] = input.value;
  if(CF_GROUP[k]){ const st = cdState(en); cfDerive(st, card, CF_GROUP[k]); cdWrite(en, st); }
  const n = card.querySelector('.cd-note'); if(n) n.textContent = cdNote(en);
  if(ctx.mode === 'active' && !en.done && !en.cd){ const g = card.querySelector('.cd-go'); if(g){ const s = cdPlanned(en, ctx.draft); g.innerHTML = `${ic('timer')} ${s ? fmtClock(s) + ' timer' : 'Stopwatch'}`; } }
  changed(ctx);
}
/* Ticks a block off. Returns false (and says why) if there's nothing to log. */
function cdComplete(ctx, en, quiet){
  cdFill(en, cdPh(en, cdRef(en, ctx.draft)));
  const a = cdActivity(en, new Date().toISOString());
  if(!cdValid(en, a)){ toast(CT[en.type].stairs ? 'Enter the time' : 'Enter a distance or time'); return false; }
  en.done = true; en.at = new Date().toISOString();
  const recs = ctx.mode === 'active' ? cdNewRecords(a) : [];
  if(recs.length){ toast(`🏆 New record — ${cardioRecText(recs[0][0], recs[0][1], en.type).label}`); haptic([30,50,30]); }
  else if(!quiet) haptic(15);
  return true;
}
const cdElapsed = (c, now) => c.acc + (c.run ? now - c.base : 0);
function cdStartTimer(ctx, en){
  unlockAudio(); stopRest();
  if(document.activeElement) document.activeElement.blur();
  en.cd = { total:cdPlanned(en, ctx.draft), acc:0, base:Date.now(), run:true };
  en.t0 = new Date().toISOString();
  changed(ctx, true); syncWakeLock();
}
/* Timer finished or stopped: log the time and tick the block off. */
function cdStopTimer(ctx, en, secs){
  delete en.cd;
  if(secs > 0){ const st = cdState(en); cfSet(st, null, 'time', secs); cfDerive(st, null, 'time'); cdWrite(en, st); }
  cdComplete(ctx, en, true);
  if(ctx.root && document.body.contains(ctx.root)) renderEditor(ctx);
  saveSoon(); syncWakeLock();
}
function cdTick(now){
  for(const en of S.active.entries){
    if(!isCd(en) || !en.cd) continue;
    const c = en.cd, el = cdElapsed(c, now);
    if(c.total && el >= c.total*1000){
      cdStopTimer(activeCtx && activeCtx.draft === S.active ? activeCtx : { draft:S.active, mode:'active' }, en, c.total);
      beep(); haptic([200, 100, 200]); toast(`${cdLabel(en.type, en.indoor)} done — ${fmtClock(c.total)} logged`);
      continue;
    }
    const txt = fmtClock(c.total ? Math.ceil((c.total*1000 - el)/1000) : Math.floor(el/1000));
    document.querySelectorAll(`[data-cdk="${en.key}"]`).forEach(x => { if(x.textContent !== txt) x.textContent = txt; });
    if(c.total) document.querySelectorAll(`[data-cdb="${en.key}"]`).forEach(x => { x.style.width = Math.min(100, el / (c.total*10)).toFixed(1) + '%'; });
  }
}
function cdClick(ctx, act, ei){
  const en = ctx.draft.entries[ei]; if(!isCd(en)) return;
  if(act === 'cd-check'){
    unlockAudio();
    if(en.done){ en.done = false; delete en.at; changed(ctx, true); return; }
    if(cdComplete(ctx, en)) changed(ctx, true);
    else { const card = ctx.root.querySelector(`.ex-card[data-ei="${ei}"]`); if(card){ card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); } }
  }
  else if(act === 'cd-start') cdStartTimer(ctx, en);
  else if(act === 'cd-pause'){ const c = en.cd, now = Date.now(); if(!c) return; if(c.run){ c.acc += now - c.base; c.run = false; } else { c.base = now; c.run = true; } changed(ctx, true); }
  else if(act === 'cd-stop'){ const c = en.cd; if(!c) return; const sec = Math.max(1, Math.round(cdElapsed(c, Date.now()) / 1000)); cdStopTimer(ctx, en, sec); }
  else if(act === 'cd-cancel'){ delete en.cd; delete en.t0; changed(ctx, true); syncWakeLock(); }
  else if(act === 'cd-menu') cdMenu(ctx, ei);
}
async function cdMenu(ctx, ei){
  const en = ctx.draft.entries[ei], n = ctx.draft.entries.length, actions = [];
  if(ei > 0) actions.push({ k:'up', label:'Move Up' });
  if(ei < n-1) actions.push({ k:'down', label:'Move Down' });
  if(cdHasValues(en)) actions.push({ k:'clear', label:'Clear Numbers' });
  actions.push({ k:'remove', label:'Remove Cardio', red:true });
  const k = await actionSheet({ title:cdLabel(en.type, en.indoor), actions });
  const list = ctx.draft.entries;
  if(k === 'up') [list[ei-1], list[ei]] = [list[ei], list[ei-1]];
  else if(k === 'down') [list[ei+1], list[ei]] = [list[ei], list[ei+1]];
  else if(k === 'clear'){ CD_FIELDS.forEach(f => { en.f[f] = ''; }); en.auto = []; en.order = []; en.done = false; }
  else if(k === 'remove'){
    if((en.done || cdHasValues(en)) && !(await confirmDlg(`Remove ${cdLabel(en.type, en.indoor)}?`, 'What you’ve entered for it will be removed.', 'Remove'))) return;
    list.splice(ei, 1);
  }
  else return;
  changed(ctx, true);
}
/* Finished blocks → cardio activities linked to the workout. pos = how many saved exercises come before it. */
function cdCollect(d, all, shift = 0){
  const out = []; let lifts = 0;
  for(const en of d.entries){
    if(!isCd(en)){ if(cleanEntries([en], all).length) lifts++; continue; }
    if(!all && !en.done) continue;
    const a0 = cdActivity(en, '');
    if(!cdValid(en, a0)) continue;
    const start = en.start ? new Date(+new Date(en.start) + shift).toISOString()
      : en.t0 ? en.t0 : en.at && a0.dur ? new Date(+new Date(en.at) - a0.dur*1000).toISOString() : d.start;
    const a = normCardio([{ ...a0, start, sess:d.id, pos:lifts }])[0];
    if(a) out.push(a);
  }
  return out;
}
/* A workout's exercises and cardio in the order they were done. */
function sessItems(s){
  const cs = cardioCache().bySess[s.id] || [], out = [];
  s.entries.forEach((e, i) => { cs.filter(a => a.pos === i).forEach(a => out.push({ a })); out.push({ e }); });
  cs.filter(a => a.pos >= s.entries.length).forEach(a => out.push({ a }));
  return out;
}
const sessCardioSec = id => (cardioCache().bySess[id] || []).reduce((x, a) => x + (a.dur || 0), 0);
/* Removes workouts left with no exercises and no cardio (e.g. after deleting their only cardio). */
function dropEmptySessions(){ S.sessions = S.sessions.filter(s => s.entries.length || S.cardio.some(a => a.sess === s.id)); }
const itemName = i => i.cardio ? cdLabel(i.cardio, i.indoor) : getEx(i.exId).name;
const itemEntry = (i, d) => i.cardio ? newCardioEntry(i.cardio, i.indoor, i.tgt) : i.exId ? newEntry(i.exId, d, i.sets) : null;
/* Routine target from what was done: keeps the numbers you'd want next time. */
function tgtFrom(a){ return normTgt({ dist:a.dist, dur:a.dur, level:a.level, incline:a.incline, damper:a.damper }); }

/* Sets a routine block's target (time, distance, level…), or clears it to use last time. */
function openCardioTarget(item, onSave){
  const t = CT[item.cardio], st = { type:item.cardio, noH:true, auto:new Set(), order:[] };
  CD_FIELDS.forEach(k => { st[k] = ''; });

  if(tg.dist) cfSet(st, null, 'dist', tg.dist);
  if(tg.dur) cfSet(st, null, 'time', tg.dur);
  if(tg.dist && tg.dur && !t.stairs){ const r = cfCompute(st, 'pace'); if(r){ cfSet(st, null, 'pace', r); st.auto.add('pace'); } }
  ['level','incline','damper'].forEach(k => { if(tg[k]) st[k] = String(tg[k]); });
  const inp = (f, ph, mode='numeric', label='') => `<input class="c-in w" data-f="${f}" inputmode="${mode}" autocomplete="off" value="${esc(st[f])}" placeholder="${ph}" aria-label="${label || ph}">`;
  const hms = (a, b, la, lb) => `<span class="c-hms"><input class="c-in" data-f="${a}" inputmode="numeric" autocomplete="off" value="${esc(st[a])}" placeholder="min" aria-label="${la}"><span class="c-sep">:</span><input class="c-in" data-f="${b}" inputmode="numeric" autocomplete="off" value="${esc(st[b])}" placeholder="s" aria-label="${lb}"></span>`;
  openSheet({ modal:true,
    render: () => `${sheetHead(btnClose('Cancel'), cdLabel(item.cardio, item.indoor), `<button class="text-btn bold" data-a="save">Save</button>`)}
      <div class="sheet-body">
        <div class="list">
          ${t.stairs ? '' : `<label class="row"><span class="grow">Distance</span>${t.erg ? inp('dist', '–', 'numeric', 'Distance in metres') : inp('dist', '–', 'decimal', 'Distance')}<span class="body-unit">${t.erg ? 'm' : DU()}</span></label>`}
          <div class="row"><span class="grow">Time</span>${hms('m', 's', 'Minutes', 'Seconds')}<span class="body-unit"></span></div>
          ${t.stairs ? '' : t.speed ? `<label class="row"><span class="grow">Avg. speed</span>${inp('spd', '–', 'decimal', 'Speed')}<span class="body-unit">${SU()}</span></label>`
            : `<div class="row"><span class="grow">Pace</span>${hms('pm', 'ps', 'Pace minutes', 'Pace seconds')}<span class="body-unit">${t.erg ? '/500m' : PU()}</span></div>`}
          ${t.stairs || item.indoor ? `<label class="row"><span class="grow">Level</span>${inp('level', '–', 'decimal', 'Level')}<span class="body-unit"></span></label>` : ''}
          ${isTread({ type:item.cardio, indoor:item.indoor }) ? `<label class="row"><span class="grow">Incline</span>${inp('incline', '–', 'decimal', 'Incline')}<span class="body-unit">%</span></label>` : ''}
          ${t.erg ? `<label class="row"><span class="grow">Damper</span>${inp('damper', '–', 'numeric', 'Damper')}<span class="body-unit"></span></label>` : ''}
        </div>
        <div class="caption">The target fills in this ${t.stairs ? 'machine' : 'block'} each time you start the routine. ${t.stairs ? '' : 'Fill in any two of distance, time and pace and the third is worked out. '}Leave it empty to start from what you did last time.</div>
        ${item.tgt ? `<button class="btn btn-block btn-gray" style="margin-top:16px" data-a="clear">Clear Target</button>` : ''}
      </div>`,
    mount: s => s.el.querySelectorAll('[data-f]').forEach(i => { i.oninput = () => { st[i.dataset.f] = i.value; if(CF_GROUP[i.dataset.f]) cfDerive(st, s.el, CF_GROUP[i.dataset.f]); }; }),
    actions: {
      clear: (x, e, s) => { s.close(); onSave(null); },
      save: (x, e, s) => {
        if(document.activeElement) document.activeElement.blur();
        const en = newCardioEntry(item.cardio, item.indoor, null); CD_FIELDS.forEach(k => { en.f[k] = st[k] || ''; });
        const a = cdActivity(en, '');

}

/* ---------- Edit / log past workouts ---------- */
/* Log a workout after the fact (e.g. after a class), or edit a saved one.
   Every set with values is saved as completed — no ticking, timers or rest. */
function openSessionEditor(sessId, { routineId } = {}){
  const orig = sessId ? S.sessions.find(x => x.id === sessId) : null;
  const origDur = orig && sessDur(orig);
  const start = new Date(Date.now() - 45*60000); start.setSeconds(0, 0); start.setMinutes(Math.floor(start.getMinutes() / 5) * 5);
  const routine = !orig && routineId ? S.routines.find(x => x.id === routineId) : null;
  const draft = orig
    ? { id:orig.id, name:orig.name, start:orig.start, durMin: origDur ? Math.round(origDur / 60000) : null, notes:orig.notes || '', routineId:orig.routineId, entries: sessItems(orig).map(({ a, e }) => {
        if(a) return cdFromActivity(a);
        const o = { exId:e.exId, name:e.name, cat:e.cat, sets:e.sets.map(s => ({ w:s.w, r:s.r, t:s.t || null, done:true })) };
        const ts = e.sets.find(s => s.t); if(ts){ o.mode = 'timed'; o.iv = { work:ts.t, rest:exIv(getEx(e.exId)).rest }; }
        return o;
      }) }
    : { id:uid(), name: routine ? routine.name : defaultName(start), start:start.toISOString(), durMin:45, notes:'', routineId: routine ? routine.id : null, entries:[] };
  if(routine) draft.entries = routine.items.map(i => itemEntry(i, draft)).filter(Boolean);
  const ctx = { draft, mode:'edit', hint: orig ? '' : `Set when you trained and for how long, then add what you did. Every set you fill in is saved as completed. Tap a <b>Previous</b> value to copy it, or use an exercise’s ⋯ menu to fill all its sets from last time.` };
  const sh = openSheet({ full:true, modal:true,
    render: () => `${sheetHead(btnClose('Cancel'), orig ? 'Edit Workout' : 'Log Finished Workout', `<button class="text-btn bold" data-a="save">Save</button>`)}<div class="sheet-body"><div class="ed-host"></div>${orig ? `<button class="btn btn-block btn-danger" style="margin-top:20px" data-a="del">Delete Workout</button>` : ''}</div>`,
    mount: s => mountEditor(s.el.querySelector('.ed-host'), ctx),
    actions: {
      save: () => {
        const entries = cleanEntries(draft.entries.filter(en => !isCd(en)), true);
        const cardio = cdCollect(draft, true, orig ? +new Date(draft.start) - +new Date(orig.start) : 0);
        if(!entries.length && !cardio.length){ toast('Add at least one set or some cardio'); return; }
        const name = (draft.name || '').trim() || 'Workout';
        const end = draft.durMin > 0 ? new Date(new Date(draft.start).getTime() + draft.durMin*60000).toISOString() : null;
        if(new Date(draft.start) > new Date(Date.now() + 5*60000)){ toast('The start time is in the future'); return; }
        if(orig){
          Object.assign(orig, { name, start:draft.start, end, legacy: end ? false : orig.legacy, notes:(draft.notes||'').trim(), entries });
          S.cardio = S.cardio.filter(a => a.sess !== orig.id).concat(cardio);
          save(); sh.close(); refresh(); toast('Workout saved');
        } else {
          const sess = { id:draft.id, name, start:draft.start, end, legacy:false, routineId:draft.routineId || null, notes:(draft.notes||'').trim(), entries };
          S.sessions.push(sess); S.cardio.push(...cardio);
          save(); sh.close(); refresh(); showSummary(sess);
        }
      },
      del: () => deleteSession(orig.id, sh)
    }
  });
}
async function logFinished(){
  if(!S.routines.length) return openSessionEditor(null);
  const k = await actionSheet({ title:'Log a finished workout', actions:[{ k:'__empty', label:'Empty Workout', bold:true }, ...S.routines.map(r => ({ k:r.id, label:r.name }))] });
  if(k) openSessionEditor(null, k === '__empty' ? {} : { routineId:k });
}
async function deleteSession(id, sheet){
  const nc = S.cardio.filter(a => a.sess === id).length;
  if(!(await confirmDlg('Delete this workout?', `It will be permanently removed from your history and stats${nc ? ', along with its cardio' : ''}.`))) return;
  S.sessions = S.sessions.filter(x => x.id !== id);
  S.cardio = S.cardio.filter(a => a.sess !== id);
  save(); closeAllSheets(); refresh(); toast('Workout deleted');
}

      rest: async (t, e, s) => { const r = await chooseRest('Rest between sets', true); if(r == null) return; f.rest = r === 'default' ? null : r; s.rerender(); },
      mode: (t, e, s) => { f.mode = t.dataset.v; s.rerender(); },
      ivs: (t, e, s) => {
        const k = t.dataset.k, d = +t.dataset.d;
        if(k === 'sets') f.iv.sets = Math.max(1, Math.min(20, f.iv.sets + d));
        else if(k === 'work') f.iv.work = Math.max(5, Math.min(600, f.iv.work + d*5));
        else f.iv.rest = Math.max(0, Math.min(600, f.iv.rest + d*5));
        s.rerender();
      },
      save: (t, e, s) => {
        const n = f.name.trim();
        if(!n){ toast('Give the exercise a name'); return; }
        if(S.exercises.some(x => x !== ex && x.name.toLowerCase() === n.toLowerCase())){ toast('You already have an exercise with that name'); return; }
        let obj;
        if(isNew){ obj = { id:uid(), name:n, cat:f.cat }; if(f.rest) obj.rest = f.rest; S.exercises.push(obj); }
        else {
          obj = ex; obj.name = n; obj.cat = f.cat;
          if(f.rest) obj.rest = f.rest; else delete obj.rest;
          S.sessions.forEach(ss => ss.entries.forEach(en => { if(en.exId === ex.id){ en.name = n; en.cat = f.cat; } }));
          if(S.active) S.active.entries.forEach(en => { if(en.exId === ex.id){ en.name = n; en.cat = f.cat; } });
        }
        if(f.mode === 'timed'){ obj.mode = 'timed'; obj.iv = { ...f.iv }; } else delete obj.mode;
        save(); s.close(); refresh();
        toast(isNew ? `Added ${n}` : 'Exercise updated');
        if(onSave) onSave(obj);
      },
      del: async (t, e, s) => {
        if(!(await confirmDlg(`Delete ${ex.name}?`, 'It’s removed from your library and routines. Past workouts keep their history.'))) return;
        S.exercises = S.exercises.filter(x => x.id !== ex.id);
        S.routines.forEach(r => { r.items = r.items.filter(i => i.exId !== ex.id); });
        save(); s.close(); refresh(); toast('Exercise deleted');
      }
    }
  });
}

function exSeries(id){
  return (cache().byEx[id] || []).map(({ s, e }) => {
    const b = entryBest(e.sets), rs = e.sets.filter(x => !x.t), ts = e.sets.filter(x => x.t);
    return { x:+new Date(s.start), id:s.id, e1:b.e, top:b.w, topR:b.wr, vol:e.sets.reduce((a,x) => a + x.w*x.r, 0), reps:b.r, treps:rs.reduce((a,x) => a + x.r, 0),
      hasReps:rs.length > 0, timed:ts.length > 0, tb:b.tb ? b.tb.r : 0, tbT:b.tb ? b.tb.t : 0, ttot:ts.reduce((a,x) => a + x.r, 0), time:ts.reduce((a,x) => a + x.t, 0), hold:b.hold,
      sets:e.sets, start:s.start };
  });
}
/* Picks which stats/metrics an exercise's detail view shows. */
function exView(id){
  const ex = getEx(id), ser = exSeries(id);
  const hasTimed = ser.some(p => p.timed), hasReps = ser.some(p => p.hasReps);
  const timed = hasTimed && (!hasReps || isTimedEx(ex));
  const tReps = ser.some(p => p.tb > 0);
  const bw = !timed && ser.length > 0 && ser.every(p => p.top === 0);
  const metrics = timed ? (tReps ? [['tb','Best set'], ['ttot','Total reps'], ['time','Work time']] : [['hold','Longest hold'], ['time','Work time']])
    : bw ? [['reps','Most reps'], ['treps','Total reps']] : [['e1','Est. 1RM'], ['top','Heaviest'], ['vol','Volume']];
  if(!metrics.some(m => m[0] === ui.exMetric)) ui.exMetric = metrics[0][0];
  return { ex, ser, timed, tReps, bw, metrics };
}
function openExerciseDetail(id){
  openSheet({ live:true, full:true,
    render: () => {
      const { ex, ser, timed, tReps, bw, metrics } = exView(id), b = cache().best[id];
      const last = ser[ser.length-1];
      let body;
      if(!ser.length) body = emptyHTML('chart', 'No history yet', 'Log this exercise in a workout and your progress will show up here.');
      else {
        const bestVol = ser.reduce((m, p) => p.vol > m.vol ? p : m, ser[0]);
        const tTime = ser.reduce((a,p) => a + p.time, 0);
        body = timed ? `<div class="tiles">
            ${tReps ? tile('Best set', b.tb.r + '<small>reps</small>', `in ${fmtSecs(b.tb.t)}`) : tile('Longest hold', fmtSecs(b.hold), 'in one set')}
            ${tile('Workouts', ser.length, 'last ' + relPhrase(last.start))}
            ${tile('Work time', tTime < 3600 ? fmtClock(tTime) : fmtDurShort(tTime*1000), 'all time')}
            ${tReps ? tile('Total reps', ser.reduce((a,p) => a + p.ttot, 0).toLocaleString(), 'all time') : tile('Sets', ser.reduce((a,p) => a + p.sets.length, 0), 'all time')}
          </div>` : `<div class="tiles">
            ${bw ? tile('Most reps', b.r, 'in one set') : tile('Heaviest', fmtW(b.w) + `<small>${U()}</small>`, `× ${plural(b.wr,'rep')}`)}
            ${bw ? tile('Total reps', ser.reduce((a,p) => a + p.treps, 0).toLocaleString(), 'all time') : tile('Est. 1RM', fmtW1(b.e) + `<small>${U()}</small>`, `from ${fmtW(b.eW)} × ${b.eR}`)}
            ${tile('Workouts', ser.length, 'last ' + relPhrase(last.start))}
            ${bw ? tile('Sets', ser.reduce((a,p) => a + p.sets.length, 0), 'all time') : tile('Best volume', fmtCompact(bestVol.vol) + `<small>${U()}</small>`, relDay(bestVol.start))}
          </div>`;
        body += `<div class="card" style="margin-top:12px">
            <div class="seg" style="margin-bottom:14px">${metrics.map(([k, l]) => `<button data-a="metric" data-v="${k}" class="${ui.exMetric === k ? 'on' : ''}">${l}</button>`).join('')}</div>
            <div class="chart" id="ex-chart"></div>
            <div class="small faint" style="margin-top:6px">Each point is one workout. Tap or drag to inspect.</div>
          </div>
          <div class="group-h">Recent workouts</div>
          <div class="list">${ser.slice(-15).reverse().map(p => `<button class="row tap" data-a="sess" data-id="${esc(p.id)}"><div class="grow"><div class="title" style="font-size:15px;font-weight:600">${new Date(p.start).toLocaleDateString(undefined, { weekday:'short', day:'numeric', month:'short', year:'numeric' })}</div><div class="sub wrap num">${p.sets.map(x => setStr(x)).join(' · ')}</div></div>${chev()}</button>`).join('')}</div>`;
      }
      return `${sheetHead(btnClose(), '', ex.deleted ? '' : `<button class="text-btn" data-a="edit">Edit</button>`)}
        <div class="sheet-body">
          <h2 class="sheet-h1">${esc(ex.name)}</h2>
          <div class="meta-row"><span class="tag">${esc(ex.cat)}</span>${ex.deleted ? '<span class="small muted">Removed from library</span>' : isTimedEx(ex) ? `<span class="small muted">${ic('timer')} ${fmtSecs(exIv(ex).work)} on · ${fmtSecs(exIv(ex).rest)} off · ${plural(exIv(ex).sets, 'set')}</span>` : `<span class="small muted">${ic('timer')} Rest ${fmtClock(restFor(id))}</span>`}</div>
          ${body}
        </div>`;
    },
    mount: s => {
      const el = s.el.querySelector('#ex-chart'); if(!el) return;
      const { ser } = exView(id), m = ui.exMetric;
      const isW = m === 'e1' || m === 'top' || m === 'vol', isT = m === 'time' || m === 'hold', timedM = isT || m === 'tb' || m === 'ttot';
      const pts = ser.filter(p => timedM ? p.timed : p.hasReps);
      lineChart(el, pts.map(p => ({ x:p.x, y: isW ? toDisp(p[m]) : p[m], sub: m === 'top' ? `× ${p.topR} reps` : m === 'tb' ? `in ${p.tbT}s` : '' })), {
        fmt: v => isW ? (m === 'vol' ? Math.round(v).toLocaleString() : fmtNum(v, 1)) + ' ' + U() : isT ? fmtSecs(Math.round(v)) : Math.round(v) + ' reps'
      });
    },
    actions: {
      metric: (t, e, s) => { ui.exMetric = t.dataset.v; s.rerender(); },
      edit: () => openExerciseForm(getEx(id)),
      sess: t => openSession(t.dataset.id)
    }
  });
}

async function routineMenu(id){
  const r = S.routines.find(x => x.id === id); if(!r) return;
  const k = await actionSheet({ title:r.name, actions:[{ k:'start', label:'Start Workout', bold:true }, { k:'log', label:'Log as Finished Workout' }, { k:'edit', label:'Edit Routine' }, { k:'dup', label:'Duplicate' }, { k:'del', label:'Delete Routine', red:true }] });
  if(k === 'start') startRoutine(id);

  else if(k === 'dup'){ S.routines.splice(S.routines.indexOf(r)+1, 0, { id:uid(), name:r.name + ' (copy)', items:JSON.parse(JSON.stringify(r.items)) }); save(); refresh(); }
  else if(k === 'del'){
    if(!(await confirmDlg(`Delete “${r.name}”?`, 'Workouts you’ve already logged from it are kept.'))) return;

  }
}

/* History card: the exercise list stays folded until it's opened (5.0). The card is a div holding two
   buttons, so the toggle isn't nested inside the open-workout button. Open cards are kept in
   ui.histOpen, so a re-render doesn't fold them again. */
function sessExLine({ a, e }){

}
function sessCard(s, prs){
  const d = new Date(s.start), dur = sessDur(s), items = sessItems(s), nSets = sessSets(s), open = ui.histOpen.has(s.id);
  const nEx = items.filter(x => !x.a).length, nCd = items.length - nEx;
  const label = [nEx ? plural(nEx, 'exercise') : '', nCd ? `${nCd} cardio` : ''].filter(Boolean).join(' + ');
  return `<div class="sess sess-fold${open ? ' open' : ''}">

      <span class="sess-stats">${dur ? `<span>${ic('clock')}${fmtDurShort(dur)}</span>` : ''}${nSets ? `<span>${ic('check')}${plural(nSets,'set')}</span>` : ''}${prs ? `<span class="badge">${ic('trophy')}${plural(prs.length,'PR')}</span>` : ''}</span>
    </button>
    ${items.length ? `<button class="sess-more" data-a="sess-fold" data-id="${esc(s.id)}" aria-expanded="${open}" aria-controls="sx-${esc(s.id)}"><span>${label}</span>${ic('chevR')}</button>
    <div class="sess-ex" id="sx-${esc(s.id)}"${open ? '' : ' hidden'}>${items.map(sessExLine).join('')}</div>` : ''}
  </div>`;
}
function renderHistory(){
  const v = $('#v-history');
  // Cardio done inside a workout shows on that workout's card, not twice.
  const list = [...S.sessions.map(x => ({ x, c:false })), ...S.cardio.filter(a => !inWorkout(a)).map(x => ({ x, c:true }))].sort((a,b) => new Date(b.x.start) - new Date(a.x.start));
  let html = `<div class="topbar"><span></span><button class="btn-icon" data-a="hist-add" aria-label="Log a finished workout or cardio">${ic('plus')}</button></div><h1 class="large-title">History</h1>`;
  if(!list.length){ v.innerHTML = html + emptyHTML('clock', 'No workouts yet', 'Finished workouts and cardio show up here. Use + to log something you’ve already done.'); return; }
  const monthKey = d => d.toLocaleDateString(undefined, { month:'long', year:'numeric' });
  const counts = {}; list.forEach(({ x, c }) => { const k = monthKey(new Date(x.start)); const n = counts[k] = counts[k] || { w:0, c:0 }; n[c ? 'c' : 'w']++; });
  const countText = n => [n.w ? plural(n.w,'workout') : '', n.c ? `${n.c} cardio` : ''].filter(Boolean).join(' · ');
  const prs = cache().prs, cprs = cardioCache().prs; let cur = '';
  for(const { x, c } of list.slice(0, ui.histLimit)){
    const m = monthKey(new Date(x.start));
    if(m !== cur){ cur = m; html += `<div class="month-h"><span>${m}</span><span>${countText(counts[m])}</span></div>`; }
    html += c ? cardioCard(x, cprs[x.id]) : sessCard(x, prs[x.id]);
  }
  if(list.length > ui.histLimit) html += `<button class="btn btn-block btn-gray" style="margin-top:16px" data-a="hist-more">Show older</button>`;
  v.innerHTML = html;
}

function daySessions(){ const m = {}; S.sessions.forEach(s => { const k = dayKey(new Date(s.start)); (m[k] = m[k] || []).push(s); }); return m; }
function calendarHTML(){
  const m = ui.calMonth, y = m.getFullYear(), mo = m.getMonth(), now = new Date();
  const lead = (new Date(y, mo, 1).getDay() + 6) % 7, days = new Date(y, mo+1, 0).getDate();
  const map = daySessions(), today = dayKey(now);
  let cells = '', count = 0;
  for(let i = 0; i < lead; i++) cells += '<span></span>';
  for(let d = 1; d <= days; d++){

const WK_COLORS = { get lift(){ return ACCENT; }, cardio:'#66d4cf' };  // accent + teal
/* ---------- Charts (inline SVG, single hue, hover/tap tooltips) ---------- */
function niceScale(min, max, n=4){
  if(min === max){ min = Math.max(0, min - 1); max = max + 1; }
  const step0 = (max - min) / (n - 1), mag = 10 ** Math.floor(Math.log10(step0)), norm = step0 / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, ticks = [];
  for(let v = lo; v <= hi + step*1e-6; v += step) ticks.push(Math.round(v * 1e6) / 1e6);
  return [lo, hi, ticks];
}
const fmtAxis = v => v >= 1000 ? fmtNum(v/1000, v >= 100000 ? 0 : 1) + 'k' : fmtNum(v, 1);
const shortDate = x => new Date(x).toLocaleDateString(undefined, { day:'numeric', month:'short' });
function lineChart(el, pts, { fmt, ring = 'var(--card-2)', color = ACCENT, axis = fmtAxis, invert = false }){
  if(!pts.length){ el.innerHTML = '<div class="chart-empty">No data yet</div>'; return; }
  const W = el.clientWidth || 320, H = el.clientHeight || 190;
  const L = 6, R = 46, T = 30, B = 22;
  let x0 = Math.min(...pts.map(p => p.x)), x1 = Math.max(...pts.map(p => p.x));
  if(x1 === x0){ x0 -= 864e5; x1 += 864e5; }
  const [y0, y1, ticks] = niceScale(Math.min(...pts.map(p => p.y)), Math.max(...pts.map(p => p.y)));
  const X = x => L + (x - x0) / (x1 - x0) * (W - L - R);
  const Y = y => T + (invert ? y - y0 : y1 - y) / ((y1 - y0) || 1) * (H - T - B);
  const gid = 'lg' + uid();
  const line = pts.map((p, i) => (i ? 'L' : 'M') + X(p.x).toFixed(1) + ',' + Y(p.y).toFixed(1)).join('');
  const area = pts.length > 1 ? `${line}L${X(pts[pts.length-1].x).toFixed(1)},${H-B}L${X(pts[0].x).toFixed(1)},${H-B}Z` : '';
  const last = pts[pts.length-1];
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend chart">
    <defs><linearGradient id="${gid}" x1="0" x2="0" y1="${invert ? 1 : 0}" y2="${invert ? 0 : 1}"><stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(t => `<line x1="${L}" x2="${W-R+6}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="rgba(255,255,255,.08)"/><text class="ax" x="${W-R+10}" y="${(Y(t)+4).toFixed(1)}">${axis(t)}</text>`).join('')}
    <text class="ax" x="${L}" y="${H-5}">${shortDate(pts[0].x)}</text>
    ${pts.length > 1 ? `<text class="ax" x="${W-R}" y="${H-5}" text-anchor="end">${shortDate(last.x)}</text>` : ''}
    ${area ? `<path d="${area}" fill="url(#${gid})"/>` : ''}
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.length <= 40 ? pts.map(p => `<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.5" fill="${color}" stroke="${ring}" stroke-width="2"/>`).join('') : ''}
    <circle cx="${X(last.x).toFixed(1)}" cy="${Y(last.y).toFixed(1)}" r="5" fill="${color}" stroke="${ring}" stroke-width="2"/>
    <g class="hover" style="display:none"><line y1="${T-6}" y2="${H-B}" stroke="rgba(255,255,255,.35)" stroke-dasharray="3 3"/><circle r="6" fill="${color}" stroke="#fff" stroke-width="2"/></g>
  </svg><div class="tip"></div>`;
  const g = el.querySelector('.hover'), tip = el.querySelector('.tip');
  const show = cx => {
    let best = pts[0], bd = Infinity;
    for(const p of pts){ const d = Math.abs(X(p.x) - cx); if(d < bd){ bd = d; best = p; } }
    const px = X(best.x), py = Y(best.y);
    g.style.display = ''; g.querySelector('line').setAttribute('x1', px); g.querySelector('line').setAttribute('x2', px);

    tip.innerHTML = `<b>${esc(fmt(best.y))}</b>${shortDate(best.x)}${best.sub ? ' · ' + esc(best.sub) : ''}`;

  };
  const hide = () => { g.style.display = 'none'; tip.classList.remove('show'); };
  el.onpointermove = el.onpointerdown = e => show(e.clientX - el.getBoundingClientRect().left);
  el.onpointerleave = hide;
}
function barChart(el, bars, { fmt, aria = 'Weekly volume bar chart', color = ACCENT }){
  const W = el.clientWidth || 320, H = el.clientHeight || 190;
  const L = 2, R = 44, T = 30, B = 22;
  const [, y1, ticks] = niceScale(0, Math.max(1, ...bars.map(b => b.value)));
  const n = bars.length, bw = (W - L - R) / n, w = Math.max(4, bw - 6);
  const Y = v => T + (1 - v / y1) * (H - T - B);

  const barPath = (x, y, b = base) => { const h = b - y, r = Math.min(4, h, w/2); return `M${x},${b}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${b}Z`; };
  /* Stacked bars: segments bottom-up with a 2px gap; only the top one is rounded. */
  const barSVG = (b, x) => {
    const parts = (b.parts || [{ v:b.value, c:color }]).filter(p => p.v > 0); let acc = 0;
    return parts.map((p, j) => {
      const yb = j ? Y(acc) - 2 : base, yt = Y(acc += p.v);
      if(yb - yt < .5) return '';
      return j === parts.length - 1 ? `<path d="${barPath(x, yt, yb)}" fill="${p.c}"/>` : `<rect x="${x}" y="${yt.toFixed(1)}" width="${w}" height="${(yb - yt).toFixed(1)}" fill="${p.c}"/>`;
    }).join('');
  };
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">
    ${ticks.map(t => `<line x1="${L}" x2="${W-R+6}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="rgba(255,255,255,${t === 0 ? .2 : .08})"/><text class="ax" x="${W-R+10}" y="${(Y(t)+4).toFixed(1)}">${fmtAxis(t)}</text>`).join('')}
    ${bars.map((b, i) => { const x = L + i*bw + (bw - w)/2; return (b.value > 0 ? `<g fill-opacity="${i === n-1 ? 1 : .55}" data-i="${i}">${barSVG(b, x)}</g>` : '') + ((i % 3 === 2 || i === n-1) && (i === n-1 || i < n-2) ? `<text class="ax" x="${(x + w/2).toFixed(1)}" y="${H-5}" text-anchor="middle">${esc(b.label)}</text>` : ''); }).join('')}
  </svg><div class="tip"></div>`;
  const tip = el.querySelector('.tip'), paths = el.querySelectorAll('[data-i]');
  const show = cx => {
    const i = Math.max(0, Math.min(n-1, Math.floor((cx - L) / bw))), b = bars[i];
    paths.forEach(p => p.setAttribute('fill-opacity', +p.dataset.i === i ? 1 : .35));
    const parts = (b.parts || []).filter(p => p.v > 0);
    tip.innerHTML = `<b>${esc(fmt(b.value))}</b>${esc(b.tip)}${parts.length > 1 ? parts.map(p => `<span class="tp"><i style="background:${p.c}"></i>${esc(p.label)} ${esc(fmt(p.v))}</span>`).join('') : ''}`;
    tip.style.left = Math.min(W - 60, Math.max(60, L + i*bw + bw/2)) + 'px'; tip.classList.add('show');
  };
  const hide = () => { tip.classList.remove('show'); paths.forEach(p => p.setAttribute('fill-opacity', +p.dataset.i === n-1 ? 1 : .55)); };
  el.onpointermove = el.onpointerdown = e => show(e.clientX - el.getBoundingClientRect().left);
  el.onpointerleave = hide;
}

function metricChange(ser){

}

const MI = 1.609344;

  hike: { label:'Hike', pick:'Hike',  noun:'hike', ing:'hiking',  icon:'hike', c:'#d4a373', indoor:'' },
  cycle:{ label:'Ride', pick:'Cycle', noun:'ride', ing:'cycling', icon:'bike', c:'#ff6482', indoor:'Indoor / trainer', speed:true },
  /* Gym machines. Rower and ski erg distances are in metres with pace per 500 m, like their monitors. */
  row:  { label:'Row', pick:'Row', noun:'row', ing:'rowing', icon:'row', c:'#bf5af2', indoor:'', erg:true, machine:'Rower' },
  ski:  { label:'Ski Erg', pick:'Ski Erg', noun:'ski erg session', ing:'on the ski erg', icon:'ski', c:'#ffd60a', indoor:'', erg:true, machine:'Ski Erg' },
  stairs:{ label:'Stair Master', pick:'Stairs', noun:'climb', ing:'climbing', icon:'stairs', c:'#ff9f0a', indoor:'', stairs:true, machine:'Stair Master' }

/* Stack order for the weekly chart: keeps the pairs that are hardest to tell apart with colour blindness from touching.
   The Stair Master has no distance, so it never stacks. */
const STACK = ['run','hike','walk','cycle','ski','row'];
/* What a block in a workout is called: "Treadmill Run", "Bike", "Rower"… */
const cdLabel = (type, indoor) => CT[type].machine || (indoor && CT[type].indoor ? (type === 'cycle' ? 'Bike' : 'Treadmill ' + CT[type].label) : CT[type].label);
const CD_PICKS = [{ k:'run-in', type:'run', indoor:true }, { k:'walk-in', type:'walk', indoor:true }, { k:'stairs', type:'stairs' }, { k:'row', type:'row' },
  { k:'ski', type:'ski' }, { k:'cycle-in', type:'cycle', indoor:true }, { k:'run', type:'run' }];
/* Extra machine readings: [min, max, decimals, label]. */
const CX = { level:[0.5, 30, 1, 'level'], floors:[1, 5000, 0, 'floors'], incline:[0, 30, 1, 'incline'], spm:[5, 80, 0, 'stroke rate'], damper:[1, 10, 0, 'damper'] };
const fmtM = km => Math.round(km * 1000).toLocaleString() + ' m';
const cdDistParts = (type, km) => CT[type].erg ? { v:Math.round(km * 1000).toLocaleString(), u:'m' } : { v:fmtDist(km), u:DU() };
const cdDist = (type, km) => { const d = cdDistParts(type, km); return d.v + ' ' + d.u; };
const p500 = a => a.dist > 0 && a.dur > 0 ? a.dur / (a.dist * 2) : null;           // sec per 500 m
const rateLabel = type => CT[type].speed ? 'Avg. speed' : CT[type].stairs ? 'Level' : 'Pace';
const isTread = a => a.indoor && (a.type === 'run' || a.type === 'walk');
/* Cardio logged inside a workout that still exists. */
const inWorkout = a => !!(a.sess && S.sessions.some(s => s.id === a.sess));
function normTgt(t){
  if(!t || typeof t !== 'object') return null;
  const o = {};
  if(+t.dist > 0 && +t.dist <= 2000) o.dist = +t.dist;
  if(+t.dur > 0 && +t.dur <= 172800) o.dur = Math.round(+t.dur);
  ['level','incline','damper'].forEach(k => { const v = +t[k], [lo, hi] = CX[k]; if(v >= lo && v <= hi) o[k] = v; });
  return Object.keys(o).length ? o : null;
}
/* Short summary like "2.00 km · 10:30 · 5:15 /km" or "10:00 · L12 · 64 floors". */
function cdSummary(a, type = a.type){
  const t = CT[type], bits = [];
  if(a.dist > 0) bits.push(cdDist(type, a.dist));
  if(a.dur > 0) bits.push(fmtHMS(a.dur));
  if(t.stairs){ if(a.level) bits.push('L' + fmtNum(a.level, 1)); if(a.floors) bits.push(plural(a.floors, 'floor')); }
  else { const rp = a.dist > 0 && a.dur > 0 ? rateParts({ ...a, type }) : null; if(rp) bits.push(rp.v + ' ' + rp.u); if(a.level) bits.push('L' + fmtNum(a.level, 1)); }

const EFFORT = [null, { label:'Easy', c:'#30d158' }, { label:'Moderate', c:'#ffd60a' }, { label:'Hard', c:'#ff9f0a' }, { label:'Max', c:'#ff453a' }];
const soft = (hex, a=.18) => `rgba(${[1,3,5].map(i => parseInt(hex.slice(i, i+2), 16)).join(',')},${a})`;
const DU = () => S.settings.distUnit || (U() === 'lb' ? 'mi' : 'km');
const toDist = km => DU() === 'mi' ? km / MI : km;
const fromDist = v => DU() === 'mi' ? v * MI : v;
const fmtDist = km => fmtNum(toDist(km), toDist(km) >= 100 ? 1 : 2);
const EU = () => DU() === 'mi' ? 'ft' : 'm';
const toElev = m => DU() === 'mi' ? m / 0.3048 : m;
const fromElev = v => DU() === 'mi' ? v * 0.3048 : v;
const PU = () => '/' + DU();
const SU = () => DU() === 'mi' ? 'mph' : 'km/h';
const paceOf = a => a.dist > 0 && a.dur > 0 ? a.dur / a.dist : null;            // sec per km
const speedOf = a => a.dist > 0 && a.dur > 0 ? a.dist / (a.dur / 3600) : null;   // km/h
const fmtPace = spk => fmtClock(spk * (DU() === 'mi' ? MI : 1));
const fmtSpeed = kmh => fmtNum(toDist(kmh), 1);
const fmtHMS = sec => fmtDur(sec * 1000);
function rateParts(a){
  if(CT[a.type].stairs) return a.level ? { v:fmtNum(a.level, 1), u:'level' } : null;
  if(CT[a.type].erg){ const p = p500(a); return p ? { v:fmtClock(p), u:'/500m' } : null; }
  if(CT[a.type].speed){ const v = speedOf(a); return v ? { v:fmtSpeed(v), u:SU() } : null; }
