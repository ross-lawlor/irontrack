}
function partOfDay(d){ const h = d.getHours(); return h<5?'Night':h<12?'Morning':h<17?'Afternoon':h<21?'Evening':'Night'; }
const cardioName = a => a.sess ? cdLabel(a.type, a.indoor) : `${partOfDay(new Date(a.start))} ${CT[a.type].label}`;
const actWord = n => n === 1 ? '1 activity' : `${n} activities`;
const cico = (type, cls='') => `<span class="cico ${cls}">${ic(CT[type].icon)}</span>`;
const effChip = k => EFFORT[k] ? `<span class="eff" style="--c:${EFFORT[k].c};--cs:${soft(EFFORT[k].c, .16)}"><span class="lv">${[1,2,3,4].map(i => `<i class="${i <= k ? 'on' : ''}"></i>`).join('')}</span>${EFFORT[k].label}</span>` : '';

function normCardio(list){
  const num = (v, lo, hi) => { v = +v; return v > lo && v <= hi ? v : null; };
  return (Array.isArray(list) ? list : []).filter(a => a && a.id && a.start && CT[a.type] && !isNaN(new Date(a.start))).map(a => {
    const o = { id:String(a.id), type:a.type, start:a.start };
    const dist = num(a.dist, 0, 2000), dur = num(a.dur, 0, 172800), hr = num(a.hr, 0, 260), elev = num(a.elev, 0, 15000), cal = num(a.cal, 0, 30000);
    if(dist) o.dist = dist; if(dur) o.dur = Math.round(dur);
    if([1,2,3,4].includes(+a.effort)) o.effort = +a.effort;
    if(hr) o.hr = Math.round(hr); if(elev) o.elev = Math.round(elev); if(cal) o.cal = Math.round(cal);
    if(a.indoor && CT[a.type].indoor) o.indoor = true;
    for(const k in CX){ const [lo, hi, dp] = CX[k], v = +a[k]; if(v >= lo && v <= hi) o[k] = Math.round(v * 10**dp) / 10**dp; }
    if(CT[a.type].stairs) delete o.dist;
    if(a.notes) o.notes = String(a.notes);
    if(a.sess){ o.sess = String(a.sess); o.pos = Math.max(0, Math.round(+a.pos) || 0); }
    return o;
  }).filter(a => a.dist || a.dur);
}

/* Records per type. Treadmill/indoor sessions count toward distance but not pace or speed. */
function cardioRecKinds(a){
  const out = [], fair = !a.indoor, t = CT[a.type];
  if(t.stairs){
    if(a.dur > 0) out.push(['dur', a.dur, 1]);
    if(a.floors > 0) out.push(['floors', a.floors, 1]);
    return out;
  }
  if(a.dist > 0) out.push(['dist', a.dist, 1]);
  if(t.erg){
    if(a.dist >= 0.1 && a.dur > 0) out.push(['p500', p500(a), -1]);
    const k = a.type === 'row' ? 2 : 1;
    if(a.dist >= k && a.dur > 0) out.push([a.type === 'row' ? 'k2' : 'k1', a.dur * k / a.dist, -1]);
    return out;
  }
  if(fair && a.dist >= 1 && a.dur > 0 && a.type !== 'hike') out.push(t.speed ? ['speed', speedOf(a), 1] : ['pace', paceOf(a), -1]);
  if(a.type === 'run' && fair && a.dur > 0){
    if(a.dist >= 5) out.push(['k5', a.dur * 5 / a.dist, -1]);
    if(a.dist >= 10) out.push(['k10', a.dur * 10 / a.dist, -1]);
  }
  if(a.type === 'hike' && a.elev > 0) out.push(['elev', a.elev, 1]);
  return out;
}
function cardioCache(){
  const c = cache(); if(c.cardio) return c.cardio;
  const sorted = S.cardio.slice().sort((a, b) => new Date(a.start) - new Date(b.start));
  const prs = {}, best = {}, bySess = {};
  for(const a of sorted){
    if(a.sess) (bySess[a.sess] = bySess[a.sess] || []).push(a);
    const b = best[a.type] = best[a.type] || {}, list = [];
    for(const [kind, v, dir] of cardioRecKinds(a)){
      const cur = b[kind], better = !cur || (dir > 0 ? v > cur.v + 1e-9 : v < cur.v - 1e-9);
      if(cur && better) list.push({ kind, v });
      if(better) b[kind] = { v, id:a.id };
    }
    if(list.length) prs[a.id] = list;
  }
  for(const k in bySess) bySess[k].sort((a, b) => a.pos - b.pos);
  return (c.cardio = { sorted, prs, best, bySess });
}

/* ---------- Log / edit form ----------
   Distance, time and pace (or speed for rides): fill in any two and the third
   is worked out. A field the app filled in is "auto" and gets replaced first. */
function cfRead(st){
  const erg = CT[st.type].erg;
  const km = toNum(st.dist) > 0 ? (erg ? toNum(st.dist) / 1000 : fromDist(toNum(st.dist))) : 0;
  const dur = (st.h + st.m + st.s).trim() ? (toNum(st.h) || 0)*3600 + (toNum(st.m) || 0)*60 + (toNum(st.s) || 0) : 0;
  let rate = 0;
  if(CT[st.type].speed){ const v = toNum(st.spd); rate = v > 0 ? fromDist(v) : 0; }
  else if((st.pm + st.ps).trim()){ const sec = (toNum(st.pm) || 0)*60 + (toNum(st.ps) || 0); rate = sec > 0 ? (erg ? sec * 2 : sec / (DU() === 'mi' ? MI : 1)) : 0; }
  return { km, dur, rate };
}
const CF_GROUP = { dist:'dist', h:'time', m:'time', s:'time', pm:'pace', ps:'pace', spd:'pace' };
function cfSet(st, el, g, val){
  const put = (f, v) => { st[f] = v; const i = el && el.querySelector(`[data-f="${f}"],[data-cf="${f}"]`); if(i){ i.value = v; i.classList.add('auto'); } };
  const erg = CT[st.type].erg;
  if(g === 'dist') put('dist', val ? (erg ? String(Math.round(val * 1000)) : fmtNum(toDist(val), 2)) : '');
  else if(g === 'time'){
    const t = val ? Math.round(val) : 0;
    if(st.noH){ put('h', ''); put('m', t ? String(Math.floor(t/60)) : ''); put('s', t ? pad(t%60) : ''); }
    else { put('h', t >= 3600 ? String(Math.floor(t/3600)) : ''); put('m', t ? (t >= 3600 ? pad(Math.floor(t%3600/60)) : String(Math.floor(t/60))) : ''); put('s', t ? pad(t%60) : ''); }
  }
  else if(CT[st.type].speed) put('spd', val ? fmtNum(toDist(val), 1) : '');
  else { const p = val ? Math.round(erg ? val / 2 : val * (DU() === 'mi' ? MI : 1)) : 0; put('pm', p ? String(Math.floor(p/60)) : ''); put('ps', p ? pad(p%60) : ''); }
}
function cfCompute(st, target){
  const v = cfRead(st), speed = CT[st.type].speed;
  const has = { dist:v.km > 0, time:v.dur > 0, pace:v.rate > 0 };
  if(!['dist','time','pace'].filter(x => x !== target).every(x => has[x])) return null;
  if(target === 'pace') return speed ? v.km / (v.dur/3600) : v.dur / v.km;
  if(target === 'time') return speed ? v.km / v.rate * 3600 : v.km * v.rate;
  return speed ? v.rate * v.dur / 3600 : v.dur / v.rate;
}
function cfDerive(st, el, g){
  st.order = [g, ...st.order.filter(x => x !== g)]; st.auto.delete(g);
  if(el) Object.keys(CF_GROUP).filter(f => CF_GROUP[f] === g).forEach(f => { const i = el.querySelector(`[data-f="${f}"],[data-cf="${f}"]`); if(i) i.classList.remove('auto'); });
  const v = cfRead(st), has = { dist:v.km > 0, time:v.dur > 0, pace:v.rate > 0 };
  const others = ['dist','time','pace'].filter(x => x !== g), age = x => { const i = st.order.indexOf(x); return i < 0 ? 99 : i; };
  const target = others.find(x => st.auto.has(x)) || others.find(x => !has[x]) || others.sort((a, b) => age(b) - age(a))[0];
  const val = cfCompute(st, target);
  if(val != null && isFinite(val) && val > 0){ cfSet(st, el, target, val); st.auto.add(target); }
  else if(st.auto.has(target)) cfSet(st, el, target, null);
}

/* ---------- Progress → Cardio ---------- */
function renderCardio(v, head){
  if(!S.cardio.length){
    v.innerHTML = head + emptyHTML('run', 'No cardio yet', 'Log runs, rides, rows and Stair Master climbs, on their own or inside a workout, to see your distance, pace and records here.', `<button class="btn btn-primary" data-a="log-cardio">${ic('plus')} Log Cardio</button>`);
    return;
  }
  const present = CTYPES.filter(t => S.cardio.some(a => a.type === t));
  let f = ui.cardioType;
  if(present.length === 1) f = present[0];
  else if(f !== 'all' && !present.includes(f)) f = ui.cardioType = 'all';
  const list = S.cardio.filter(a => f === 'all' || a.type === f).sort((a, b) => new Date(a.start) - new Date(b.start));
  const now = new Date(), ws = startOfWeek(now), ms = new Date(now.getFullYear(), now.getMonth(), 1);
  const wkL = list.filter(a => new Date(a.start) >= ws), moL = list.filter(a => new Date(a.start) >= ms);
  const ft = f === 'all' ? null : CT[f];
  // Stair Master is measured in time; rower and ski erg in metres; everything else in km/mi.
  const tDist = km => ft && ft.erg ? Math.round(km * 1000).toLocaleString() + '<small>m</small>' : fmtNum(toDist(km), 1) + `<small>${DU()}</small>`;
  const tTime = l => { const sec = l.reduce((x, a) => x + (a.dur || 0), 0); return sec ? fmtDurShort(sec*1000) : '—'; };
  const countW = n => f === 'all' ? actWord(n) : plural(n, CT[f].noun);
  let t4;
  if(ft && ft.stairs){
    const rec = list.filter(a => now - new Date(a.start) < 30*864e5 && a.level);
    t4 = tile('Avg. level', rec.length ? fmtNum(rec.reduce((x, a) => x + a.level, 0) / rec.length, 1) : '—', 'last 30 days');
  } else if(ft && ft.erg){
    const rec = list.filter(a => now - new Date(a.start) < 30*864e5 && a.dist > 0 && a.dur > 0);
    const d = sumDist(rec), sec = rec.reduce((x, a) => x + a.dur, 0);
    t4 = tile('Avg. pace', d ? fmtClock(sec / (d * 2)) + '<small>/500m</small>' : '—', 'last 30 days');
  } else if(f === 'all'){
    const sec = moL.reduce((x, a) => x + (a.dur || 0), 0);
    t4 = tile('Time this month', sec ? fmtDurShort(sec*1000) : '—', countW(moL.length));
  } else {
    const rec = list.filter(a => now - new Date(a.start) < 30*864e5 && a.dist > 0 && a.dur > 0);
    const d = sumDist(rec), sec = rec.reduce((x, a) => x + a.dur, 0);
    t4 = CT[f].speed ? tile('Avg. speed', d ? fmtSpeed(d / (sec/3600)) + `<small>${SU()}</small>` : '—', 'last 30 days')
      : tile('Avg. pace', d ? fmtPace(sec / d) + `<small>${PU()}</small>` : '—', 'last 30 days');
  }
  const C_ = cardioCache(), recTypes = f === 'all' ? present : [f];
  const recRows = type => {

const RECAP = { bg:['#1c2110', '#0b0c0f'], gold:['#e4ff7a', '#c6f135', '#9ccb16'], frame:'rgba(198,241,53,.45)', soft:'#aab38a',

/* In the picked accent: the volt colours above unless another one is chosen. */
function recapColors(){

/* The logo as a standalone SVG for the image. The accent recolours the on-screen logo through CSS,

function markForImage(size){
  const box = document.createElement('div'); box.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden';
  box.innerHTML = logoMark(size); document.body.appendChild(box);
  box.querySelectorAll('stop').forEach(st => st.setAttribute('stop-color', getComputedStyle(st).stopColor));
  const svg = box.innerHTML; box.remove(); return svg;

function monthStats(now = new Date()){
  const s = new Date(now.getFullYear(), now.getMonth(), 1), e = new Date(now.getFullYear(), now.getMonth() + 1, 1);
  const inR = x => { const t = new Date(x.start); return t >= s && t < e; };
  const ses = S.sessions.filter(inR), car = S.cardio.filter(inR), solo = loneCardio().filter(inR), prs = cache().prs, cprs = cardioCache().prs;
  // A workout's own cardio is already inside the workout's time and count.
  const sec = ses.reduce((a, x) => a + (sessDur(x) || 0) / 1000, 0) + solo.reduce((a, x) => a + (x.dur || 0), 0);
  const prCount = ses.reduce((a, x) => a + (prs[x.id] || []).length, 0) + car.reduce((a, x) => a + (cprs[x.id] || []).length, 0);
  let top = null;
  ses.forEach(x => x.entries.forEach(en => en.sets.forEach(st => { if(st.w > 0 && !st.t && (!top || st.w > top.w)) top = { w:st.w, r:st.r, name:en.name }; })));
  return { month:s.toLocaleDateString(undefined, { month:'long', year:'numeric' }), monthShort:s.toLocaleDateString(undefined, { month:'long' }),
    count:ses.length + solo.length, sec, prCount, top, km:sumDist(car) };
}

/* Sharing: the image file is made before the sheet opens, so tapping Share calls navigator.share straight
   away. iPhones only show the share sheet (Save Image, Copy, apps, Files) for a call made right inside the
   tap, and only on https pages. Where sharing isn't offered (the plain-http test server, some desktop
   browsers) the picture can still be pressed and held to save it, and computers download it instead. */
async function openRecap(){
  const cv = await recapCanvas(), blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  if(!blob){ toast('Couldn’t make the image'); return; }
  const url = URL.createObjectURL(blob), name = `repbyrep-recap-${dayKey(new Date())}.png`;
  const file = new File([blob], name, { type:'image/png' });
  let canShare = false; try { canShare = !!(navigator.share && navigator.canShare && navigator.canShare({ files:[file] })); } catch(e){}
  const hold = isIOS ? 'Press and hold the picture, then tap <b>Save to Photos</b> or <b>Share</b>.' : '';
  openSheet({ full:true,
    render: () => `${sheetHead(btnClose(), 'Monthly Recap', '')}<div class="sheet-body">
      <img class="recap-img" src="${url}" alt="Your monthly recap">
      ${canShare || !isIOS ? `<div class="btn-col"><button class="btn btn-block btn-primary" data-a="img">${ic(canShare ? 'share' : 'download')} ${canShare ? 'Share Image' : 'Save Image'}</button></div>` : ''}
      <div class="caption">${canShare ? 'Save it to Photos, send it in WhatsApp or post it to Instagram.' + (hold ? ' Or ' + hold[0].toLowerCase() + hold.slice(1) : '') : hold || 'Saves the picture to your downloads.'} It shows this month so far.</div></div>`,
    actions:{
      img: () => {
        if(canShare){
          navigator.share({ files:[file] }).catch(e => { if(e && e.name !== 'AbortError') toast(isIOS ? 'Couldn’t open sharing — press and hold the picture instead' : 'Couldn’t open sharing'); });

        }
        const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); toast('Image downloaded');

    },
    onClose: () => setTimeout(() => URL.revokeObjectURL(url), 1000) });
}

/* ---------- Plate calculator ---------- */
function plateHTML(target){
  const u = U(), bar = S.settings.bar[u], plates = [...S.settings.plates[u]].sort((a,b) => b - a);
  if(isNaN(target)) return '';
  if(target < bar) return `<div class="plate-text muted" style="margin-top:30px">That’s less than the bar (${fmtNum(bar)} ${u}).</div>`;
  let side = (target - bar) / 2 + 1e-9; const used = [];
  for(const p of plates){ while(side >= p){ used.push(p); side -= p; } }
  const actual = bar + 2 * used.reduce((a,b) => a + b, 0), max = plates[0] || 1;
  const col = p => (PLATE_COLORS[u] || {})[p] || '#8e8e93';
  return `<div class="bar-vis"><div class="bv-shaft"></div><div class="bv-collar"></div>${used.map(p => `<div class="bv-plate" style="height:${Math.round(44 + 96 * p / max)}px;background:${col(p)}"></div>`).join('')}<div class="bv-sleeve"></div></div>
    <div class="plate-text">${used.length ? `Each side: <b>${used.map(p => fmtNum(p)).join(' + ')}</b>` : 'Just the bar'}<div class="small muted">Bar ${fmtNum(bar)} ${u}${Math.abs(actual - target) > 1e-6 ? ` · closest you can load is <b style="color:var(--orange)">${fmtNum(actual)} ${u}</b>` : ''}</div></div>`;
}
function openPlates(kg){
  const u = U(), step = u === 'kg' ? 2.5 : 5;
  const st = { v: kg != null && kg > 0 ? +fmtW(kg) : (u === 'kg' ? 60 : 135) };
  const out = s => { s.el.querySelector('.plate-out').innerHTML = plateHTML(st.v); };
  openSheet({
    render: () => `${sheetHead('', 'Plate Calculator', btnClose('Done', true))}<div class="sheet-body">
      <div class="plate-input"><button class="btn-icon lg" data-a="step" data-d="-1" aria-label="Decrease">−</button><div class="pi-wrap"><input class="pi" inputmode="decimal" value="${fmtNum(st.v)}" aria-label="Target weight"><span>${u}</span></div><button class="btn-icon lg" data-a="step" data-d="1" aria-label="Increase">+</button></div>
      <div class="plate-out"></div></div>`,
    mount: s => { const i = s.el.querySelector('.pi'); i.oninput = () => { st.v = toNum(i.value); out(s); }; out(s); },
    actions: { step: (t, e, s) => { st.v = Math.max(0, (isNaN(st.v) ? 0 : st.v) + (+t.dataset.d) * step); s.el.querySelector('.pi').value = fmtNum(st.v); out(s); } }
  });
}

/* =========================================================
   Backup, import, CSV
   ========================================================= */
function backupJSON(){ return JSON.stringify({ app:'IronTrack', version:4, exportedAt:new Date().toISOString(), data:{ settings:S.settings, exercises:S.exercises, routines:S.routines, sessions:S.sessions, body:S.body, cardio:S.cardio } }); }
function markBackup(){ S.settings.lastBackup = new Date().toISOString(); save(); if(ui.tab === 'settings' || ui.tab === 'workout') render(); }
async function saveFile(name, text, type){
  const blob = new Blob([text], { type });
  if(matchMedia('(pointer:coarse)').matches){
    try {
      const file = new File([blob], name, { type });
      if(navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], title:name }); return true; }
    } catch(e){ if(e && e.name === 'AbortError') return false; }
  }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  return true;
}
async function exportFile(){ if(await saveFile(`repbyrep-backup-${dayKey(new Date())}.json`, backupJSON(), 'application/json')){ markBackup(); toast('Backup saved'); } }
async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; } catch(e){}
  const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;opacity:0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false; try { ok = document.execCommand('copy'); } catch(e){}
  ta.remove(); return ok;
}
async function copyCode(){
  if(await copyText(backupJSON())){ markBackup(); toast('Backup code copied — paste it into Notes'); }
  else dialog({ title:'Copy this code', message:'Your browser blocked automatic copying. Select all of the text below and copy it.', input:{ multiline:true, value:backupJSON() }, buttons:[{ k:'ok', label:'Done', bold:true }] });
}
function parseBackup(text){
  let o;
  try { o = JSON.parse(String(text).trim()); } catch(e){ throw new Error('That doesn’t look like backup data from this app.'); }
  if(o && o.data && Array.isArray(o.data.sessions)) o = o.data;
  if(o && Array.isArray(o.sessions)){ const n = normalize(o); return { exercises:n.exercises, sessions:n.sessions, routines:n.routines, settings:o.settings ? n.settings : null, body:o.body ? n.body : null, cardio:Array.isArray(o.cardio) ? n.cardio : null }; }
  if(o && Array.isArray(o.history) && Array.isArray(o.exercises)){ const c = fromV3(o); return { exercises:c.exercises, sessions:c.sessions, routines:[], settings:null, body:null, cardio:null }; }
  throw new Error('No workouts were found in that data.');
}
async function importText(text){
  let p;
  try { p = parseBackup(text); } catch(e){ dialog({ title:'Couldn’t import', message:e.message }); return; }
  const bodyN = p.body ? p.body.entries.length : 0, cardN = p.cardio ? p.cardio.length : 0;
  const k = await dialog({ title:'Import backup', message:`Found ${plural(p.sessions.length,'workout')}, ${plural(p.exercises.length,'exercise')}, ${plural(p.routines.length,'routine')}${cardN ? `${bodyN ? ',' : ' and'} ${cardN} cardio ${cardN === 1 ? 'activity' : 'activities'}` : ''}${bodyN ? ` and ${bodyN} body ${bodyN === 1 ? 'entry' : 'entries'}` : ''}.`,
    buttons:[{ k:'merge', label:'Merge With My Data', bold:true }, { k:'replace', label:'Replace All My Data', red:true }, { k:'cancel', label:'Cancel' }] });
  if(k === 'replace'){
    if(!(await confirmDlg('Replace everything?', 'Your current workouts, exercises and routines will be overwritten by the backup.', 'Replace'))) return;
    S.exercises = p.exercises.length ? p.exercises : S.exercises; S.sessions = p.sessions; S.routines = p.routines;
    if(p.settings) S.settings = { ...p.settings, lastBackup:S.settings.lastBackup };
    if(p.body) S.body = p.body;
    if(p.cardio) S.cardio = p.cardio;
  } else if(k === 'merge'){
    const remap = {};
    for(const e of p.exercises){
      if(S.exercises.some(x => x.id === e.id)) continue;
      const same = S.exercises.find(x => x.name.toLowerCase() === e.name.toLowerCase());
      if(same) remap[e.id] = same.id; else S.exercises.push(e);
    }
    const fix = id => remap[id] || id;
    const ids = new Set(S.sessions.map(s => s.id));
    let added = 0;
    for(const s of p.sessions){ if(ids.has(s.id)) continue; s.entries.forEach(e => { e.exId = fix(e.exId); }); S.sessions.push(s); added++; }
    const rids = new Set(S.routines.map(r => r.id));
    for(const r of p.routines){ if(rids.has(r.id)) continue; r.items.forEach(i => { if(i.exId != null) i.exId = fix(i.exId); }); S.routines.push(r); }
    const cids = new Set(S.cardio.map(a => a.id));
    let addedC = 0;
    for(const a of p.cardio || []){ if(cids.has(a.id)) continue; S.cardio.push(a); addedC++; }
    if(p.body){
      for(const e of p.body.entries){
        const mine = S.body.entries.find(x => x.date === e.date);
        if(!mine) S.body.entries.push(e);
        else BODY_METRICS.forEach(m => { if(mine[m.k] == null && e[m.k] != null) mine[m.k] = e[m.k]; });
      }
      if(!S.body.height && p.body.height) S.body.height = p.body.height;
      S.body.track = BODY_METRICS.map(m => m.k).filter(k => S.body.track.includes(k) || p.body.track.includes(k));
    }
    save(); refresh(); toast(`Merged — ${plural(added,'new workout')}${addedC ? ` and ${addedC} cardio` : ''} added`); return;
  } else return;
  save(); refresh(); toast('Backup restored');
}
async function pasteCode(){
  const r = await dialog({ title:'Paste backup code', message:'Paste a code copied from this app (or from IronTrack, its old name) — codes from the old v3 app work too.', input:{ multiline:true, placeholder:'Paste here…' }, buttons:[{ k:'cancel', label:'Cancel' }, { k:'ok', label:'Import', bold:true }] });
  if(r.k === 'ok' && r.value.trim()) importText(r.value);
}
function toCSV(rows){
  const cell = v => { const t = String(v ?? ''); return /[",\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  return '\ufeff' + rows.map(r => r.map(cell).join(',')).join('\r\n');
}
function exportCSV(){
  const u = U(), rows = [['Date','Time','Workout','Exercise','Muscle group','Set',`Weight (${u})`,'Reps','Time (s)',`Est. 1RM (${u})`,'Duration (min)','Notes']];
  for(const s of cache().sorted){
    const d = new Date(s.start), dur = sessDur(s);
    s.entries.forEach(e => e.sets.forEach((x, i) => rows.push([dayKey(d), s.legacy ? '' : fmtTime(s.start), s.name, e.name, e.cat, i+1, fmtW(x.w), x.r || '', x.t || '', x.w && !x.t ? fmtW1(e1rm(x.w, x.r)) : '', dur ? Math.round(dur/60000) : '', s.notes || ''])));
  }
  saveFile(`repbyrep-workouts-${dayKey(new Date())}.csv`, toCSV(rows), 'text/csv').then(ok => { if(ok) toast('CSV exported'); });
}
function exportBodyCSV(){
  if(!S.body.entries.length){ toast('No body measurements logged yet'); return; }
  const rows = [['Date', ...BODY_METRICS.map(m => `${m.label} (${metricUnit(m)})`)]];
  S.body.entries.slice().sort((a, b) => a.date < b.date ? -1 : 1).forEach(e => rows.push([e.date, ...BODY_METRICS.map(m => e[m.k] != null ? fmtMetric(m, e[m.k]) : '')]));
  saveFile(`repbyrep-body-${dayKey(new Date())}.csv`, toCSV(rows), 'text/csv').then(ok => { if(ok) toast('Body metrics exported'); });
}
async function eraseAll(){
  if(!(await confirmDlg('Erase all data?', 'Every workout, cardio activity, exercise, routine and body measurement will be deleted from this device. This can’t be undone — export a backup first if you might want it.', 'Erase Everything'))) return;

/* =========================================================
   Keyboard accessory bar (± steppers, plates, tick) for set inputs
   ========================================================= */
const kbd = $('#kbd');
let kbdTarget = null;
function posKbd(){
  if(kbd.classList.contains('hidden')) return;
  const vv = window.visualViewport;
  const off = vv ? window.innerHeight - vv.height - vv.offsetTop : 0;
  kbd.style.transform = `translateY(${-Math.max(0, off)}px)`;
}
function showKbd(t){
  kbdTarget = t;
  const isW = t.dataset.f === 'w', step = kbdStep(t);
  kbd.innerHTML = `<button data-k="-">−${fmtNum(step)}</button><button data-k="+">+${fmtNum(step)}</button>${isW ? `<button data-k="plates" aria-label="Plate calculator">${ic('plates')}</button>` : ''}<span class="sp"></span>${t.closest('.editor.edit') ? '' : `<button class="ok" data-k="tick">${ic('check')} Done set</button>`}`;
  kbd.classList.remove('hidden'); posKbd();
  setTimeout(() => {
    const vv = window.visualViewport, limit = (vv ? vv.height + vv.offsetTop : window.innerHeight) - kbd.offsetHeight - 8;
    const r = t.getBoundingClientRect();
    if(r.bottom > limit) t.scrollIntoView({ block:'center', behavior:'smooth' });
  }, 320);
}
function kbdStep(t){ const f = t.dataset.f; return f === 'w' ? (U() === 'lb' ? 5 : 2.5) : f === 't' ? 5 : 1; }
function hideKbd(){ kbd.classList.add('hidden'); kbdTarget = null; }
document.addEventListener('focusin', e => { if(e.target.classList && e.target.classList.contains('set-in')) showKbd(e.target); else hideKbd(); });
document.addEventListener('focusout', () => setTimeout(() => { const a = document.activeElement; if(!a || !a.classList || !a.classList.contains('set-in')) hideKbd(); }, 60));
['pointerdown', 'mousedown'].forEach(ev => kbd.addEventListener(ev, e => e.preventDefault()));
kbd.addEventListener('click', e => {
  const b = e.target.closest('[data-k]'), t = kbdTarget; if(!b || !t) return;
  const k = b.dataset.k, isW = t.dataset.f === 'w';
  if(k === '+' || k === '-'){
    const step = kbdStep(t);
    let cur = toNum(t.value); if(isNaN(cur)) cur = toNum(t.placeholder); if(isNaN(cur)) cur = 0;
    let nv = Math.max(0, cur + (k === '+' ? step : -step));
    nv = isW ? Math.round(nv * 100) / 100 : Math.round(nv);
    t.value = String(nv); t.dispatchEvent(new Event('input', { bubbles:true }));
  } else if(k === 'plates'){
    const v = toNum(t.value) || toNum(t.placeholder); t.blur(); openPlates(isNaN(v) ? null : fromDisp(v));
  } else if(k === 'tick'){
    const btn = t.closest('.set-row')?.querySelector('[data-ed=check]'); t.blur(); if(btn) btn.click();
  }
});
if(window.visualViewport){ visualViewport.addEventListener('resize', posKbd); visualViewport.addEventListener('scroll', posKbd); }

  'sess-fold': t => {
    const id = t.dataset.id, open = !ui.histOpen.has(id), card = t.closest('.sess-fold'), list = card && card.querySelector('.sess-ex');
    open ? ui.histOpen.add(id) : ui.histOpen.delete(id);
    t.setAttribute('aria-expanded', String(open)); if(card) card.classList.toggle('open', open); if(list) list.hidden = !open;
  },
  'install-x': () => { prefSet('it_hide_install', '1'); render(); },
  'prog-view': t => { ui.progView = t.dataset.v; render(); },
  'len-unit': t => { S.settings.lenUnit = t.dataset.v; save(); render(); },
  'body-log': () => openBodyLog(),
  'body-track': () => openBodyTrack(),
  'body-height': () => editHeight(),
  'body-remind': () => chooseRemind(),
  'body-nudge-x': () => { prefSet('it_body_nudge', String(Date.now())); render(); },
  metric: t => openMetric(t.dataset.k),
  'export-body-csv': () => exportBodyCSV(),
  'log-cardio': () => openCardioLog(null),
  'cardio-progress': () => { ui.progView = 'cardio'; setTab('progress'); },
  cardio: t => openCardio(t.dataset.id),
  'cardio-filter': t => { ui.cardioType = t.dataset.v; render(); },
  'dist-unit': t => { S.settings.distUnit = t.dataset.v; save(); render(); },
  'export-cardio-csv': () => exportCardioCSV(),
  'hist-add': async () => {
    const k = await actionSheet({ title:'Log something you’ve done', actions:[{ k:'w', label:'Finished Workout' }, { k:'c', label:'Run, Walk, Hike or Ride' }] });
    if(k === 'w') logFinished(); else if(k === 'c') openCardioLog(null);
  },
  'add-starters': () => {
    const n = addStarterRoutines(S.exercises, S.routines);
    if(!n){ toast('You already have all the starter routines'); return; }
    save(); refresh(); toast(`Added ${plural(n, 'starter routine')}`);
  }
};
$('#app').addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if(!t) return;
  const fn = ACT[t.dataset.a]; if(fn) fn(t, e);
});
$('#file-in').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if(f) importText(await f.text());
});

/* =========================================================
   Boot
   ========================================================= */
const returning = (() => { try { return !!localStorage.getItem(KEY); } catch(e){ return false; } })();   // had data before this version?
S = load();
if(migratedCount) save();
if(S.active && S.active.restEnd > Date.now()){ rest.end = S.active.restEnd; rest.total = S.active.restTotal || S.settings.rest; }
$('#tabbar').innerHTML = TABS.map(([id, icon, label]) => `<button class="tab" data-a="tab" data-tab="${id}">${ic(icon)}<span>${label}</span></button>`).join('');
setTab('workout');
setInterval(tick, 250);
syncWakeLock();
document.addEventListener('pointerdown', () => { if(!actx || actx.state === 'suspended') unlockAudio(); }, { passive:true });
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') flushSave(); syncWakeLock(); });
window.addEventListener('pagehide', flushSave);
let resizeT;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if(ui.tab === 'progress') render(); sheets.forEach(s => { if(s.opts.live) s.rerender(); }); }, 200); });
if(migratedCount) setTimeout(() => toast(`Imported ${plural(migratedCount,'workout')} from IronTrack v3`), 600);
if(prefGet(WN_KEY) !== WN_V){ if(returning) setTimeout(openWhatsNew, 500); else prefSet(WN_KEY, WN_V); }
if('serviceWorker' in navigator && (isHosted || location.hostname === 'localhost')){
  navigator.serviceWorker.register('sw.js').catch(() => {});
  const checkUpdate = () => navigator.serviceWorker.ready.then(reg => { if(reg.active) reg.active.postMessage('check'); }).catch(() => {});
  checkUpdate();
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') checkUpdate(); });
  let updatePrompted = false;
  navigator.serviceWorker.addEventListener('message', async e => {
    if(e.data !== 'update-ready' || updatePrompted) return;
    updatePrompted = true;
    const k = await dialog({ title:'Update ready', message:`A new version of ${APP.name} has downloaded. Your data isn’t affected.`, buttons:[{ k:'later', label:'Later' }, { k:'reload', label:'Reload', bold:true }] });
    if(k === 'reload'){ flushSave(); location.reload(); }
  });
  navigator.serviceWorker.startMessages();
}
</script>
</body>
</html>
